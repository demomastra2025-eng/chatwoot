worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  map_hash_bucket_size 128;
  include /etc/nginx/remote-janus-auth.map.conf;
  default_type application/octet-stream;
  log_format crafty_json escape=json
    '{'
      '"time_local":"$time_local",'
      '"remote_addr":"$remote_addr",'
      '"x_forwarded_for":"$proxy_add_x_forwarded_for",'
      '"request_id":"$request_id",'
      '"host":"$host",'
      '"server_name":"$server_name",'
      '"method":"$request_method",'
      '"request_uri":"$request_uri",'
      '"uri":"$uri",'
      '"args":"$args",'
      '"status":$status,'
      '"body_bytes_sent":$body_bytes_sent,'
      '"request_time":$request_time,'
      '"upstream_addr":"$upstream_addr",'
      '"upstream_status":"$upstream_status",'
      '"upstream_response_time":"$upstream_response_time",'
      '"http_referer":"$http_referer",'
      '"http_user_agent":"$http_user_agent",'
      '"http_x_forwarded_proto":"$http_x_forwarded_proto"'
    '}';
  log_format janus_asterisk_auth_diag escape=json
    '{'
      '"time_local":"$time_local",'
      '"remote_addr":"$remote_addr",'
      '"ticket":"$janus_asterisk_ticket_state",'
      '"origin":"$http_origin",'
      '"status":$status,'
      '"upstream_status":"$upstream_status"'
    '}';
  map $janus_asterisk_ticket $janus_asterisk_ticket_state {
    "" missing;
    default present;
  }
  access_log /dev/stdout crafty_json;
  error_log /dev/stderr warn;

  sendfile on;
  keepalive_timeout 65;
  underscores_in_headers on;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/rss+xml
    application/vnd.ms-fontobject
    application/xml
    font/otf
    font/ttf
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' '';
  }

  map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
  }

  map $http_x_forwarded_for $janus_client_key {
    default $http_x_forwarded_for;
    '' $remote_addr;
  }

  limit_conn_zone $janus_client_key zone=janus_ws_connections:10m;
  limit_req_zone $janus_client_key zone=janus_ws_upgrades:10m rate=120r/m;
  limit_req_zone $binary_remote_addr zone=notification_login:10m rate=5r/m;

  upstream chatwoot_backend {
    zone chatwoot_backend 64k;
    least_conn;
    server chatwoot_rails:3000 resolve max_fails=3 fail_timeout=10s;
    server chatwoot_rails_2:3000 resolve max_fails=3 fail_timeout=10s;
    keepalive 32;
  }

  upstream telegram_personal_gateway_backend {
    zone telegram_personal_gateway_backend 64k;
    server telegram_personal_gateway:8000 resolve max_fails=3 fail_timeout=10s;
  }


  upstream janus_gateway_ws {
    zone janus_gateway_ws 64k;
    server janus_gateway:8188 resolve max_fails=3 fail_timeout=10s;
  }

  upstream janus_asterisk_gateway_ws {
    zone janus_asterisk_gateway_ws 64k;
    server 172.18.0.1:8189 max_fails=3 fail_timeout=10s;
  }

  upstream onelink_ai_voice_backend {
    zone onelink_ai_voice_backend 64k;
    server onelink_ai_voice:8081 resolve max_fails=3 fail_timeout=10s;
  }

  upstream onelink_ai_voice_pipecat_backend {
    zone onelink_ai_voice_pipecat_backend 64k;
    server onelink_ai_voice_pipecat:8084 resolve max_fails=3 fail_timeout=10s;
  }

  upstream onelink_ai_voice_dev_backend {
    zone onelink_ai_voice_dev_backend 64k;
    server 172.18.0.1:8082 max_fails=3 fail_timeout=10s;
  }

  upstream notification_api_backend {
    zone notification_api_backend 64k;
    server notification_api:8080 resolve max_fails=3 fail_timeout=10s;
  }

  upstream notification_frontend_backend {
    zone notification_frontend_backend 64k;
    server notification_frontend:8080 resolve max_fails=3 fail_timeout=10s;
  }

  server {
    listen 80;
    server_name website.one-link.kz www.one-link.kz;
    return 308 https://one-link.kz$request_uri;
  }

  server {
    listen 80;
    server_name one-link.kz;
    root /srv/onelink-website;
    index index.html;
    client_max_body_size 100m;

    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    proxy_set_header api_access_token $http_api_access_token;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location ^~ /legal/ {
      default_type text/html;
      try_files $uri.html =404;
      expires -1;
      add_header Cache-Control "no-cache";
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location ^~ /assets/ {
      try_files $uri =404;
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /fonts/Geist/ {
      proxy_pass http://chatwoot_backend;
      proxy_read_timeout 300s;
    }

    location ^~ /fonts/GeistMono/ {
      proxy_pass http://chatwoot_backend;
      proxy_read_timeout 300s;
    }

    location ^~ /fonts/GeistPixel/ {
      proxy_pass http://chatwoot_backend;
      proxy_read_timeout 300s;
    }

    # Preserve background compatibility for stale sessions and external callbacks.
    location ^~ /api/ {
      proxy_pass http://chatwoot_backend;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_read_timeout 36000s;
    }

    location ^~ /auth/ {
      proxy_pass http://chatwoot_backend;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_read_timeout 36000s;
    }

    location ^~ /webhooks/ {
      proxy_pass http://chatwoot_backend;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_read_timeout 36000s;
    }

    location = /cable {
      proxy_pass http://chatwoot_backend;
      proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
      proxy_next_upstream_tries 3;
      proxy_read_timeout 36000s;
    }

    location ^~ /rails/ {
      proxy_pass http://chatwoot_backend;
      proxy_read_timeout 36000s;
    }

    location ^~ /vite/ {
      proxy_pass http://chatwoot_backend;
      proxy_read_timeout 300s;
    }

    location ^~ /brand-assets/ {
      proxy_pass http://chatwoot_backend;
      proxy_read_timeout 300s;
    }

    location = /manifest.json {
      proxy_pass http://chatwoot_backend;
      proxy_read_timeout 300s;
    }

    location = /sw.js {
      proxy_pass http://chatwoot_backend;
      proxy_read_timeout 300s;
    }

    location = /favicon.svg {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=86400";
      add_header X-Content-Type-Options "nosniff" always;
    }

    location = /android-icon-144x144.png {
      proxy_pass http://chatwoot_backend;
      proxy_read_timeout 300s;
    }

    # Canonical public website. The dashboard remains on app.one-link.kz.
    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache";
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
    }
  }

  server {
    listen 80;
    server_name dev.one-link.kz;

    # Development Janus is served only by Caddy with ticket authorization.
    # This production gateway must never expose a secondary bypass.
    location = /janus-sipuni {
      return 421;
    }

    # Asterisk Janus is production-only. Never expose the production gateway
    # through the development host.
    location = /janus-asterisk {
      return 421;
    }

    location ^~ /ai-voice/janus-sip/browser-media/ {
      limit_conn janus_ws_connections 8;
      limit_req zone=janus_ws_upgrades burst=20 nodelay;
      access_log off;
      proxy_pass http://onelink_ai_voice_dev_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 36000s;
      proxy_send_timeout 36000s;
      proxy_buffering off;
    }

    location ^~ /ai-voice/ {
      proxy_pass http://onelink_ai_voice_dev_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 36000s;
      proxy_send_timeout 36000s;
      proxy_buffering off;
    }

    location / {
      return 421;
    }
  }

  server {
    listen 80;
    server_name app.one-link.kz api.one-link.kz vmi2592560.contaboserver.net _;
    client_max_body_size 100m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    proxy_set_header api_access_token $http_api_access_token;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 10s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
    proxy_next_upstream_tries 3;

    location ^~ /fonts/Geist/ {
      proxy_pass http://chatwoot_backend;
      proxy_read_timeout 300s;
    }

    location ^~ /fonts/GeistMono/ {
      proxy_pass http://chatwoot_backend;
      proxy_read_timeout 300s;
    }

    location ^~ /fonts/GeistPixel/ {
      proxy_pass http://chatwoot_backend;
      proxy_read_timeout 300s;
    }

    location = /monitoring/grafana {
      return 302 /monitoring/grafana/;
    }

    location ^~ /monitoring/grafana/ {
      set $grafana_upstream grafana:3000;
      proxy_pass http://$grafana_upstream;
      proxy_set_header X-Forwarded-Prefix /monitoring/grafana;
      proxy_read_timeout 36000s;
    }

    # Expose only transient media downloads to browsers; never expose
    # /openapi.json, /docs, /health, or /internal/* of telegram_personal_gateway.
    location ^~ /telegram-personal/media/ {
      limit_except GET HEAD {
        deny all;
      }
      proxy_pass http://telegram_personal_gateway_backend/media/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
      proxy_set_header X-Forwarded-Prefix /telegram-personal;
      proxy_set_header Cookie "";
      proxy_set_header Connection "";
      proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
      proxy_next_upstream_tries 3;
      proxy_read_timeout 300s;
    }

    location = /telegram-personal {
      return 404;
    }

    location ^~ /telegram-personal/ {
      return 404;
    }


    location = /_internal/janus-sipuni-auth {
      internal;
      proxy_pass http://chatwoot_backend/internal/voice/janus-ws/authorize?;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Janus-Ticket $janus_sipuni_ticket;
      proxy_set_header X-Janus-Origin $http_origin;
      proxy_set_header X-Janus-Path /janus-sipuni;
    }

    location = /_internal/janus-asterisk-auth {
      internal;
      proxy_pass http://chatwoot_backend/internal/voice/janus-ws/authorize?;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Janus-Ticket $janus_asterisk_ticket;
      proxy_set_header X-Janus-Origin $http_origin;
      proxy_set_header X-Janus-Path /janus-asterisk;
    }

    # Remote Janus edges validate the same signed, single-use browser ticket.
    # A separate server-to-server secret prevents exposing the Rails validator
    # as a public ticket oracle.
    location = /_remote/janus-beeline-auth {
      if ($remote_janus_auth_ok = 0) { return 404; }
      access_log off;
      proxy_pass http://chatwoot_backend/internal/voice/janus-ws/authorize?;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Janus-Ticket $http_x_janus_ticket;
      proxy_set_header X-Janus-Origin $http_x_janus_origin;
      proxy_set_header X-Janus-Path $http_x_janus_path;
    }

    # The Rails endpoint is only an nginx auth subrequest target. Do not expose
    # it as a public ticket-validation oracle.
    location = /internal/voice/janus-ws/authorize {
      return 404;
    }

    location = /janus-sipuni {
      # auth_request runs in a subrequest without the original query args.
      set $janus_sipuni_ticket $arg_janus_ticket;
      auth_request /_internal/janus-sipuni-auth;
      limit_conn janus_ws_connections 200;
      limit_req zone=janus_ws_upgrades burst=100 nodelay;
      access_log off;
      set $args "";
      proxy_set_header Cookie "";
      proxy_pass http://janus_gateway_ws/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
      proxy_pass_header Sec-WebSocket-Protocol;
      proxy_read_timeout 36000s;
      proxy_send_timeout 36000s;
      proxy_buffering off;
    }

    location = /janus-asterisk {
      # auth_request runs in a subrequest without the original query args.
      set $janus_asterisk_ticket $arg_janus_ticket;
      auth_request /_internal/janus-asterisk-auth;
      limit_conn janus_ws_connections 200;
      limit_req zone=janus_ws_upgrades burst=100 nodelay;
      access_log /dev/stdout janus_asterisk_auth_diag;
      set $args "";
      proxy_set_header Cookie "";
      proxy_pass http://janus_asterisk_gateway_ws/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
      proxy_pass_header Sec-WebSocket-Protocol;
      proxy_read_timeout 36000s;
      proxy_send_timeout 36000s;
      proxy_buffering off;
    }

    location ^~ /ai-voice/janus-sip/browser-media/ {
      limit_conn janus_ws_connections 8;
      limit_req zone=janus_ws_upgrades burst=20 nodelay;
      access_log off;
      proxy_pass http://onelink_ai_voice_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 36000s;
      proxy_send_timeout 36000s;
      proxy_buffering off;
    }

    location = /voice-preview/ws {
      limit_conn janus_ws_connections 8;
      limit_req zone=janus_ws_upgrades burst=20 nodelay;
      access_log off;
      proxy_pass http://onelink_ai_voice_pipecat_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 180s;
      proxy_send_timeout 180s;
      proxy_buffering off;
    }

    location ^~ /ai-voice/ {
      proxy_pass http://onelink_ai_voice_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 36000s;
      proxy_send_timeout 36000s;
      proxy_buffering off;
    }

    location / {
      proxy_pass http://chatwoot_backend;
      proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
      proxy_next_upstream_tries 3;
      proxy_read_timeout 36000s;
    }
  }

  server {
    listen 80;
    server_name medelement.one-link.kz;
    client_max_body_size 10m;

    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location = /reset-cache {
      add_header Clear-Site-Data "\"cache\"" always;
      add_header Cache-Control "no-store, no-cache, must-revalidate" always;
      return 302 https://medelement.one-link.kz/?cache-reset=20260824-2;
    }

    location = /auth/login {
      limit_req zone=notification_login burst=5 nodelay;
      limit_req_status 429;
      proxy_pass http://notification_api_backend;
      proxy_read_timeout 30s;
    }

    location ~ ^/(v1|auth|admin|health)/ {
      proxy_pass http://notification_api_backend;
      proxy_read_timeout 30s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    location ~ ^/webhooks/(meta/)?whatsapp$ {
      proxy_pass http://notification_api_backend;
      proxy_read_timeout 30s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    location / {
      proxy_pass http://notification_frontend_backend;
      proxy_read_timeout 30s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
    }
  }
}
