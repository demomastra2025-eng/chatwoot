  settings_json_schema:
    {
      'type': 'object',
      'properties':
        {
          'api_key': { 'type': 'string' },
          'api_base': { 'type': 'string' },
          'base_url': { 'type': 'string' },
          'endpoint': { 'type': 'string' },
