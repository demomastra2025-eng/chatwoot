---
:verbose: false
:concurrency: <%= ENV.fetch("WHATSAPP_COEXISTENCE_HISTORY_SIDEKIQ_CONCURRENCY", 2) %>
:timeout: 25
:max_retries: 3

:queues:
  - whatsapp_coexistence_history
  - whatsapp_coexistence_history_recovery
  # Compatibility consumer for recovery jobs serialized before this queue split.
  - whatsappweb_history_recovery

production:
  :concurrency: <%= ENV.fetch("WHATSAPP_COEXISTENCE_HISTORY_SIDEKIQ_CONCURRENCY", 2) %>
staging:
  :concurrency: <%= ENV.fetch("WHATSAPP_COEXISTENCE_HISTORY_SIDEKIQ_CONCURRENCY", 2) %>
