features:
  editor:
    models:
      [
        openai/gpt-6-luna,
        openai/gpt-5.6-luna,
        gpt-4.1-mini,
        gpt-4.1-nano,
        gpt-5-mini,
        gpt-5.4-mini,
        gpt-5.4-nano,
        gpt-4.1,
        gpt-5.1,
        gpt-5.2,
        gpt-5.4,
        claude-haiku-4-5,
        claude-sonnet-4-6,
        gemini-2.5-flash-lite,
        gemini-2.5-flash,
        gemini-2.5-pro,
        gemini-3-flash-preview,
        gemini-3.1-pro-preview,
      ]
    default: openai/gpt-6-luna
  assistant:
    models:
      [
        openai/gpt-6-luna,
        openai/gpt-5.6-luna,
        gpt-5-mini,
        gpt-5.4-mini,
        gpt-4.1,
        gpt-5.1,
        gpt-5.2,
        gpt-5.4,
        claude-haiku-4-5,
        claude-sonnet-4-5,
        claude-sonnet-4-6,
        claude-opus-4-6,
        gemini-2.5-flash,
        gemini-2.5-pro,
        gemini-3-flash-preview,
        gemini-3.1-pro-preview,
      ]
    default: openai/gpt-6-luna
  copilot:
    models:
      [
        openai/gpt-6-luna,
        openai/gpt-5.6-luna,
        gpt-5-mini,
        gpt-5.4-mini,
        gpt-4.1,
        gpt-5.1,
        gpt-5.2,
        gpt-5.4,
        claude-haiku-4-5,
        claude-sonnet-4-5,
        claude-sonnet-4-6,
        claude-opus-4-6,
        gemini-2.5-flash,
        gemini-2.5-pro,
        gemini-3-flash-preview,
        gemini-3.1-pro-preview,
      ]
    default: openai/gpt-6-luna
  outcome_classification:
    models:
      [
        inception/mercury-decide,
        microsoft/microsoft-decision-1,
        microsoft/microsoft-decision-1-20261009,
        openai/gpt-6-luna,
        openai/gpt-5.6-luna,
        gpt-4.1-mini,
        gpt-5-mini,
        gpt-5.4-mini,
      ]
    default: inception/mercury-decide
  language_detection:
    models: [openai/gpt-6-luna-decisions, respan/span-02]
    default: openai/gpt-6-luna-decisions
  custom_guardrail:
    models: [perplexity/pplx-decider-v1.2, openai/gpt-6-luna-decisions, inception/mercury-decide, microsoft/microsoft-decision-1,
             microsoft/microsoft-decision-1-20261009, openai/gpt-6-luna, openai/gpt-5.6-luna,
             gpt-4.1-mini, gpt-5-mini, gpt-5.4-mini]
    default: perplexity/pplx-decider-v1.2
  # Decisions inside a patient turn; the call goes down the platform chain of decision models (Llm::DecisionChain).
  # The chain of agent_routing is its own (CAPTAIN_AGENT_ROUTING_MODELS): Perplexity Decider, then JEV, then Mercury Decide.
  agent_routing:
    models: [perplexity/pplx-decider-v1.2, typesafe/jev-1.14, inception/mercury-decide, perplexity/pplx-decider-flash-v1.2,
             microsoft/microsoft-decision-1, liquid/d1-ultra, respan/span-02, nace-ai/drex-max]
    default: perplexity/pplx-decider-v1.2
  fact_check_gate:
    models: [inception/mercury-decide, microsoft/microsoft-decision-1, microsoft/microsoft-decision-1-20261009,
             openai/gpt-6-luna-decisions]
    default: inception/mercury-decide
  inbound_triage:
    models: [inception/mercury-decide, microsoft/microsoft-decision-1, microsoft/microsoft-decision-1-20261009,
             openai/gpt-6-luna-decisions]
    default: inception/mercury-decide
  # The strong reasoning chat model that takes over a routing decision the decision models were not confident about
  # (Captain::Runtime::DecisionRouter::Escalation): the same state and criteria, structured output, thinking on.
  agent_routing_escalation:
    models: [openai/gpt-6-luna, openai/gpt-5.6-luna, gpt-5.4, claude-sonnet-4-6, claude-opus-4-6, gemini-3.1-pro-preview]
    default: openai/gpt-6-luna
  # Cuts the patient's message into one fragment per council participant (Captain::Runtime::CouncilSplitter); no thinking.
  council_split:
    models: [openai/gpt-6-luna, openai/gpt-5.6-luna, gpt-4.1-mini, gpt-5-mini, gpt-5.4-mini]
    default: openai/gpt-6-luna
  customer_notice:
    models: [openai/gpt-6-luna, openai/gpt-5.6-luna, gpt-4.1-mini, gpt-5-mini, gpt-5.4-mini]
    default: openai/gpt-6-luna
  label_suggestion:
    models:
      [
        openai/gpt-6-luna,
        openai/gpt-5.6-luna,
        gpt-4.1-nano,
        gpt-4.1-mini,
        gpt-5-mini,
        gpt-5.4-nano,
        gpt-5.4-mini,
        gemini-2.5-flash-lite,
        gemini-2.5-flash,
        claude-haiku-4-5,
      ]
    default: openai/gpt-6-luna
  audio_transcription:
    models: [openai/gpt-4o-mini-transcribe, openai/gpt-audio-mini, mistralai/voxtral-small-24b-2507, gpt-4o-transcribe, whisper-1]
    default: openai/gpt-4o-mini-transcribe
  image_recognition:
    models:
      [
        openai/gpt-6-luna,
        openai/gpt-5.6-luna,
        gpt-5-mini,
        gpt-5.4-mini,
        gpt-4.1,
        gpt-5.1,
        gpt-5.2,
        gpt-5.4,
        openai/gpt-5.4-mini,
        openai/gpt-5.4,
        claude-haiku-4-5,
        claude-sonnet-4-5,
        claude-sonnet-4-6,
        claude-opus-4-6,
        gemini-2.5-flash,
        gemini-2.5-pro,
        gemini-3-flash-preview,
        gemini-3.1-pro-preview,
      ]
    default: openai/gpt-6-luna
  help_center_search:
    models: [text-embedding-3-small]
    default: text-embedding-3-small
  knowledge_rerank:
    models: []
    default:
  moderation:
    models: [omni-moderation-latest, openai/gpt-oss-safeguard-20b]
    default: openai/gpt-oss-safeguard-20b
