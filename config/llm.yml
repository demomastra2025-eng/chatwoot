capability_sets:
  chat: &chat_capabilities [structured_output, tool_calling, multimodal_input, image_input, streaming]
  reasoning_chat: &reasoning_chat_capabilities [structured_output, tool_calling, multimodal_input, image_input, streaming, reasoning]

providers:
  openai:
    display_name: 'OpenAI'
    api_key_config: 'CAPTAIN_OPEN_AI_API_KEY'
    api_base_config: 'CAPTAIN_OPEN_AI_ENDPOINT'
  anthropic:
    display_name: 'Anthropic'
    api_key_config: 'CAPTAIN_ANTHROPIC_API_KEY'
    api_base_config: 'CAPTAIN_ANTHROPIC_ENDPOINT'
  gemini:
    display_name: 'Gemini'
    api_key_config: 'CAPTAIN_GEMINI_API_KEY'
    api_base_config: 'CAPTAIN_GEMINI_ENDPOINT'
  openrouter:
    display_name: 'OpenRouter'
    api_key_config: 'CAPTAIN_OPENROUTER_API_KEY'
    api_base_config: 'CAPTAIN_OPENROUTER_ENDPOINT'

models:
  gpt-4.1:
    provider: openai
    display_name: 'GPT-4.1'
    credit_multiplier: 3
    type: chat
    capabilities: *chat_capabilities
  gpt-4.1-mini:
    provider: openai
    display_name: 'GPT-4.1 Mini'
    credit_multiplier: 1
    type: chat
    capabilities: *chat_capabilities
  gpt-4.1-nano:
