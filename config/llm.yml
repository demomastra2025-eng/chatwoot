features:
  editor:
    models:
      [
        gpt-4.1-mini,
        gpt-4.1-nano,
        gpt-5-mini,
        gpt-5.4-mini,
        gpt-5.4-nano,
        gpt-4.1,
        gpt-5.1,
        gpt-5.2,
        gpt-5.4,
        claude-haiku-4-5,
        claude-sonnet-4-6,
        gemini-2.5-flash-lite,
        gemini-2.5-flash,
        gemini-2.5-pro,
        gemini-3-flash-preview,
        gemini-3.1-pro-preview,
      ]
    default: gpt-5.4-mini
  assistant:
    models:
      [
        gpt-5-mini,
        gpt-5.4-mini,
        gpt-4.1,
        gpt-5.1,
        gpt-5.2,
        gpt-5.4,
        claude-haiku-4-5,
        claude-sonnet-4-5,
        claude-sonnet-4-6,
        claude-opus-4-6,
        gemini-2.5-flash,
        gemini-2.5-pro,
        gemini-3-flash-preview,
        gemini-3.1-pro-preview,
      ]
    default: gpt-5.4
  copilot:
    models:
      [
        gpt-5-mini,
        gpt-5.4-mini,
        gpt-4.1,
        gpt-5.1,
        gpt-5.2,
        gpt-5.4,
        claude-haiku-4-5,
        claude-sonnet-4-5,
        claude-sonnet-4-6,
        claude-opus-4-6,
        gemini-2.5-flash,
        gemini-2.5-pro,
        gemini-3-flash-preview,
        gemini-3.1-pro-preview,
      ]
    default: gpt-5.4
  label_suggestion:
    models:
      [gpt-4.1-nano, gpt-4.1-mini, gpt-5-mini, gpt-5.4-nano, gpt-5.4-mini, gemini-2.5-flash-lite, gemini-2.5-flash, claude-haiku-4-5]
    default: gpt-5.4-mini
  audio_transcription:
    models: [openai/gpt-4o-audio-preview, mistralai/voxtral-small-24b-2507, gpt-4o-transcribe, whisper-1]
    default: gpt-4o-transcribe
  help_center_search:
    models: [text-embedding-3-small]
    default: text-embedding-3-small
  moderation:
    models: [openai/gpt-oss-safeguard-20b]
    default: openai/gpt-oss-safeguard-20b
