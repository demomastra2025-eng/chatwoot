# Prompts of the clinic agents for the decision router (rake captain:router_prompts:migrate; dry run by default).
# The router decides who answers each patient turn, so an agent prompt holds only its own competence: no transfers to other
# agents, no other agents' names, no coordinator role. Staff handoff steps of the agent's own procedures stay (decision D1).
#
# routing_description: the new competence card the router reads (Captain::Routing::CompetenceCard).
# description_edits:   exact find/replace pairs on the stored description (the full texts are read on PROD by the dry run; an
#                      edit whose find text is not there marks the agent edit_not_found and nothing is written for it).
# base_digest:         sha256(description + "\0" + routing_description) of the reviewed PROD texts; null = not pinned (the CONFIRM
#                      digest of the reviewed dry run still pins every stored text the apply writes over).
#
# Review notes for the owner:
# - 90: the agent name "Медсестра-координатор: Анализы, ОМС и Документы" is shown to the router as the label; a name without
#   "координатор" (for example "Медсестра: Анализы, ОМС и Документы") is recommended (names are changed in the agent settings).
# - 90: the transfer line was exported as `transfer_to_agent_<id>`; when PROD holds a real id the edit is reported not found and
#   the line must be copied from the dry run into this file.
# - The descriptions were exported up to 1500 characters: the dry run lints the whole stored text and lists every remaining
#   handoff or coordinator sentence; add an edit for each before the apply.
# - Әлия (D8): lab tests (prices, preparation, blood draw) move to the card of 108; 77 no longer lists the blood-test rules.
migration: 2026-10-router
