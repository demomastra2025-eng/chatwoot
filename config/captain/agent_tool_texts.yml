# Short English tool texts for the customer-facing agent runtime ONLY.
#
# Captain::Runtime::ToolWrapper replaces the description and the top-level parameter descriptions that the model sees with
# the texts below, and removes the listed hidden parameters from the schema the model sees (a hidden parameter that is sent
# anyway is dropped before the tool runs). The registry, the Copilot classes, MCP, voice, i18n and the UI keep their own texts.
# A tool without an entry here, and a parameter without an entry, keep their own text.
#
# Conventions: every text is English (the clinic's own data values stay as stored); no jargon and no internal ids; the global
# rules (omit unknown optional values, never guess an id, confirm before acting) live in the system prompt, not here.
# Captain::Runtime::AgentToolTexts reads this file once.
tools:
  get_appointment:
    description: "Show one appointment: date, time, specialist, status."
    params:
      appointment_id: "Appointment to show."
      appointment_access_token: "Token from search_appointments; only for another patient's appointment."
    hidden_params: []

  list_my_appointments:
    description: "The current patient's appointments, latest first, with filters. Page with offset while has_more is true."
    params:
      status: "scheduled, completed, cancelled, no_show or any (default any)."
      date_from: "First date, YYYY-MM-DD."
      date_to: "Last date, inclusive, YYYY-MM-DD."
      doctor: "Part of the doctor's name."
      limit: "Page size, 1-20 (default 10)."
      offset: "How many appointments to skip."
    hidden_params: []

  search_appointments:
    description: "Find the current patient's appointments. For another patient: exact IIN, or exact full name + resource_id + one-day from/to. A phone alone is not identity."
    params:
      client_name: "Patient name; for another patient, the exact full name."
      client_identifier: "Exact IIN; spaces and dashes are ignored."
      status: "scheduled, confirmed, completed, cancelled or no_show."
      payment_status: "awaiting_payment, prepaid, paid or cancelled."
      contact_id: "Current patient's contact ID; usually omit."
      resource_id: "Specialist; needed with a name search for another patient."
      from: "Range start, ISO 8601 date or datetime."
      to: "Range end (exclusive), ISO 8601."
      limit: "How many appointments to return."
    hidden_params: []

  list_appointment_custom_fields:
    description: "Custom fields allowed in custom_attributes: key, label, type, required, select options. Use only these keys; select values must equal option.value."
    params: {}
    hidden_params: []

  list_scheduling_resources:
    description: "List specialists and rooms; with service_id, only those offering the service. That does not mean the service suits the patient medically."
    params:
      service_id: "Keep only specialists and rooms offering this service."
      limit: "How many to return, up to 50."
    hidden_params:
      - include_inactive

  search_scheduling_resources:
    description: "Find a specialist or room by name words (any order) or specialty. A service filter does not prove medical suitability. Page with offset."
    params:
      query: "Name or specialty as written in the catalog, in the nominative case (not inflected)."
      search_by: "name, specialty or all (default all)."
      service_id: "Keep only specialists and rooms offering this service."
      limit: "How many to return, up to 50."
      offset: "next_offset from the previous result."
    hidden_params:
      - include_inactive

  get_scheduling_resource_schedule:
    description: "Working hours of one specialist for a date range, with breaks, holidays and time off. For free times use search_available_slots."
    params:
      resource_id: "Specialist."
      from: "Range start, ISO 8601."
      to: "Range end, ISO 8601; at most 31 days after from."
      include_breaks: "Include breaks (default true)."
      include_holidays: "Include holidays (default true)."
      include_time_offs: "Include time off (default true)."
    hidden_params: []

  get_scheduling_resource_availability:
    description: "Free times of one specialist or room in a date range. Returned times can be offered; booking checks them again."
    params:
      resource_id: "Specialist."
      from: "Range start, ISO 8601."
      to: "Range end, ISO 8601; at most 31 days after from."
      service_id: "Service this specialist offers; sets the duration."
      duration_min: "Duration in minutes when no service is given."
      limit: "How many slots to return, up to 50."
    hidden_params: []

  search_scheduling_services:
    description: "Find a service by name, specialty or synonym. A name match does not mean the service is medically right for the patient."
    params:
      query: "Name as in the catalog, in the nominative case: \"консультация терапевта\", not \"консультацию терапевта\"."
      limit: "How many services to return."
      offset: "next_offset from the previous result."
    hidden_params:
      - include_inactive

  search_available_slots:
    description: "Free appointment times. Returned times can be offered; booking checks them again."
    params:
      from: "Range start, ISO 8601."
      to: "Range end, ISO 8601."
      resource_ids: "Specialists."
      service_id: "Service; sets the duration."
      duration_min: "Duration in minutes when no service is given."
      limit: "How many slots to return."
    hidden_params: []

  create_appointment:
    description: "Book the patient with a specialist at a confirmed time. For a relative or another person, pass their details in patient. If the time is taken, offer another. If the tool asks to fix parameters, fix them and retry."
    params:
      resource_id: "Specialist."
      starts_at: "Local time YYYY-MM-DDTHH:MM without a timezone, or a slot time copied unchanged."
      ends_at: "Appointment end, when duration_min is not given."
      duration_min: "Duration in minutes."
      service_id: "Service from search_scheduling_services."
      appointment_type: "primary, secondary or other."
      client_comment: "Patient's comment."
      patient: "Another patient: first and last name required; middle name, IIN, birth date (YYYY-MM-DD), gender, phone if known. Never copy the person you are chatting with."
      custom_attributes: "Additional appointment fields."
    hidden_params:
      - crm_deal_id
      - crm_pipeline_id

  update_appointment:
    description: "Change an appointment: specialist, service, time or comment; pass only what changes. Check the new time is free first. If the time is taken, offer another. If the tool asks to fix parameters, fix them and retry. For another patient's appointment pass its token and patient_confirmed."
    params:
      appointment_id: "Appointment to change; pass it whenever known."
      appointment_access_token: "Token from search_appointments; only for another patient's appointment."
      patient_confirmed: "Another patient only: true once the caller confirms patient, doctor, time, change."
      resource_id: "New specialist."
      service_id: "New service from search_scheduling_services."
      starts_at: "New local time YYYY-MM-DDTHH:MM without a timezone, or a slot time copied unchanged."
      ends_at: "New end, when duration_min is not given."
      duration_min: "New duration in minutes."
      appointment_type: "primary, secondary or other."
      client_comment: "New patient comment."
      custom_attributes: "Additional appointment fields."
    hidden_params: []

  cancel_appointment:
    description: "Cancel an appointment. For another patient's appointment pass its token and patient_confirmed. If the status is cancelled_local_only, the visit stays active in the clinic's system: tell the patient clearly."
    params:
      appointment_id: "Appointment to cancel; pass it whenever known."
      appointment_access_token: "Token from search_appointments; only for another patient's appointment."
      patient_confirmed: "Another patient only: true once the caller confirms patient, doctor, time, cancellation."
    hidden_params: []

  get_contact:
    description: "Get a contact's profile by ID: name, phone, email, identifier, company, custom attributes."
    params:
      contact_id: "Contact ID."
    hidden_params: []

  get_my_contact:
    description: "The current patient's data: name, IIN, birth date, gender, contacts."
    params: {}
    hidden_params: []

  search_contacts:
    description: "Find contacts by exact email, exact phone or part of a name; filters combine. Returns matches and total count."
    params:
      email: "Exact email address."
      phone_number: "Exact phone number in E.164 format, e.g. +77011234567."
      name: "Part of the name, any letter case."
      limit: "How many contacts to return, up to 50."
    hidden_params: []

  update_contact:
    description: "Update the current conversation contact. Only passed fields change; custom_attributes are merged with existing ones."
    params:
      name: "New name."
      email: "New email address."
      phone_number: "New phone number in E.164 format, e.g. +77011234567."
      identifier: "New contact identifier."
      custom_attributes: "Object of custom fields to set, merged with existing ones."
    hidden_params: []

  update_my_contact:
    description: "Update the current patient's name, IIN, birth date, gender, phone or email; only passed fields change. On validation_error ask the patient to recheck the value."
    params:
      first_name: "First name."
      last_name: "Last name."
      middle_name: "Middle name."
      iin: "Kazakhstan IIN, 12 digits."
      birth_date: "Birth date, YYYY-MM-DD."
      gender: "male or female."
      phone_number: "Phone number in E.164 format, e.g. +77011234567."
      email: "Email address."
    hidden_params: []

  merge_contacts:
    description: "Merge a duplicate contact into another one. The duplicate is deleted; this cannot be undone."
    params:
      base_contact_id: "Contact that stays."
      mergee_contact_id: "Duplicate contact to merge in and delete."
    hidden_params: []

  get_company:
    description: "Get a company's details by ID."
    params:
      company_id: "Company ID."
    hidden_params: []

  search_companies:
    description: "Find companies by part of the name or domain."
    params:
      name: "Part of the company name."
      domain: "Part of the company domain."
      limit: "How many companies to return, up to 50."
    hidden_params: []

  create_company:
    description: "Create a company and link it to the current conversation contact."
    params:
      name: "Company name."
      domain: "Company domain, e.g. example.kz."
      description: "Short company description."
    hidden_params: []

  update_company:
    description: "Update the company linked to the current conversation contact; only passed fields change."
    params:
      name: "New company name."
      domain: "New company domain."
      description: "New company description."
    hidden_params: []

  search_documentation:
    description: "Search the clinic knowledge base: FAQ answers and document passages."
    params:
      query: "Question or topic."
    hidden_params: []

  list_captain_documents:
    description: "List clinic knowledge documents. A document with a file has an artifact_id for attaching it to a message."
    params:
      query: "Part of the document name or URL, any letter case."
      sendable_only: "true: only documents with an uploaded file that can be sent."
      limit: "How many documents to return, default 10, up to 20."
    hidden_params: []

  faq_lookup:
    description: "Find an answer in the clinic FAQ."
    params:
      query: "Question or topic."
    hidden_params: []

  web_search:
    description: "Search the public web. Returns source links with short snippets."
    params:
      query: "Search query."
      limit: "How many results to return."
    hidden_params: []

  web_scrape_url:
    description: "Read the text of one public web page."
    params:
      url: "Public http or https URL."
    hidden_params: []

  get_article:
    description: "Get a help center article with its content by ID."
    params:
      article_id: "Article ID."
    hidden_params: []

  search_articles:
    description: "Search help center articles by text, category or status. Published by default."
    params:
      query: "Text to find in the title or content."
      category_id: "Category ID to narrow the search."
      status: "draft, published or archived. Default: published."
      limit: "How many articles to return."
    hidden_params: []

  search_linear_issues:
    description: "Search Linear issues by a term."
    params:
      term: "Search term."
      limit: "How many issues to return."
    hidden_params: []

  get_deal:
    description: "Get one deal: title, pipeline, stage, amount and dates."
    params:
      deal_id: "Deal ID."
    hidden_params: []

  search_deals:
    description: "Search deals by title, pipeline, stage, owner or company. With no query it lists the current patient's deals. Use it to see which deals exist."
    params:
      query: "Part of the deal title or external reference."
      contact_id: "Contact ID; the current patient by default."
      pipeline_id: "Pipeline ID from list_deal_pipelines."
      pipeline_code: "Pipeline code from list_deal_pipelines."
      stage_id: "Stage ID from list_deal_stages or list_deal_pipelines."
      stage_name: "Stage name; add pipeline_id or pipeline_code if names repeat across pipelines."
      stage_code: "Stage code; add pipeline_id or pipeline_code if codes repeat across pipelines."
      owner_id: "Owner (staff user) ID."
      company_id: "Company ID."
      archived: "true to search archived deals."
      status: "active, closed, archived or any. When set, archived is ignored."
      limit: "Page size, max 50."
      offset: "Zero-based start; pass next_offset from the previous result to get the next page."
    hidden_params: []

  list_my_deals:
    description: "List the current patient's deals, filtered by status or pipeline, one page at a time."
    params:
      status: "open, won, lost or any; default any."
      pipeline: "Pipeline name or code."
      limit: "Page size, default 10, max 20."
      offset: "Number of deals to skip; use it to get the next page."
    hidden_params: []

  list_deal_pipelines:
    description: "Catalog of pipelines with ordered stages, not deals (use search_deals for deals). Use it to pick a pipeline or stage before creating or moving a deal."
    params:
      include_inactive: "true to include inactive pipelines and stages; default false."
    hidden_params: []

  list_deal_stages:
    description: "List the ordered stages of a pipeline, or of a deal's pipeline with the deal's current, previous and next stage. Default pipeline if none is given."
    params:
      pipeline_id: "Pipeline ID from list_deal_pipelines."
      pipeline_code: "Pipeline code from list_deal_pipelines."
      pipeline_name: "Pipeline name exactly as listed by list_deal_pipelines."
      deal_id: "Deal ID, for its pipeline's stages and current stage. Ignored if a pipeline is given."
      current_deal: "Deprecated; pass deal_id instead."
      include_inactive: "true to include inactive stages; default false."
    hidden_params: []

  list_deal_custom_fields:
    description: "List the custom fields allowed in deal custom_attributes: key, label, type, required flag, select options."
    params: {}
    hidden_params: []

  get_deal_timeline:
    description: "Get the history (timeline) of a deal."
    params:
      deal_id: "Deal ID."
      limit: "Max number of timeline items."
    hidden_params: []

  create_deal:
    description: "Create a deal for the current patient. Pipeline and stage default to the account defaults; to pick them, call list_deal_pipelines first."
    params:
      title: "Deal title."
      description: "Deal description."
      pipeline_id: "Pipeline ID from list_deal_pipelines; the default pipeline if omitted."
      pipeline_code: "Pipeline code from list_deal_pipelines; alternative to pipeline_id."
      stage_id: "Stage ID from list_deal_stages or list_deal_pipelines; preferred way to pick a stage."
      stage_name: "Stage name; add pipeline_id or pipeline_code if names repeat across pipelines."
      stage_code: "Stage code; add pipeline_id or pipeline_code if codes repeat across pipelines."
      closing_reasons: "Closing reason labels, only when creating directly in a Won or Lost stage."
      amount: "Whole amount in major units: 200 means 200 KZT, do not multiply by 100. No fractions."
      currency: "ISO currency code, e.g. KZT."
      expected_close_on: "Expected close date, YYYY-MM-DD."
      win_probability: "Win probability, 0 to 100."
      custom_attributes: "JSON object string of clinic fields; select values as option.value."
    hidden_params: []

  update_deal:
    description: "Update a deal's fields or move it to another stage or pipeline. Change only the deal the patient means; if unsure which, ask."
    params:
      deal_id: "ID of the deal to change."
      title: "New deal title."
      description: "New deal description."
      pipeline_id: "Target pipeline ID from list_deal_pipelines; without a stage, its default stage is used."
      pipeline_code: "Target pipeline code; alternative to pipeline_id."
      stage_id: "Target stage ID from list_deal_stages; preferred way to pick a stage."
      stage_name: "Target stage name; add pipeline_id or pipeline_code if names repeat."
      stage_code: "Target stage code; add pipeline_id or pipeline_code if codes repeat."
      closing_reasons: "Loss reason labels from list_deal_stages, when moving to a Lost stage."
      amount: "New whole amount in major units: 200 means 200 KZT, do not multiply by 100. No fractions."
      currency: "New ISO currency code."
      expected_close_on: "New expected close date, YYYY-MM-DD."
      win_probability: "New win probability, 0 to 100."
      custom_attributes: "JSON object string of clinic fields; select values as option.value."
    hidden_params: []

  transition_deal_stage:
    description: "Move a deal to another stage: give stage_id (from list_deal_stages) or stage_action next/previous. For a Lost stage that requires reasons, give closing_reasons."
    params:
      deal_id: "ID of the deal to move."
      stage_id: "Target stage ID from list_deal_stages."
      stage_name: "Target stage name; searched in the deal's pipeline unless a pipeline is given."
      stage_code: "Target stage code; searched in the deal's pipeline unless a pipeline is given."
      pipeline_id: "Pipeline ID: scopes stage_name/stage_code; alone, moves to its default stage."
      pipeline_code: "Pipeline code; same use as pipeline_id."
      stage_action: "next or previous stage; do not combine with other stage or pipeline fields."
      closing_reasons: "Loss reason labels from list_deal_stages, for a Lost stage that requires them."
    hidden_params: []

  get_task:
    description: "Get one task: title, status, type, priority, assignee, deal and dates."
    params:
      task_id: "Task ID."
    hidden_params: []

  search_tasks:
    description: "Search tasks by title, description, status, assignee, deal, type, result or priority."
    params:
      query: "Text from the task title, description or external reference."
      status_name: "Task status name."
      assignee_id: "Assignee (staff user) ID."
      deal_id: "Deal ID."
      activity_type: "Task type: task, call, meeting, message or touch."
      outcome: "Task result, e.g. held, no_show, answered, sent or not_done."
      priority: "low, medium, high or urgent."
      archived: "true to search archived tasks."
      limit: "Max number of tasks to return."
    hidden_params: []

  list_task_custom_fields:
    description: "List the custom fields allowed in task custom_attributes: key, label, type, required flag, select options."
    params: {}
    hidden_params: []

  get_task_timeline:
    description: "Get the history (timeline) of a task."
    params:
      task_id: "Task ID."
      limit: "Max number of timeline items."
    hidden_params: []

  create_task:
    description: "Create a task (call, meeting, follow-up) linked to the current conversation and, optionally, to a deal."
    params:
      title: "Task title."
      description: "Task description."
      activity_type: "Task type: task, call, meeting, message or touch."
      outcome: "Task result, e.g. held, no_show, answered, sent or not_done."
      outcome_note: "What was done or why not; required when outcome is not_done."
      priority: "low, medium, high or urgent."
      start_at: "Start, ISO 8601 with UTC offset, e.g. 2026-10-14T10:30+05:00."
      due_at: "Deadline, ISO 8601 with UTC offset, e.g. 2026-10-14T18:00+05:00."
      deal_id: "Deal ID to link the task to."
      originating_conversation_id: "Conversation ID to link; the current conversation by default."
      custom_attributes: "JSON object string of clinic fields; select values as option.value."
    hidden_params: []

  update_task:
    description: "Update a task's title, description, type, result, priority or dates. Without task_id it updates the task linked to the current conversation."
    params:
      task_id: "Task ID; omit for the task linked to the current conversation."
      title: "New task title."
      description: "New task description."
      activity_type: "New task type: task, call, meeting, message or touch."
      outcome: "New task result, e.g. held, no_show, answered, sent or not_done."
      outcome_note: "What was done or why not; required when outcome is not_done."
      priority: "New priority: low, medium, high or urgent."
      start_at: "New start, ISO 8601 with UTC offset, e.g. 2026-10-14T10:30+05:00."
      due_at: "New deadline, ISO 8601 with UTC offset, e.g. 2026-10-14T18:00+05:00."
      custom_attributes: "JSON object string of clinic fields; select values as option.value."
    hidden_params: []

  change_task_status:
    description: "Change the status of the task linked to the current conversation. Give status_id, status_name or status_code."
    params:
      status_id: "Target task status ID."
      status_name: "Target task status name."
      status_code: "Target task status code, e.g. done."
    hidden_params: []

  add_contact_note:
    description: "Save a note on the patient's contact card. Staff only; the patient does not see it."
    params:
      note: "Note text for staff."
    hidden_params: []

  add_private_note:
    description: "Add a private note to this conversation. Staff only; the patient never sees it."
    params:
      note: "Note text for staff."
    hidden_params: []

  add_label_to_conversation:
    description: "Add an existing label to this conversation."
    params:
      label_name: "Name of an existing label."
    hidden_params: []

  remove_label_from_conversation:
    description: "Remove a label from a conversation (this one by default)."
    params:
      conversation_id: "Conversation ID; this conversation if omitted."
      label_name: "Name of the label to remove."
    hidden_params: []

  update_priority:
    description: "Set the priority of this conversation."
    params:
      priority: "low, medium, high or urgent. nil removes the priority."
    hidden_params: []

  resolve_conversation:
    description: "Close the conversation when the patient's question is resolved."
    params:
      reason: "Why it is closed."
    hidden_params: []

  handoff:
    description: "Hand the conversation to staff."
    params:
      reason: "Short reason why a person is needed."
    hidden_params: []

  cancel_response:
    description: "Send no reply to the patient this turn, when the message needs none."
    params:
      reason: "Why no reply is needed."
    hidden_params: []

  send_notification:
    description: "Notify one staff member in the app about a conversation. Give exactly one of recipient_id, recipient_email, recipient_name."
    params:
      message: "Notification text."
      title: "Notification title; a default title if omitted."
      recipient_type: "user, the only supported value."
      recipient_id: "Staff user ID."
      recipient_email: "Staff user email."
      recipient_name: "Exact staff user name."
      conversation_id: "Conversation ID; this conversation if omitted."
    hidden_params: []

  search_conversations:
    description: "Find conversations by status, priority, contact or labels."
    params:
      status: "open, resolved, pending or snoozed."
      contact_id: "Contact ID."
      priority: "low, medium, high or urgent."
      labels: "Label names; matches conversations with any of them."
      limit: "How many conversations to return."
    hidden_params: []

  send_message_to_conversation:
    description: "Send a private note, files or an approved channel template to a conversation. The usual reply to the patient goes in response, not here."
    params:
      conversation_id: "Conversation number from the Patient block."
      content: "Message text. Optional with artifact_ids or template_params."
      content_kind: "free_text (default) or channel_template (default when template_params are given)."
      template_params: "Approved template: name, language, namespace, processed_params."
      artifact_ids: "File IDs taken from tool results."
      private_note: "true sends a private note, visible to staff only."
      in_reply_to_message_id: "ID of the message to reply to."
    hidden_params:
      - communication_thread_id
      - channel_key
      - target_inbox_id
      - target_contact_inbox_id
      - attachment_ids

  assign_conversation:
    description: "Assign a conversation to a user, agent bot or team."
    params:
      conversation_id: "Conversation number from the Patient block."
      assignee_id: "User or agent bot ID."
      assignee_type: "User or AgentBot; User if omitted."
      team_id: "Team ID. Leave out the assignee fields to change only the team."
    hidden_params: []

  retry_failed_message:
    description: "Retry sending an outgoing message that failed."
    params:
      message_id: "ID of the failed outgoing message."
    hidden_params: []

  edit_message:
    description: "Edit an outgoing message already sent, if the channel supports editing."
    params:
      message_id: "ID of the message to edit."
      content: "New message text."
    hidden_params: []

  translate_message:
    description: "Translate a message into another language."
    params:
      message_id: "ID of the message to translate."
      target_language: "Language code, e.g. ru, en or kk."
    hidden_params: []

  search_canned_responses:
    description: "Find saved replies by short code or text."
    params:
      query: "Search text."
      limit: "How many replies to return."
    hidden_params: []

  list_channel_templates:
    description: "List approved message templates of this conversation's channel, and say whether WhatsApp needs a template after the 24-hour window."
    params:
      name: "Exact template name."
      language: "Template language, e.g. ru or en_US."
      status: "Template status; approved by default."
      limit: "How many templates to return, up to 50."
    hidden_params: []

  create_touch:
    description: "Schedule a delayed message to the patient (a touch): text, files or an approved channel template. Timing: scheduled_at (absolute) or relative_offset_minutes after relative_anchor. Repeats need scheduled_at and repeat_until_at. WhatsApp after the 24-hour window needs channel_template."
    params:
      body: "Message text. Required for free_text unless files are attached."
      content_kind: "free_text (default) or channel_template (default when template_params are given)."
      template_params: "Approved template: name, language, namespace, processed_params."
      remindable_kind: "Current item it belongs to: conversation (default), deal, task, appointment."
      relative_anchor: "Start for the offset, matching remindable_kind: touch.created_at, conversation.created_at, conversation.last_incoming_message_at (default), conversation.last_activity_at, conversation.last_outgoing_message_at, conversation.waiting_since, deal.expected_close_on, task.due_at, appointment.starts_at, appointment.ends_at."
      relative_offset_minutes: "Whole minutes after the anchor, above 0. Not with scheduled_at."
