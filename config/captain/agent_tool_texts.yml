# Short English tool texts for the patient-facing agent runtime ONLY.
#
# Captain::Runtime::ToolWrapper replaces the description and the top-level parameter descriptions that the model sees with
# the texts below, and removes the listed hidden parameters from the schema the model sees (a hidden parameter that is sent
# anyway is dropped before the tool runs). The registry, the Copilot classes, MCP, voice, i18n and the UI keep their own texts.
# A tool without an entry here, and a parameter without an entry, keep their own text.
#
# Conventions: every text is English (the clinic's own data values stay as stored). A description says what the tool does and when
# to call it; a parameter text says what to pass and where the value comes from. One word per concept: patient (the person who
# writes in the conversation; "another patient" is a child or a relative), staff, colleague, specialist, service, appointment, slot,
# working hours, clinic time, clinic system, conversation, reply, note, ID. The rules for acting (act at once when every detail is
# given, ask for all missing details in one message, hand over to staff) live in the platform rules of the prompt
# (enterprise/lib/captain/prompts/assistant.liquid), not in the tool texts.
# Captain::Runtime::AgentToolTexts reads this file once.
tools:
  get_appointment:
    description: "Show one appointment by its ID: date, time, specialist, status. When the patient asks when they are booked or to find an appointment, use list_my_appointments or search_appointments."
    params:
      appointment_id: "Appointment ID from the Patient block or a tool result."
      appointment_access_token: "Another patient's appointment: token from the latest search_appointments."
    hidden_params: []

  list_my_appointments:
    description: "The current patient's own appointments, latest date first. Call it for 'my appointments' and to get the appointment ID before rescheduling or cancelling; for upcoming ones use status scheduled with date_from today."
    params:
      status: "scheduled, completed, cancelled, no_show or any (default any)."
      date_from: "First date, YYYY-MM-DD."
      date_to: "Last date, inclusive, YYYY-MM-DD."
      doctor: "Part of the specialist's name."
      limit: "Page size, 1-20 (default 10)."
      offset: "Appointments to skip; use while has_more is true."
    hidden_params: []

  search_appointments:
    description: "Find another patient's appointment (a child, a relative) by IIN, or by full name + specialist ID + appointment day. Results carry an access token for that appointment. For the patient's own appointments use list_my_appointments."
    params:
      client_name: "Another patient's full name in the order first, last, middle name (middle if they have one)."
      client_identifier: "Exact IIN, 12 digits; alone it finds upcoming appointments (90 days)."
      status: "completed, cancelled or no_show; omit for scheduled ones."
      payment_status: "awaiting_payment, prepaid, paid or cancelled."
      contact_id: "Omit: the current patient is used."
      resource_id: "Specialist ID from search_scheduling_resources; needed with a name."
      from: "Appointment day, YYYY-MM-DD; needed with a name, narrows an IIN search."
      to: "Range end, exclusive; omit for a one-day range."
      limit: "Max appointments to return."
    hidden_params: []

  list_appointment_custom_fields:
    description: "List the clinic's extra appointment fields (key, label, type, required, select options). Call it when the clinic instructions or an error from create_appointment ask for them; pass values in custom_attributes by key, select fields as option.value."
    params: {}
    hidden_params: []

  list_scheduling_resources:
    description: "Plain list of the clinic's specialists and rooms; with service_id, only those who offer that service. To find one by name or specialty use search_scheduling_resources."
    params:
      service_id: "Service ID from search_scheduling_services."
      limit: "Max results, up to 50."
    hidden_params:
      - include_inactive

  search_scheduling_resources:
    description: "Find a specialist or room by name words (any order) or specialty; an empty query lists all. Call it to get the specialist ID before checking slots or booking. With service_id it keeps only those who offer that service."
    params:
      query: "One specialty word or name in dictionary form, as the catalog writes it (do not combine synonyms)."
      service_id: "Service ID from search_scheduling_services."
      limit: "Max results, up to 50."
      offset: "next_offset from the previous result."
    hidden_params:
      - include_inactive
      - search_by

  get_scheduling_resource_schedule:
    description: "Working hours of one specialist for a date range, with breaks, holidays and time off. Call it to answer 'when does the specialist work'; for times that can be booked use search_available_slots."
    params:
      resource_id: "Specialist ID from search_scheduling_resources."
      from: "Range start, YYYY-MM-DD or YYYY-MM-DDTHH:MM (clinic time)."
      to: "Range end after from, at most 31 days later."
      include_breaks: "Include breaks (default true)."
      include_holidays: "Include holidays (default true)."
      include_time_offs: "Include time off (default true)."
    hidden_params: []

  get_scheduling_resource_availability:
    description: "Free slots of one specialist or room in a date range, earliest first. For several specialists or a whole service use search_available_slots."
    params:
      resource_id: "Specialist ID from search_scheduling_resources."
      from: "Range start, YYYY-MM-DD or YYYY-MM-DDTHH:MM (clinic time)."
      to: "Range end after from, at most 31 days later."
      service_id: "Service ID this specialist offers; sets the duration."
      duration_min: "Minutes, when no service_id is given."
      limit: "Max slots, up to 50."
    hidden_params: []

  search_scheduling_services:
    description: "Find a service and its prices in the clinic catalog. Search here for a price before saying it is unavailable, and before searching slots or booking a named service."
    params:
      query: "Service words in dictionary form, as the catalog writes them."
      limit: "Max services, up to 50."
      offset: "next_offset from the previous result; or add words to query."
    hidden_params:
      - include_inactive

  search_available_slots:
    description: "List free slots in a date range, earliest first. Call it to offer the patient free slots; the start the patient chooses goes to create_appointment or update_appointment. With service_id all specialists who offer the service are searched; resource_ids narrows the search. Offer 2-3 slots spread over the period, not neighbouring starts."
    params:
      from: "Range start, YYYY-MM-DD or YYYY-MM-DDTHH:MM (clinic time). To check one time pass from = that time."
      to: "Range end, same format as from, within 31 days; slots start before it. For one whole day pass the next day's date."
      resource_ids: "Specialist IDs from search_scheduling_resources; omit for all."
      service_id: "Service ID from search_scheduling_services; once used, keep it in later searches."
      duration_min: "Minutes, when no service_id is given."
      limit: "Max slots, earliest starts first; 20 is enough to offer times. For a later hour start the range at that hour."
    hidden_params: []

  create_appointment:
    description: "Book an appointment with a specialist at a free slot. Call it once the specialist, the start the patient named or chose from the free slots you offered (and the service, if the patient wants one) are known. When the patient named only a day or a part of a day (tomorrow, Monday morning), call search_available_slots, offer 2-3 free slots spread over it in one message, and book after the patient chooses. If the patient named an exact time, call this tool directly: it checks the time and says if it is taken (on time_taken, call search_available_slots for that specialist and offer 2-3 free times). For a child or another person pass patient: the appointment is booked on the person given there, otherwise on the patient of this conversation."
    params:
      resource_id: "Specialist ID from search_scheduling_resources."
      starts_at: "The start the patient named or chose from the free slots you offered: a slot start copied unchanged, or YYYY-MM-DDTHH:MM clinic time."
      ends_at: "End, same format as starts_at; usually omit."
      duration_min: "Minutes; omit to use the service's or slot length."
      service_id: "Service ID from search_scheduling_services."
      appointment_type: "primary, secondary or other."
      client_comment: "Patient's own comment for the appointment."
      patient: "The patient the appointment is for when it is not the person in this conversation (a child, a relative): first and last name, birth date YYYY-MM-DD; middle name, IIN, gender, phone if known."
      custom_attributes: "Extra appointment fields by key, as the clinic instructions or an error of this tool name them."
    hidden_params:
      - crm_deal_id
      - crm_pipeline_id

  update_appointment:
    description: "Reschedule an appointment (new time, specialist or service) or change its comment; pass only what changes. The new start is the time the patient named or chose from the free slots you offered. When the patient named only a day or a part of a day (tomorrow, Monday morning), call search_available_slots, offer 2-3 free slots spread over it in one message, and move the appointment after the patient chooses. If the patient named an exact time, call this tool directly: it checks the time and says if it is taken (on time_taken, keep the existing appointment unchanged, call search_available_slots for that specialist and offer 2-3 free times)."
    params:
      appointment_id: "Appointment ID from the Patient block or a tool result; always pass it."
      appointment_access_token: "Another patient's appointment: token from the latest search_appointments."
      patient_confirmed: "Another patient only: true after the patient agrees to this change."
      resource_id: "New specialist ID from search_scheduling_resources."
      service_id: "New service ID from search_scheduling_services."
      starts_at: "The new start the patient named or chose from the free slots you offered: a slot start copied unchanged, or YYYY-MM-DDTHH:MM clinic time."
      ends_at: "New end, same format as starts_at; usually omit."
      duration_min: "New length in minutes; usually omit."
      appointment_type: "New type: primary, secondary or other."
      client_comment: "New patient comment."
      custom_attributes: "Extra appointment fields by key, as the clinic instructions or an error of this tool name them."
    hidden_params: []

  cancel_appointment:
    description: "Cancel an appointment when the patient asks to; to reschedule it use update_appointment. If the status is cancelled_local_only, the appointment is still active in the clinic system: tell the patient."
    params:
      appointment_id: "Appointment ID from the Patient block or a tool result; always pass it."
      appointment_access_token: "Another patient's appointment: token from the latest search_appointments."
      patient_confirmed: "Another patient only: true after the patient agrees to cancel."
    hidden_params: []

  get_contact:
    description: "Show the current patient's card: name, phone, email, IIN, company and custom fields."
    params:
      contact_id: "Patient ID from the Patient block."
    hidden_params: []

  get_my_contact:
    description: "Show the current patient's card: first, last and middle name, IIN, birth date, gender, phone, email. Call it to see what is on file before asking the patient for a detail."
    params: {}
    hidden_params: []

  search_contacts:
    description: "Check the current patient's card by exact email, exact phone or part of the name; filters combine. Only the current patient's card can match."
    params:
      email: "Exact email address."
      phone_number: "Exact phone with country code, e.g. +77011234567."
      name: "Part of the name."
      limit: "How many cards to return, up to 50."
    hidden_params: []

  update_contact:
    description: "Update the current patient's name, email, phone, IIN or custom fields; only passed fields change."
    params:
      name: "New name."
      email: "New email address."
      phone_number: "New phone with country code, e.g. +77011234567."
      identifier: "IIN, 12 digits."
      custom_attributes: "Fields to set; merged with the existing custom fields."
    hidden_params: []

  update_my_contact:
    description: "Update the current patient's first, last or middle name, IIN, birth date, gender, phone or email; only passed fields change. Call it when the patient gives or corrects their own detail. On validation_error ask the patient to recheck the details you passed."
    params:
      first_name: "First name."
      last_name: "Last name (surname)."
      middle_name: "Middle name (patronymic)."
      iin: "IIN, 12 digits."
      birth_date: "Birth date, YYYY-MM-DD."
      gender: "male or female."
      phone_number: "Phone with country code, e.g. +77011234567."
      email: "Email address."
    hidden_params: []

  merge_contacts:
    description: "Merge a duplicate patient card into the card that stays; the duplicate is deleted for good. Call it when staff ask to merge two cards."
    params:
      base_contact_id: "Patient ID of the card that stays."
      mergee_contact_id: "Patient ID of the duplicate to merge in and delete."
    hidden_params: []

  get_company:
    description: "Show a company record (a patient's organization): name, domain, description."
    params:
      company_id: "Company ID from search_companies or a patient card."
    hidden_params: []

  search_companies:
    description: "Find company records (patients' organizations) by part of the name or domain. Returns total_count and the matching companies with their IDs."
    params:
      name: "Part of the company name."
      domain: "Part of the company domain."
      limit: "How many companies to return, up to 50."
    hidden_params: []

  create_company:
    description: "Create a company record and link it to the current patient; works only while the patient has no linked company. Call it when the patient names their organization."
    params:
      name: "Company name."
      domain: "Company domain, e.g. example.kz."
      description: "Short company description."
    hidden_params: []

  update_company:
    description: "Edit the company record linked to the current patient; only passed fields change. Call it when the patient corrects their organization's details."
    params:
      name: "New company name."
      domain: "New company domain, e.g. example.kz."
      description: "New company description."
    hidden_params: []

  search_documentation:
    description: "Search the text of the clinic's documents for the patient's question. Returns matching passages with their source. Call it when the FAQ has no answer or the question needs details from a document."
    params:
      query: "The patient's question as one short sentence."
    hidden_params: []

  list_captain_documents:
    description: "Find a clinic document file to send to the patient (price list, form, preparation sheet). A document with a file returns a file ID (artifact_id) for the reply's artifact_ids. Call it when the patient asks for a file."
    params:
      query: "Part of the document name or URL."
      sendable_only: "true: only documents that have a file to send."
      limit: "How many documents, up to 20 (default 10)."
    hidden_params: []

  faq_lookup:
    description: "Search the clinic's FAQ for the patient's question. Returns result found with the matching answers, or not_found. Call it for a clinic question that the clinic instructions and data do not answer."
    params:
      query: "Short question or keywords translated into the language of the clinic instructions."
    hidden_params: []

  web_search:
    description: "Search the public web. Returns links with title and short snippet. Call it for public information that is not about the clinic."
    params:
      query: "Search query."
      limit: "How many results (capped by clinic settings)."
    hidden_params: []

  web_scrape_url:
    description: "Read the text of one public web page. Call it for a link that a search result or the patient provided."
    params:
      url: "Public http or https URL."
    hidden_params: []

  get_article:
    description: "Show one help-site article (title, content, status)."
    params:
      article_id: "Article ID from search_articles."
    hidden_params: []

  search_articles:
    description: "Find articles of the public help site, a source separate from the clinic's FAQ and documents. Returns the articles with their content. Call it when the patient asks for a help-site article."
    params:
      query: "One word or exact phrase to find in the title or content."
      category_id: "Category ID the patient named; empty searches all categories."
      status: "draft, published or archived (default published)."
      limit: "How many articles to return, up to 50."
    hidden_params: []

  search_linear_issues:
    description: "Find Linear issues by a search term; returns id, title, description, state, priority and assignee. Call it to check where an issue stands."
    params:
      term: "Search term."
      limit: "How many issues to return, up to 50."
    hidden_params: []

  get_deal:
    description: "Get one deal with its details: description, pipeline, stage, amount, expected close date, win probability, custom fields. Call it for details that a deal list or summary does not show."
    params:
      deal_id: "ID of one of the patient's deals."
    hidden_params: []

  search_deals:
    description: "Search the patient's deals by title, pipeline, stage or status, most recently updated first; with no filters it returns all except archived. Call it to find a deal and its ID."
    params:
      query: "Part of the deal title or external reference."
      contact_id: "Omit: only the current patient's deals are searched."
      pipeline_id: "Pipeline ID from list_deal_pipelines."
      pipeline_code: "Pipeline code from list_deal_pipelines."
      stage_id: "Stage ID from list_deal_pipelines or list_deal_stages."
      stage_name: "Stage name; add pipeline_id if names repeat across pipelines."
      stage_code: "Stage code; add pipeline_id if codes repeat across pipelines."
      owner_id: "Assignee (staff member) ID."
      company_id: "Company ID (the patient's organization)."
      archived: "true for archived deals only; default false."
      status: "active (open), closed (won or lost), archived or any; default: all except archived."
      limit: "Deals per page, 1-50; default 50."
      offset: "Deals to skip; pass next_offset from the previous result."
    hidden_params: []

  list_my_deals:
    description: "List the patient's deals, most recently updated first: ID, title, pipeline, stage, status, amount. Call it when the patient asks about their deals or you need a deal ID."
    params:
      status: "open, won, lost or any; default any."
      pipeline: "Pipeline name, code or ID."
      limit: "Deals per page, 1-20; default 10."
      offset: "Deals to skip; while has_more is true, add limit for the next page."
    hidden_params: []

  list_deal_pipelines:
    description: "List the active pipelines with their ordered stages: IDs, names, default stage, closing reasons. Call it to choose the pipeline and stage for a new deal or for a move to another pipeline. It lists no deals."
    params:
      include_inactive: "true to include inactive pipelines and stages; default false."
    hidden_params: []

  list_deal_stages:
    description: "Show a deal's current, previous and next stage, or list the ordered stages of one pipeline (the default pipeline if none is given). Call it to get the target stage_id before moving a deal within its pipeline."
    params:
      pipeline_id: "Pipeline ID from list_deal_pipelines."
      pipeline_code: "Pipeline code from list_deal_pipelines."
      pipeline_name: "Pipeline name as listed by list_deal_pipelines."
      deal_id: "Deal ID: shows its current stage; ignored if a pipeline is given."
      current_deal: "Pass deal_id instead."
      include_inactive: "true to include inactive stages; default false."
    hidden_params: []

  list_deal_custom_fields:
    description: "List the custom fields a deal accepts: key, label, type, required flag, select options. Call it before setting a deal's custom fields or to read their labels."
    params: {}
    hidden_params: []

  get_deal_timeline:
    description: "Get the history of a deal, newest first: stage changes and other edits, staff notes, linked conversations. Call it to learn what happened to a deal and when."
    params:
      deal_id: "ID of one of the patient's deals."
      limit: "Items to return, 1-100; default 20."
    hidden_params: []

  create_deal:
    description: "Create a deal for the current patient. Pipeline and stage default to the clinic defaults; to pick them, call list_deal_pipelines first."
    params:
      title: "Deal title."
      description: "Deal description."
      pipeline_id: "Pipeline ID from list_deal_pipelines; the default pipeline if omitted."
      pipeline_code: "Pipeline code from list_deal_pipelines; alternative to pipeline_id."
      stage_id: "Stage ID from list_deal_stages or list_deal_pipelines; preferred way to pick a stage."
      stage_name: "Stage name; add pipeline_id or pipeline_code if names repeat across pipelines."
      stage_code: "Stage code; add pipeline_id or pipeline_code if codes repeat across pipelines."
      closing_reasons: "Closing reason labels, only when creating directly in a Won or Lost stage."
      amount: "Whole amount in major units: 200 means 200 KZT. No fractions."
      currency: "ISO currency code, e.g. KZT."
      expected_close_on: "Expected close date, YYYY-MM-DD."
      win_probability: "Win probability, 0 to 100."
      custom_attributes: "JSON object string of clinic fields; select values as option.value."
    hidden_params: []

  update_deal:
    description: "Update a deal's fields or move it to another stage or pipeline. Change only the deal the patient means; if unsure which, ask."
    params:
      deal_id: "ID of the deal to change."
      title: "New deal title."
      description: "New deal description."
      pipeline_id: "Target pipeline ID from list_deal_pipelines; without a stage, its default stage is used."
      pipeline_code: "Target pipeline code; alternative to pipeline_id."
      stage_id: "Target stage ID from list_deal_stages; preferred way to pick a stage."
      stage_name: "Target stage name; add pipeline_id or pipeline_code if names repeat."
      stage_code: "Target stage code; add pipeline_id or pipeline_code if codes repeat."
      closing_reasons: "Loss reason labels from list_deal_stages, when moving to a Lost stage."
      amount: "New whole amount in major units: 200 means 200 KZT. No fractions."
      currency: "New ISO currency code."
      expected_close_on: "New expected close date, YYYY-MM-DD."
      win_probability: "New win probability, 0 to 100."
      custom_attributes: "JSON object string of clinic fields; select values as option.value."
    hidden_params: []

  transition_deal_stage:
    description: "Move a deal to another stage: give stage_id (from list_deal_stages) or stage_action next/previous. For a Lost stage that requires reasons, give closing_reasons."
    params:
      deal_id: "ID of the deal to move."
      stage_id: "Target stage ID from list_deal_stages."
      stage_name: "Target stage name; searched in the deal's pipeline unless a pipeline is given."
      stage_code: "Target stage code; searched in the deal's pipeline unless a pipeline is given."
      pipeline_id: "Pipeline ID: scopes stage_name/stage_code; alone, moves to its default stage."
      pipeline_code: "Pipeline code; same use as pipeline_id."
      stage_action: "next or previous stage; use it without other stage or pipeline fields."
      closing_reasons: "Loss reason labels from list_deal_stages, for a Lost stage that requires them."
    hidden_params: []

  get_task:
    description: "Get one task: title, status, type, priority, assignee, deal and dates."
    params:
      task_id: "Task ID."
    hidden_params: []

  search_tasks:
    description: "Search tasks by title, description, status, assignee, deal, type, result or priority."
    params:
      query: "Text from the task title, description or external reference."
      status_name: "Task status name."
      assignee_id: "Assignee (staff member) ID."
      deal_id: "Deal ID."
      activity_type: "Task type: task, call, meeting, message or touch."
      outcome: "Task result, e.g. held, no_show, answered, sent or not_done."
      priority: "low, medium, high or urgent."
      archived: "true to search archived tasks."
      limit: "Max number of tasks to return."
    hidden_params: []

  list_task_custom_fields:
    description: "List the custom fields allowed in task custom_attributes: key, label, type, required flag, select options."
    params: {}
    hidden_params: []

  get_task_timeline:
    description: "Get the history (timeline) of a task."
    params:
      task_id: "Task ID."
      limit: "Max number of timeline items."
    hidden_params: []

  create_task:
    description: "Create a task (call, meeting, follow-up) linked to the current conversation and, optionally, to a deal."
    params:
      title: "Task title."
      description: "Task description."
      activity_type: "Task type: task, call, meeting, message or touch."
      outcome: "Task result, e.g. held, no_show, answered, sent or not_done."
      outcome_note: "What was done or why not; required when outcome is not_done."
      priority: "low, medium, high or urgent."
      start_at: "Start, ISO 8601 with UTC offset, e.g. 2026-10-14T10:30+05:00."
      due_at: "Deadline, ISO 8601 with UTC offset, e.g. 2026-10-14T18:00+05:00."
      deal_id: "Deal ID to link the task to."
      originating_conversation_id: "Conversation ID to link; the current conversation by default."
      custom_attributes: "JSON object string of clinic fields; select values as option.value."
    hidden_params: []

  update_task:
    description: "Update a task's title, description, type, result, priority or dates. Without task_id it updates the task linked to the current conversation."
    params:
      task_id: "Task ID; omit for the task linked to the current conversation."
      title: "New task title."
      description: "New task description."
      activity_type: "New task type: task, call, meeting, message or touch."
      outcome: "New task result, e.g. held, no_show, answered, sent or not_done."
      outcome_note: "What was done or why not; required when outcome is not_done."
      priority: "New priority: low, medium, high or urgent."
      start_at: "New start, ISO 8601 with UTC offset, e.g. 2026-10-14T10:30+05:00."
      due_at: "New deadline, ISO 8601 with UTC offset, e.g. 2026-10-14T18:00+05:00."
      custom_attributes: "JSON object string of clinic fields; select values as option.value."
    hidden_params: []

  change_task_status:
    description: "Change the status of the task linked to the current conversation. Give status_id, status_name or status_code."
    params:
      status_id: "Target task status ID."
      status_name: "Target task status name."
      status_code: "Target task status code, e.g. done."
    hidden_params: []

  add_contact_note:
    description: "Save a patient note for staff. It stays on the patient card for every future conversation and is visible only to staff. Call it for lasting facts about the patient (preferences, agreements, circumstances)."
    params:
      note: "Note text about the patient, for staff."
    hidden_params: []

  add_private_note:
    description: "Save a conversation note for staff. It stays in this conversation only and is visible only to staff. Call it for details of this conversation that staff should know."
    params:
      note: "Note text about this conversation, for staff."
    hidden_params: []

  add_label_to_conversation:
    description: "Add an existing label to this conversation. Call it when the clinic instructions name a label for the case."
    params:
      label_name: "Exact label name from the clinic instructions."
    hidden_params: []

  remove_label_from_conversation:
    description: "Remove a label from this conversation. Call it when the label no longer applies."
    params:
      conversation_id: "Omit to use this conversation."
      label_name: "Exact name of a label from Conversation labels."
    hidden_params: []

  update_priority:
    description: "Set the priority of this conversation. Call it when the clinic instructions or the urgency of the case call for a different priority."
    params:
      priority: "low, medium, high or urgent; nil removes the priority."
    hidden_params: []

  resolve_conversation:
    description: "Mark this conversation done. Call it after the patient's question is fully handled and nothing is left for the patient or for staff."
    params:
      reason: "Why it is done, in a few words."
    hidden_params: []

  handoff:
    description: "Hand the conversation to staff. Call it when the patient asks for a person, or when only staff can do the request or answer the question: first ask for the details the clinic instructions or FAQ say staff need for it (all in one message); if they name none, hand over at once."
    params:
      reason: "Short reason for staff."
    hidden_params: []

  cancel_response:
    description: "Send no reply this turn; the conversation stays open. Call it when the patient's message needs no reply (the patient wrote only an 'ok', or staff already replied)."
    params:
      reason: "Why no reply is needed, in a few words."
    hidden_params: []

  send_notification:
    description: "Send an in-app notification about a conversation to one staff member. Call it when that staff member must see something now. Give exactly one of recipient_id, recipient_email, recipient_name."
    params:
      message: "Notification text."
      title: "Notification title; a default if omitted."
      recipient_type: "Always user."
      recipient_id: "Staff member ID."
      recipient_email: "Staff member email."
      recipient_name: "Exact staff member name."
      conversation_id: "Conversation ID; this conversation if omitted."
    hidden_params: []

  search_conversations:
    description: "List this patient's conversations, latest activity first, with status, priority, labels, assignee, channel and dates (no message text). Call it to check whether the patient has other open or earlier conversations."
    params:
      status: "open, resolved, pending or snoozed."
      contact_id: "Omit: the current patient is used."
      priority: "low, medium, high or urgent."
      labels: "Label names; matches conversations with any of them."
      limit: "How many conversations to return, up to 50 (default 50)."
    hidden_params: []

  send_message_to_conversation:
    description: "Send an approved WhatsApp template to the patient in this conversation now. Call it when the Now block says the WhatsApp reply window is closed; pick the template with list_channel_templates. Your normal reply and its files go in your reply."
    params:
      conversation_id: "Conversation ID from the Patient block."
      content: "Message text; optional with template_params."
      content_kind: "free_text, or channel_template when template_params are given."
      template_params: "Approved template: name, language, namespace, processed_params."
      artifact_ids: "File IDs from tool results."
      private_note: "true saves a note for staff instead of sending a message to the patient."
      in_reply_to_message_id: "ID of the message to reply to."
    hidden_params:
      - communication_thread_id
      - channel_key
      - target_inbox_id
      - target_contact_inbox_id
      - attachment_ids

  assign_conversation:
    description: "Set the assignee (staff member or AI agent) or the team of this conversation; your turn continues. Call it when the clinic instructions name the assignee or team for the case. Staff take over through handoff, colleagues through their transfer tools."
    params:
      conversation_id: "Conversation ID from the Patient block."
      assignee_id: "Staff member or AI agent ID from the clinic instructions."
      assignee_type: "User (staff member) or AgentBot (AI agent); User if omitted."
      team_id: "Team ID from the clinic instructions; alone it changes only the team."
    hidden_params: []

  retry_failed_message:
    description: "Resend a message of this conversation whose delivery failed. Call it when a tool result shows that message as failed."
    params:
      message_id: "ID of the failed message, from a tool result."
    hidden_params: []

  edit_message:
    description: "Change the text of a message you sent with a tool, when the channel supports editing. Call it to correct that message."
    params:
      message_id: "ID of that message, from the tool result."
      content: "New message text."
    hidden_params: []

  translate_message:
    description: "Translate one message of this conversation, save the translation on it for staff, and return the text. Call it when staff need that message in another language."
    params:
      message_id: "ID of a message of this conversation, from a tool result."
      target_language: "Language code, e.g. ru, en or kk."
    hidden_params: []

  search_canned_responses:
    description: "Find canned responses (replies that staff saved for their own use) by short code or text. Call it for wording to reuse; clinic facts come from the clinic instructions, knowledge and tool results."
    params:
      query: "Search text; all canned responses if omitted."
      limit: "How many canned responses to return."
    hidden_params: []

  list_channel_templates:
    description: "List the approved templates of this conversation's channel. Call it when the Now block says the WhatsApp reply window is closed, then send the chosen template with send_message_to_conversation."
    params:
      name: "Exact template name."
      language: "Template language code, e.g. ru or en_US."
      status: "Template status; approved if omitted."
      limit: "How many templates to return, up to 50."
    hidden_params: []

  create_touch:
    description: "Schedule a message to the patient for later: text, files or an approved template. Call it when the patient or the clinic instructions ask for a message at a later time. Set the time as scheduled_at, or as relative_offset_minutes after relative_anchor."
    params:
      body: "Message text; required for free_text without files."
      content_kind: "free_text, or channel_template after the 24-hour WhatsApp window."
      template_params: "Approved template: name, language, namespace, processed_params."
      remindable_kind: "Linked record: conversation (default), deal, task or appointment."
      relative_anchor: "Delay start of the same record kind, e.g. appointment.starts_at."
      relative_offset_minutes: "Whole minutes after the anchor, above 0; not with scheduled_at."
      repeat_mode: "once (default), daily, weekly, monthly or weekdays."
      repeat_until_at: "Repeat end, YYYY-MM-DDTHH:MM:SS+HH:MM; repeats need it and scheduled_at."
      scheduled_at: "Send time, YYYY-MM-DDTHH:MM:SS+HH:MM (with UTC offset)."
      relative_time_mode: "inherit_anchor_time (default) or fixed_time_of_day."
      relative_time_of_day: "HH:MM for fixed_time_of_day, e.g. 10:00."
      timezone: "Time zone of relative_time_of_day, e.g. Asia/Almaty; UTC if omitted."
      target_inbox_id: "Inbox to send through; this conversation's inbox if omitted."
      auto_cancel_on_incoming: "true cancels it when the patient replies; default false."
      attachment_ids: "Signed file IDs of uploaded files; not with channel_template."
      artifact_ids: "File IDs from tool results; not with channel_template."
    hidden_params: []

  cancel_touch:
    description: "Cancel one scheduled message that is still draft or pending, by ID. Call it to stop that message from being sent."
    params:
      touch_id: "ID of the scheduled message."
      reason: "Why it is cancelled, in a few words."
    hidden_params: []

  delete_touch:
    description: "Delete the record of one scheduled message that is draft, pending, failed or cancelled, by ID. Call it to clean up a message you no longer need."
    params:
      touch_id: "ID of the scheduled message."
    hidden_params: []

  cancel_touches:
    description: "Cancel all unsent scheduled messages (draft, pending, processing) of this conversation, appointment, deal or task, or only those of one message sequence. Call it when none of them should go out any more."
    params:
      remindable_kind: "Item: conversation (default), deal, task or appointment."
      touch_plan_id: "Cancel only messages of this sequence (sequence ID)."
      touch_plan_name: "Sequence name, when its ID is unknown."
      reason: "Why they are cancelled, in a few words."
    hidden_params: []

  request_confirmation:
    description: "Send the patient a message with confirm, decline and reschedule buttons and track the answer. Call it when the clinic instructions ask the patient to confirm something, such as the patient's nearest appointment."
    params:
      title: "Short title for the patient, in the patient's language."
      body: "Message text for the patient, in the patient's language."
      subject_kind: "appointment (the patient's nearest), conversation or deal; else omit."
      expires_at: "Expiry, YYYY-MM-DDTHH:MM:SS+HH:MM (with UTC offset)."
      send_now: "true (default) sends the message now."
      metadata: "Extra data to store with the request."
      idempotency_key: "Same key returns the same request, so no duplicate."
    hidden_params: []

  get_confirmation_request:
    description: "Read the status of a confirmation request of this conversation (the latest by default): pending, confirmed (the patient agreed), declined, reschedule_requested or expired. Call it to check whether the patient has answered."
    params:
      confirmation_request_id: "Request ID; the latest request if omitted."
    hidden_params: []

  resolve_confirmation:
    description: "Record the patient's answer to a confirmation request that is still pending. Call it when get_confirmation_request shows pending and the patient's message answers it. An expired request, or one already answered differently, stays as it is."
    params:
      confirmation_request_id: "ID of the confirmation request."
      decision: "confirmed (the patient agreed), declined or reschedule_requested."
      source: "Always ai."
      confidence: "How sure you are of the decision, 0.0 to 1.0."
      metadata: "Extra data to store with the answer."
    hidden_params: []
