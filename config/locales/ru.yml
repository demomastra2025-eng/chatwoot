            - Вопросы по настоящим условиям можно направлять на legal@one-link.kz.
    privacy:
      title: Политика конфиденциальности
      intro:
        - Настоящая Политика конфиденциальности объясняет, как OneLink собирает, использует, хранит и раскрывает персональные данные при посещении сайта, создании workspace и использовании платформы клиентских коммуникаций.
        - Когда OneLink обрабатывает данные клиентов от имени workspace, такой workspace остается оператором соответствующих данных, а OneLink действует как обработчик или сервис-провайдер в применимых случаях.
      sections:
        collected_data:
          title: Какие данные мы собираем
          points:
            - Данные workspace и профиля, включая имя, email, название workspace, роль и данные аутентификации.
            - Данные об использовании сервиса, включая информацию об устройстве, браузере, IP-адресе, системных логах, событиях и взаимодействии с функциями.
            - Данные клиентских коммуникаций, которые вы или ваши пользователи загружаете в платформу, включая сообщения, вложения, метки и конфигурацию.
        purposes:
          title: Как мы используем данные
          points:
            - Для предоставления сервиса, аутентификации, сопровождения и поддержки.
            - Для защиты платформы, выявления злоупотреблений, устранения неполадок и улучшения производительности и функциональности.
            - Для направления сервисных уведомлений, транзакционных сообщений, юридически значимых уведомлений и, когда это допустимо, продуктовых обновлений.
        legal_basis:
          title: Правовые основания и передача данных
          paragraphs:
            - В зависимости от ситуации OneLink обрабатывает данные на основании исполнения договора, законных интересов, юридических обязанностей и согласия, когда согласие требуется законом.
            - Мы можем передавать данные инфраструктурным провайдерам, аналитическим сервисам, службам поддержки, платежным провайдерам и профессиональным консультантам, связанным договорными обязательствами по конфиденциальности и защите данных.
        retention:
          title: Срок хранения и безопасность
          paragraphs:
            - Мы храним персональные данные столько, сколько необходимо для предоставления сервиса, исполнения юридических и бухгалтерских обязанностей, разрешения споров и защиты наших договорных прав.
            - Мы применяем технические и организационные меры защиты персональных данных, однако ни один способ передачи или хранения не может гарантировать абсолютную безопасность.
        rights:
          title: Ваши права
          paragraphs:
            - С учетом применимого законодательства вы можете запросить доступ, исправление, удаление, ограничение обработки, возражение, переносимость данных или отзыв согласия, если обработка основана на согласии.
            - Если вы являетесь конечным пользователем, чьи данные были переданы клиентом OneLink, сначала обратитесь в соответствующий workspace, поскольку именно он определяет цели обработки таких данных.
        international:
          title: Международные передачи и контакты
          paragraphs:
            - При трансграничной передаче персональных данных OneLink использует разумные договорные, технические и организационные меры защиты, соответствующие характеру передачи.
            - Запросы и вопросы по конфиденциальности можно направлять на legal@one-link.kz.
