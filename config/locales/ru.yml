  legal:
    shared:
      last_updated_label: Обновлено
      last_updated_value: 7 марта 2026
    terms:
      title: Условия использования
      last_updated_value: 9 марта 2026
      intro: []
      sections:
        general_provisions:
          title: 1. Общие положения
          paragraphs:
            - '1.1. Настоящие Условия использования (далее — «Условия», «Соглашение») регулируют отношения между Индивидуальным предпринимателем Veritas Consult (бренд VConsult), зарегистрированным в соответствии с законодательством Республики Казахстан (далее — «Исполнитель», «мы»), и лицом, использующим платформу One-Link (далее — «Клиент», «вы»).'
            - '1.2. Исполнитель осуществляет предпринимательскую деятельность в соответствии с Предпринимательским кодексом Республики Казахстан от 29 октября 2015 года №375-V и зарегистрирован в качестве индивидуального предпринимателя.'
            - '1.3. Платформа One-Link (далее — «Платформа», «Сервис») представляет собой облачное программное обеспечение (SaaS), предоставляемое Исполнителем на условиях подписки для целей управления омниканальными коммуникациями бизнеса через мессенджеры и социальные сети с интегрированным AI-агентом.'
            - '1.4. Платформа разработана на базе open-source решения Chatwoot (лицензия MIT) с дополнительной функциональностью, включая AI-агент и интеграции с CRM-системами.'
            - '1.5. Акцепт настоящих Условий осуществляется путём регистрации на Платформе, оплаты подписки или фактического использования Сервиса, что в соответствии со статьёй 389 Гражданского кодекса Республики Казахстан (Общая часть) от 27 декабря 1994 года №268-XIII является заключением договора присоединения. Настоящие Условия также являются публичной офертой в соответствии со статьёй 395 ГК РК, акцептом которой признаются действия, указанные в статье 396 ГК РК.'
            - '1.6. Настоящие Условия составлены на русском и казахском языках. В случае расхождений текстов приоритет имеет версия на русском языке.'
        subject_matter:
          title: 2. Предмет соглашения
          paragraphs:
            - '2.1. Исполнитель предоставляет Клиенту доступ к Платформе One-Link для: приёма и отправки сообщений через подключённые каналы мессенджеров (WhatsApp, Telegram, Instagram, TikTok и другие) в едином инбоксе; использования встроенного AI-агента для автоматизации общения с клиентами; настройки интеграций с CRM-системами третьих сторон (AmoCRM, Bitrix24, Altegio и другие); управления командой операторов, контактами, тегами и аналитикой коммуникаций.'
            - '2.2. Конкретный объём функциональности определяется выбранным Клиентом тарифным планом.'
            - '2.3. Доступность отдельных каналов мессенджеров зависит от географических и технических ограничений соответствующих платформ. В частности, функциональность TikTok Business Messaging API может быть недоступна в отдельных регионах (включая ЕЭП, Швейцарию, Великобританию и США).'
        pricing:
          title: 3. Тарифы, оплата и подписка
          paragraphs:
            - '3.1. Сервис предоставляется на условиях ежемесячной или годовой подписки. Актуальные тарифные планы публикуются на one-link.kz/pricing.'
            - '3.2. Оплата производится предварительно (prepaid). Способы оплаты: банковский перевод, Kaspi Pay, банковская карта и иные способы, доступные на Платформе.'
            - '3.3. Все цены в тенге (KZT). Исполнитель применяет упрощённый налоговый режим и не является плательщиком НДС (статья 722 п.4 пп.2 Налогового кодекса РК).'
            - '3.4. Изменение цен — уведомление за 30 дней. Изменение не затрагивает оплаченный период.'
            - '3.5. Пробный период (Trial) может быть предоставлен. По истечении — доступ ограничивается.'
            - '3.6. Дополнительные расходы: шаблонные сообщения WhatsApp Business API (тарификация Meta), SMS и иные услуги третьих сторон — за счёт Клиента.'
        refunds:
          title: 4. Возврат средств
          paragraphs:
            - '4.1. Полный возврат — в течение 14 дней с момента оплаты, если Сервис не использован по существу (0 каналов, менее 10 сообщений).'
            - '4.2. Возврат тем же способом оплаты, в течение 10 рабочих дней.'
            - '4.3. После 14 дней — возврат не производится. Клиент сохраняет доступ до конца оплаченного периода. Указанное ограничение не затрагивает право Клиента на расторжение договора в порядке, предусмотренном Гражданским кодексом РК.'
            - '4.4. Возврат не осуществляется при блокировке за нарушение Условий, AUP или политик мессенджеров.'
        acceptable_use:
          title: 5. Политика допустимого использования
          paragraphs:
            - '5.1. Платформа — только в законных целях, в соответствии с законодательством РК и политиками мессенджеров.'
            - '5.2. Соблюдение: WhatsApp Business Policy (opt-in, 24ч окно, 2 маркетинговых шаблона/24ч); Instagram Platform Policy; TikTok Developer Terms; Telegram Bot Developer Terms; Facebook Platform Terms.'
            - '5.3. Запрещено: спам; маркетинг без opt-in; противоправный контент; рассылки по купленным базам; передача доступа; AI для медицинских/юридических/финансовых консультаций без лицензий; обход ограничений; перепродажа; реверс-инжиниринг.'
            - '5.4. Клиент отвечает за все сообщения, включая генерируемые AI-агентом.'
            - '5.5. Нарушение → приостановление или блокировка без предупреждения.'
        customer_obligations:
          title: 6. Обязательства клиента
          paragraphs:
            - '6.1. Своевременная оплата; законная обработка данных (Закон №94-V, GDPR); уведомление пользователей об AI; доступность живого оператора; мониторинг AI-агента; уведомление о сбоях.'
            - '6.2. Клиент подтверждает права на подключение каналов мессенджеров.'
        ai_agent:
          title: '7. AI-агент: условия и ограничения'
          paragraphs:
            - '7.1. AI-агент — инструмент автоматизации на основе моделей машинного обучения.'
            - '7.2. Нет гарантий: 100% точности; отраслевого соответствия; отсутствия ошибок; непрерывной доступности.'
            - '7.3. Клиент обязан: проверить настройки; мониторить диалоги; информировать пользователей (ст. 22 GDPR, EU AI Act); проверять ответы.'
            - '7.4. Данные не используются для обучения ИИ без письменного согласия.'
            - '7.5. Исполнитель не отвечает за убытки от решений на основе ответов AI-агента.'
        provider_obligations:
          title: 8. Обязательства исполнителя
          paragraphs:
            - '8.1. Работоспособность по SLA (раздел 9); уведомление о плановых работах (48ч); безопасность данных; поддержка (support@vconsult.kz); документация; уведомление об инцидентах.'
        sla:
          title: 9. SLA
          paragraphs:
            - '9.1. Доступность ≥ 99,5% в месяц.'
            - '9.2. Недоступность = полная недоступность основных функций. Деградация ≠ недоступность.'
            - '9.3. Исключения: плановые работы; сбои API мессенджеров; хостинг-провайдеры; форс-мажор; действия Клиента.'
            - '9.4. Кредиты: 99,0–99,5% → 10%; 98,0–99,0% → 25%; <98% → 50% + расторжение. Макс 30%/мес.'
            - '9.5. Запрос на кредит — 10 рабочих дней после окончания месяца.'
        intellectual_property:
          title: 10. Интеллектуальная собственность
          paragraphs:
            - '10.1. Все права на Платформу — у Исполнителя. Chatwoot — MIT лицензия.'
            - '10.2. Клиенту — ограниченная, неисключительная, непередаваемая лицензия.'
            - '10.3. Клиент сохраняет права на свой контент.'
        limitation_of_liability:
          title: 11. Ограничение ответственности
          paragraphs:
            - '11.1. Максимум — сумма за 12 месяцев.'
            - '11.2. Утечки данных — максимум 24 месяца подписки.'
            - '11.3. Не отвечаем за: упущенную выгоду; сторонние сервисы; блокировки мессенджерами; AI-ответы; действия Клиента; форс-мажор.'
            - '11.4. Не распространяется на умысел и грубую неосторожность.'
            - '11.5. Платформа «как есть» (as is).'
        indemnity:
          title: 12. Взаимная защита от претензий
          paragraphs:
            - '12.1. Исполнитель → защита Клиента от претензий о нарушении ИС.'
            - '12.2. Клиент → защита Исполнителя от претензий за: политики мессенджеров; контент; персональные данные; нарушение Условий.'
            - '12.3. Немедленное уведомление получившей стороной.'
        confidentiality:
          title: 13. Конфиденциальность
          paragraphs:
            - '13.1. Неразглашение без письменного согласия, за исключением случаев, предусмотренных законодательством Республики Казахстан (в том числе по запросам уполномоченных государственных органов).'
            - '13.2. Обработка данных — vconsult.kz/one-link/privacy.'
            - '13.3. DPA для данных ЕС/ЕЭП — vconsult.kz/one-link/dpa.'
            - '13.4. Конфиденциальность сохраняется 3 года после прекращения.'
        force_majeure:
          title: 14. Форс-мажор
          paragraphs:
            - '14.1. Стихийные бедствия; пандемии; военные действия; госорганы; кибератаки; сбои API мессенджеров; облачные провайдеры; отзыв API-ключей.'
            - '14.2. Уведомление — 3 рабочих дня.'
            - '14.3. Более 60 дней → расторжение + пропорциональный возврат.'
        termination:
          title: 15. Расторжение
          paragraphs:
            - '15.1. Клиент → в любое время.'
            - '15.2. Исполнитель → при нарушении; неоплате >15 дней; незаконной деятельности; по суду.'
            - '15.3. Уведомление за 7 дней (кроме экстренной блокировки).'
            - '15.4. Положения разделов 10–13 и 16 сохраняют силу после прекращения действия настоящего Соглашения.'
        data_export:
          title: 16. Экспорт данных
          paragraphs:
            - '16.1. CSV/JSON — 30 дней после расторжения.'
            - '16.2. Удаление через 30 дней (кроме налоговых — 5 лет).'
            - '16.3. Данные в мессенджерах/CRM — по их политикам.'
        governing_law:
          title: 17. Применимое право
          paragraphs:
            - '17.1. Законодательство Республики Казахстан.'
            - '17.2. Переговоры (30 дней) → суд по месту Исполнителя.'
            - '17.3. В отношении обработки персональных данных резидентов ЕС/ЕЭП применяются нормы GDPR; споры, связанные с обработкой таких данных, рассматриваются надзорными органами соответствующего государства — члена ЕС в порядке, предусмотренном GDPR.'
        final_provisions:
          title: 18. Заключительные положения
          paragraphs:
            - '18.1. Полное соглашение.'
            - '18.2. Недействительность части не влияет на целое.'
            - '18.3. Изменения за 30 дней + email.'
            - '18.4. Бездействие ≠ отказ от прав.'
            - '18.5. Уступка — с письменного согласия.'
        related_documents:
          title: 19. Связанные документы
          points:
            - 'Политика конфиденциальности'
            - 'vconsult.kz/one-link/privacy'
            - 'Veritas Consult'
            - 'Республика Казахстан'
            - 'social@vconsult.kz'
            - 'one-link.kz; vconsult.kz'
            - '© 2026 ИП «Veritas Consult» (VConsult)'
    privacy:
      title: Политика конфиденциальности
      last_updated_value: 9 марта 2026
      intro: []
      sections:
        general_provisions:
          title: 1. Общие положения
          paragraphs:
            - '1.1. Настоящая Политика конфиденциальности разработана ИП Veritas Consult (VConsult), зарегистрированным в Республике Казахстан, и определяет порядок сбора, обработки, хранения, передачи и защиты персональных данных Пользователей платформы One-Link (one-link.kz).'
            - '1.2. Политика разработана в соответствии с: Законом РК от 21 мая 2013 года №94-V «О персональных данных и их защите» (с поправками от 17 ноября 2025 года №231-VIII, вступившими в силу 18 января 2026 года); Регламентом (ЕС) 2016/679 (GDPR); политиками Meta Platforms, Inc. (WhatsApp Business API, Instagram API, Facebook Messenger); TikTok Developer Terms of Service и TikTok Partner Privacy Policy; Telegram Bot Platform Developer Terms of Service (telegram.org/tos/bot-developers).'
            - '1.3. Используя Платформу, Пользователь подтверждает согласие на обработку персональных данных (статья 8 Закона РК №94-V).'
            - '1.4. Политика составлена на русском и казахском языках. В случае расхождений текстов приоритет имеет версия на русском языке.'
        definitions:
          title: 2. Основные понятия
          points:
            - '«Персональные данные» — любая информация, относящаяся к определённому или определяемому физическому лицу (статья 1 Закона РК №94-V).'
            - '«Пользователь» — любое лицо, использующее Платформу, включая Клиентов и Конечных пользователей.'
            - '«Клиент» — юридическое лицо или ИП, заключивший договор на использование Платформы (Контроллер данных по GDPR).'
            - '«Конечный пользователь» — физическое лицо, взаимодействующее с Клиентом через мессенджеры.'
            - '«AI-агент» — программный модуль ИИ для автоматизации общения.'
            - '«Контроллер данных» — лицо, определяющее цели и средства обработки (Клиент).'
            - '«Процессор данных» — лицо, обрабатывающее данные от имени Контроллера (Оператор/Исполнитель).'
        processing_roles:
          title: 3. Роли в обработке данных
          paragraphs:
            - '3.1. Оператор как Контроллер — данные Клиентов (B2B): регистрация, платежи, аккаунт.'
            - '3.2. Оператор как Процессор — данные Конечных пользователей через Платформу от имени Клиентов.'
            - '3.3. Подробные условия — в DPA (vconsult.kz/one-link/dpa).'
        collected_data:
          title: 4. Какие данные мы собираем
          points:
            - 'Данные Клиентов (B2B): наименование, БИН/ИИН, адрес; ФИО контактного лица, должность; email, телефон; платёжные реквизиты; логин, хешированный пароль; IP-адрес, cookies.'
            - 'Данные Конечных пользователей: идентификаторы мессенджеров (WhatsApp ID, Telegram ID, Instagram ID, TikTok ID); номер телефона (WhatsApp); имя и аватар; содержание сообщений (текст, изображения, файлы, голосовые); метаданные; история обращений.'
            - 'Данные AI-агента: текстовые сообщения; контекст диалога; результаты анализа и классификации; данные персонализации.'
            - 'Технические данные: IP, браузер, ОС; cookies; устройство; веб-аналитика.'
        purposes:
          title: 5. Цели обработки
          points:
            - 'Предоставление доступа к Платформе; функционирование инбокса; работа AI-агента; интеграция с CRM; техподдержка; улучшение Платформы (обезличенные данные); исполнение законодательства РК; безопасность; маркетинг (при отдельном согласии).'
        legal_basis:
          title: 6. Правовые основания
          paragraphs:
            - 'По РК: согласие (ст. 7, 8 Закона №94-V); исполнение договора (ст. 9 п.2); требования законодательства (ст. 9 п.3).'
            - 'По GDPR: согласие (ст. 6(1)(a)); договор (ст. 6(1)(b)); законные интересы (ст. 6(1)(f)); юридические обязательства (ст. 6(1)(c)).'
            - 'Отдельное согласие: трансграничная передача (ст. 7 п.6); передача третьим лицам; маркетинг.'
        third_party_sharing:
          title: 7. Передача данных третьим лицам
          points:
            - 'Meta Platforms (WhatsApp, Instagram, Facebook Messenger): номера телефонов, сообщения, метаданные. Данные через API Meta не используются для профилирования, не продаются. Обработка по WhatsApp Business Policy, Meta Privacy Policy, Meta Platform Terms.'
            - 'Telegram (Bot API): Telegram ID, имя, сообщения. Шифрование при хранении с отдельным хранилищем ключей (в соответствии с Telegram Bot Platform Developer Terms of Service). Без передачи третьим лицам без согласия.'
            - 'TikTok: идентификатор, сообщения. Не продаются, не для рекламы. Может быть недоступен в ЕЭП, Швейцарии, UK, США.'
            - 'CRM-системы (AmoCRM, Bitrix24, Altegio): объём по настройкам интеграции Клиента.'
            - 'Провайдеры AI: данные в обезличенном виде. Не для обучения моделей без согласия.'
            - 'Хостинг и подрядчики: со всеми заключены DPA. Список — vconsult.kz/one-link/subprocessors. Уведомление об изменениях — 14 дней.'
        localization_and_transfers:
          title: 8. Локализация и трансграничная передача
          paragraphs:
            - '8.1. По приказу №566/НК от 19.09.2024 (с 08.01.2025) и ст. 16 Закона №94-V — данные хранятся на серверах в РК. Копии за рубежом допускаются.'
            - '8.2. Трансграничная передача через API мессенджеров и облако — в ЕС, США и другие юрисдикции.'
            - '8.3. Условия: адекватная защита (Конвенция №108); согласие субъекта (ст. 7 п.6 Закона №94-V); исполнение договора; договорные гарантии защиты данных с получателями.'
            - '8.4. Вопросы о трансграничной передаче данных — privacy@one-link.kz.'
        ai_processing:
          title: 9. Обработка данных AI-агентом
          paragraphs:
            - '9.1. Цели: генерация ответов, классификация, анализ тематики/настроения, персонализация.'
            - '9.2. Прозрачность (ст. 13(2)(f), 14(2)(g), 22 GDPR, EU AI Act): уведомление пользователей об ИИ; право на информацию о логике; право на вмешательство человека; AI не принимает юридических решений без человека.'
            - '9.3. Данные не для обучения моделей без письменного согласия.'
        cookies:
          title: 10. Cookies
          paragraphs:
            - 'Строго необходимые (без согласия); функциональные (согласие); аналитические (согласие); маркетинговые (отдельное согласие).'
            - 'Баннер при первом посещении. Без предварительно отмеченных чекбоксов (C-673/17 Planet49). Подробнее — vconsult.kz/one-link/cookies.'
        data_security:
          title: 11. Защита данных
          paragraphs:
            - 'Меры (ст. 20–23 Закона №94-V): TLS 1.2+ при передаче, AES-256 при хранении; шифрование Telegram-данных с отдельным хранилищем ключей; ролевой доступ; бэкапы; мониторинг; тестирование; обучение; ответственное лицо.'
            - 'Инциденты: уполномоченный орган РК — в течение 1 рабочего дня (ст. 25 Закона №94-V); надзорный орган ЕС — в течение 72 часов (ст. 33 GDPR); затронутые субъекты данных — без необоснованной задержки при высоком риске для их прав и свобод (ст. 34 GDPR); Оператор уведомляет затронутых Клиентов незамедлительно после выявления инцидента.'
        data_subject_rights:
          title: 12. Права субъектов данных
          paragraphs:
            - 'По РК (ст. 24): знать о сборе; доступ; уточнение; блокирование/уничтожение; отзыв согласия (ст. 8); обжалование.'
            - 'По GDPR (ЕС/ЕЭП): информация (ст. 13–14); доступ (ст. 15); исправление (ст. 16); удаление (ст. 17); ограничение (ст. 18); переносимость (ст. 20, JSON/CSV); возражение (ст. 21); автоматизированная обработка (ст. 22); отзыв согласия (ст. 7(3)); жалоба (ст. 77).'
            - 'Контакт: privacy@one-link.kz или support@vconsult.kz. Сроки: РК — 15 рабочих дней; GDPR — 1 месяц (+2 при сложности, ст. 12(3)).'
        retention:
          title: 13. Сроки хранения
          points:
            - 'Учётная запись — договор + 3 года.'
            - 'Переписки — до удаления Клиентом.'
            - 'Аналитика — 26 месяцев.'
            - 'Платежи — 5 лет (налоговое).'
            - 'Telegram — 30 дней по запросу.'
            - 'Cookies — по Политике cookies.'
        consent_management:
          title: 14. Opt-in / Opt-out
          paragraphs:
            - 'Клиент обязан получить opt-in (наименование бизнеса, намерение, номер/аккаунт). Конечные пользователи вправе opt-out в любое время. Инструменты управления — на Платформе.'
        minors:
          title: 15. Данные несовершеннолетних
          paragraphs:
            - 'Платформа не для лиц младше 18 лет. При обнаружении — немедленное удаление.'
        changes:
          title: 16. Изменения
          paragraphs:
            - 'Актуальная редакция — vconsult.kz/one-link/privacy. Существенные изменения — email за 10 рабочих дней.'
        related_documents:
          title: 17. Связанные документы
          points:
            - 'Условия использования — vconsult.kz/one-link/terms'
            - 'Veritas Consult'
            - 'Республика Казахстан'
            - 'social@vconsult.kz'
            - 'one-link.kz; vconsult.kz'
            - '© 2026 ИП «Veritas Consult» (VConsult)'
