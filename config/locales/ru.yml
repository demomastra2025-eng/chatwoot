          title: Допустимое использование
          paragraphs:
            - OneLink может использоваться только в законных бизнес-целях и с соблюдением применимого законодательства о персональных данных, защите прав потребителей, труде и электронных коммуникациях.
          points:
            - Запрещено загружать вредоносный код, нарушать доступность сервиса или пытаться получить несанкционированный доступ к данным, системам или workspace.
            - Запрещено использовать OneLink для незаконной рассылки, публикации нарушающего права контента, клеветы или иного контента, нарушающего права третьих лиц.
        customer_data:
          title: Данные клиентов и инструкции
          paragraphs:
            - Права на данные клиентов, сообщения, файлы и иной контент, загруженный в сервис, сохраняются за вами, если иное не предусмотрено законом или договором.
            - Вы поручаете OneLink обрабатывать такие данные для предоставления, защиты, поддержки и улучшения сервиса, а также для исполнения требований закона.
        fees:
