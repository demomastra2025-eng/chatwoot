      name: Slack
      short_description: Получать уведомления и отвечать на разговоры прямо в Slack.
      description: Интегрируйте OneLink с Slack для синхронизации команды. Эта интеграция позволяет получать уведомления о новых разговорах и отвечать на них непосредственно в интерфейсе Slack.
    webhooks:
      name: Webhooks
      description: События Webhook предоставляют обновления об активности в вашем workspace OneLink в режиме реального времени. Вы можете подписаться на ваши предпочтительные события, и OneLink будет отправлять вам HTTP-ответы с обновлениями.
    dialogflow:
      name: Диалог
      short_description: Постройте чат ботов для обработки начальных запросов перед передачей сотрудникам.
      description: Создайте чат-роботов с помощью Dialogflow и легко интегрируйте их в ваш источник. Эти роботы могут обрабатывать начальные запросы, прежде чем передавать их сотруднику поддержки.
    google_translate:
      name: Google Перевод
      short_description: Автоматически переводить сообщения клиентов для сотрудников.
      description: Интегрируйте Google Translate, чтобы помочь сотрудникам легко переводить сообщения клиентов. Эта интеграция автоматически определяет язык и преобразует его в язык, предпочтительный для сотрудника или администратора.
    openai:
      name: OpenAI
      short_description: Предложение ответов, краткое изложение и повышение эффективности сообщений с помощью ИИ.
      description: Используйте LLM OpenAI с такими функциями, как предложение ответов, резюмирование, перефразирование сообщений, проверка орфографии и подстановка категорий.
    linear:
      name: Linear
      short_description: Создать и связать Линейные задачи непосредственно из диалогов.
      description: Создавайте или прикрепляйте уже существующие задачи в Linear непосредственно из окна диалога для более упорядоченного и эффективного процесса отслеживания проблем.
    notion:
      name: Notion
      short_description: Интеграция баз данных, документов и страниц напрямую с Captain.
      description: Подключите ваше рабочее пространство Notion, чтобы включить Captain для доступа к Ии ответам, используя содержимое из вашей базы данных, документов и страниц, чтобы обеспечить более точную поддержку клиентов.
    shopify:
      name: Shopify
      short_description: Доступ к информации о заказе и данным о клиентах из магазина Shopify.
      description: Подключите ваш магазин Shopify, чтобы видеть детали заказов, информацию о клиентах и данные о товарах прямо внутри диалогов. Это поможет вашей команде поддержки отвечать быстрее и с большим контекстом.
    leadsquared:
      name: LeadSquared
      short_description: Синхронизация контактов и диалогов с LeadSquared CRM.
      description: Синхронизация контактов и диалогов с LeadSquared CRM. Эта интеграция автоматически создает лиды в LeadSquared при добавлении новых контактов, и ведет разговор активности, чтобы обеспечить вашу команду продаж полным контекстом.
    macrocrm:
      name: MacroCRM
      short_description: Синхронизация входящих и исходящих сообщений WhatsApp с MacroCRM.
      description: Синхронизируйте сообщения WhatsApp с MacroCRM. Интеграция находит или создает контакт, находит или создает заявку и записывает каждое сообщение как заметку в MacroCRM.
