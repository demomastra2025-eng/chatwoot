        general_provisions:
          title: '1. General Provisions'
          paragraphs:
            - '1.1. These Terms of Service (the "Terms", the "Agreement") govern the relationship between Individual Entrepreneur Veritas Consult (VConsult brand), registered under the laws of the Republic of Kazakhstan (the "Provider", "we"), and the person using the One-Link platform (the "Client", "you").'
            - '1.2. The Provider conducts business activities in accordance with the Entrepreneurial Code of the Republic of Kazakhstan dated October 29, 2015 No. 375-V and is registered as an individual entrepreneur.'
            - '1.3. The One-Link platform (the "Platform", the "Service") is cloud software (SaaS) provided by the Provider on a subscription basis for managing omnichannel business communications through messengers and social networks, with an integrated AI agent.'
            - '1.4. The Platform is built on the open-source Chatwoot solution (MIT license) with additional functionality, including an AI agent and integrations with CRM systems.'
            - '1.5. Acceptance of these Terms is effected by registering on the Platform, paying for a subscription, or actually using the Service, which constitutes entry into an adhesion contract under Article 389 of the Civil Code of the Republic of Kazakhstan (General Part) dated December 27, 1994 No. 268-XIII. These Terms also constitute a public offer under Article 395 of the Civil Code of the Republic of Kazakhstan, and the actions specified in Article 396 constitute acceptance of that offer.'
            - '1.6. These Terms are made in Russian and Kazakh. In the event of discrepancies, the Russian version prevails.'
        subject_matter:
          title: '2. Subject Matter of the Agreement'
          paragraphs:
            - '2.1. The Provider grants the Client access to the One-Link Platform for: receiving and sending messages through connected messenger channels (WhatsApp, Telegram, Instagram, TikTok, and others) in a unified inbox; using the built-in AI agent to automate customer communications; configuring integrations with third-party CRM systems (AmoCRM, Bitrix24, Altegio, and others); and managing teams of operators, contacts, tags, and communication analytics.'
            - '2.2. The specific scope of functionality is determined by the tariff plan selected by the Client.'
            - '2.3. Availability of certain messenger channels depends on geographic and technical limitations of the relevant platforms. In particular, TikTok Business Messaging API functionality may be unavailable in certain regions, including the EEA, Switzerland, the United Kingdom, and the United States.'
        pricing:
          title: '3. Pricing, Payment, and Subscription'
          paragraphs:
            - '3.1. The Service is provided on a monthly or annual subscription basis. Current tariff plans are published at one-link.kz/pricing.'
            - '3.2. Payment is made in advance (prepaid). Payment methods include bank transfer, Kaspi Pay, bank card, and other methods available on the Platform.'
            - '3.3. All prices are stated in Kazakhstani tenge (KZT). The Provider applies the simplified tax regime and is not a VAT payer (Article 722(4)(2) of the Tax Code of the Republic of Kazakhstan).'
            - '3.4. Price changes are announced 30 days in advance. Changes do not affect the prepaid period.'
            - '3.5. A trial period may be provided. After it expires, access may be restricted.'
            - '3.6. Additional costs, including WhatsApp Business API template messages (Meta pricing), SMS, and other third-party services, are borne by the Client.'
        refunds:
          title: '4. Refunds'
          paragraphs:
            - '4.1. A full refund is available within 14 days from payment if the Service has not been materially used (0 channels, fewer than 10 messages).'
            - '4.2. Refunds are made using the same payment method within 10 business days.'
            - '4.3. After 14 days, refunds are not provided. The Client retains access until the end of the paid period. This limitation does not affect the right of the Client to terminate the agreement in accordance with the Civil Code of the Republic of Kazakhstan.'
            - '4.4. Refunds are not provided in case of blocking due to violation of these Terms, the AUP, or messenger platform policies.'
        acceptable_use:
          title: '5. Acceptable Use Policy'
          paragraphs:
            - '5.1. The Platform may be used only for lawful purposes, in accordance with the laws of the Republic of Kazakhstan and the policies of the relevant messenger platforms.'
            - '5.2. Compliance is required with: WhatsApp Business Policy (opt-in, 24-hour window, 2 marketing templates per 24 hours); Instagram Platform Policy; TikTok Developer Terms; Telegram Bot Developer Terms; Facebook Platform Terms.'
            - '5.3. The following are prohibited: spam; marketing without opt-in; unlawful content; messaging to purchased databases; sharing access credentials; using AI for medical, legal, or financial advice without required licenses; circumvention of restrictions; resale; reverse engineering.'
            - '5.4. The Client is responsible for all messages, including those generated by the AI agent.'
            - '5.5. Violation may result in suspension or blocking without prior notice.'
        customer_obligations:
          title: '6. Client Obligations'
          paragraphs:
            - '6.1. Timely payment; lawful data processing (Law No. 94-V, GDPR); informing users about AI; ensuring availability of a live operator; monitoring the AI agent; notifying about failures.'
            - '6.2. The Client confirms that it has the rights necessary to connect the messenger channels.'
        ai_agent:
          title: '7. AI Agent: Terms and Limitations'
          paragraphs:
            - '7.1. The AI agent is an automation tool based on machine learning models.'
            - '7.2. There are no guarantees of: 100% accuracy; industry-specific compliance; absence of errors; uninterrupted availability.'
            - '7.3. The Client must: verify the settings; monitor dialogues; inform users (Article 22 GDPR, EU AI Act); review responses.'
            - '7.4. Data is not used to train AI models without written consent.'
            - '7.5. The Provider is not liable for losses resulting from decisions based on responses generated by the AI agent.'
        provider_obligations:
          title: '8. Provider Obligations'
          paragraphs:
            - '8.1. Operation of the Service in accordance with the SLA (Section 9); notice of scheduled maintenance (48 hours); data security; support (support@vconsult.kz); documentation; incident notifications.'
        sla:
          title: '9. SLA'
          paragraphs:
            - '9.1. Service availability is at least 99.5% per month.'
            - '9.2. Unavailability means complete unavailability of core functions. Performance degradation does not equal unavailability.'
            - '9.3. Exclusions: scheduled maintenance; outages of messenger APIs; hosting providers; force majeure; actions of the Client.'
            - '9.4. Credits: 99.0–99.5% → 10%; 98.0–99.0% → 25%; below 98% → 50% plus termination. Maximum 30% per month.'
            - '9.5. A credit request must be submitted within 10 business days after the end of the relevant month.'
        intellectual_property:
          title: '10. Intellectual Property'
          paragraphs:
            - '10.1. All rights to the Platform belong to the Provider. Chatwoot is used under the MIT license.'
            - '10.2. The Client receives a limited, non-exclusive, non-transferable license.'
            - '10.3. The Client retains rights to its content.'
        limitation_of_liability:
          title: '11. Limitation of Liability'
          paragraphs:
            - '11.1. The maximum liability is limited to the amount paid for the preceding 12 months.'
            - '11.2. In case of data breaches, liability is limited to 24 months of subscription fees.'
            - '11.3. We are not liable for: lost profits; third-party services; messenger platform blocks; AI responses; actions of the Client; force majeure.'
            - '11.4. This limitation does not apply to intent or gross negligence.'
            - '11.5. The Platform is provided on an "as is" basis.'
        indemnity:
          title: '12. Mutual Indemnification'
          paragraphs:
            - '12.1. The Provider indemnifies the Client against claims of intellectual property infringement.'
            - '12.2. The Client indemnifies the Provider against claims related to messenger platform policies, content, personal data, or violation of these Terms.'
            - '12.3. The receiving party must notify the other party immediately.'
        confidentiality:
          title: '13. Confidentiality'
          paragraphs:
            - '13.1. Confidential information may not be disclosed without written consent, except where required by the laws of the Republic of Kazakhstan, including requests from authorized public authorities.'
            - '13.2. Data processing details are available at vconsult.kz/one-link/privacy.'
            - '13.3. The DPA for EU/EEA data is available at vconsult.kz/one-link/dpa.'
            - '13.4. Confidentiality obligations survive for 3 years after termination.'
        force_majeure:
          title: '14. Force Majeure'
          paragraphs:
            - '14.1. Natural disasters; pandemics; military actions; actions of public authorities; cyberattacks; outages of messenger APIs; cloud providers; revocation of API keys.'
            - '14.2. Notice must be given within 3 business days.'
            - '14.3. If force majeure lasts more than 60 days, the agreement may be terminated with a proportional refund.'
        termination:
          title: '15. Termination'
          paragraphs:
            - '15.1. The Client may terminate at any time.'
            - '15.2. The Provider may terminate in case of violation, non-payment for more than 15 days, unlawful activity, or a court order.'
            - '15.3. Notice is given 7 days in advance, except in cases of emergency blocking.'
            - '15.4. Sections 10–13 and 16 survive termination of this Agreement.'
        data_export:
          title: '16. Data Export'
          paragraphs:
            - '16.1. CSV/JSON export is available for 30 days after termination.'
            - '16.2. Data is deleted after 30 days, except tax-related records, which are retained for 5 years.'
            - '16.3. Data in messenger platforms and CRM systems is governed by their respective policies.'
        governing_law:
          title: '17. Governing Law'
          paragraphs:
            - '17.1. The governing law is the law of the Republic of Kazakhstan.'
            - '17.2. The parties first attempt negotiations for 30 days, after which disputes are submitted to the court at the location of the Provider.'
            - '17.3. GDPR applies to the processing of personal data of EU/EEA residents; disputes related to such processing are handled by the supervisory authorities of the relevant EU member state in accordance with the GDPR.'
        final_provisions:
          title: '18. Final Provisions'
          paragraphs:
            - '18.1. These Terms constitute the entire agreement.'
            - '18.2. Invalidity of one provision does not affect the remainder.'
            - '18.3. Changes are announced 30 days in advance and by email.'
            - '18.4. Failure to act does not constitute a waiver of rights.'
            - '18.5. Assignment requires prior written consent.'
        related_documents:
          title: '19. Related Documents'
          points:
            - 'Privacy Policy'
            - 'vconsult.kz/one-link/privacy'
            - 'Veritas Consult'
            - 'Republic of Kazakhstan'
            - 'social@vconsult.kz'
            - 'one-link.kz; vconsult.kz'
            - '© 2026 IP "Veritas Consult" (VConsult)'
    privacy:
      title: 'Privacy Policy'
      last_updated_value: 'March 9, 2026'
      intro: []
      sections:
        general_provisions:
          title: '1. General Provisions'
          paragraphs:
            - '1.1. This Privacy Policy has been developed by Individual Entrepreneur Veritas Consult (VConsult), registered in the Republic of Kazakhstan, and defines the procedure for the collection, processing, storage, transfer, and protection of personal data of users of the One-Link platform (one-link.kz).'
            - '1.2. This Policy is developed in accordance with: the Law of the Republic of Kazakhstan dated May 21, 2013 No. 94-V "On Personal Data and Their Protection" (as amended on November 17, 2025 by Law No. 231-VIII, effective January 18, 2026); Regulation (EU) 2016/679 (GDPR); Meta Platforms, Inc. policies (WhatsApp Business API, Instagram API, Facebook Messenger); TikTok Developer Terms of Service and TikTok Partner Privacy Policy; Telegram Bot Platform Developer Terms of Service (telegram.org/tos/bot-developers).'
            - '1.3. By using the Platform, the User confirms consent to the processing of personal data (Article 8 of RK Law No. 94-V).'
            - '1.4. This Policy is made in Russian and Kazakh. In the event of discrepancies, the Russian version prevails.'
        definitions:
          title: '2. Key Definitions'
          points:
            - '"Personal Data" means any information relating to an identified or identifiable natural person (Article 1 of RK Law No. 94-V).'
            - '"User" means any person using the Platform, including Clients and End Users.'
            - '"Client" means a legal entity or sole proprietor that has entered into an agreement to use the Platform (Data Controller under the GDPR).'
            - '"End User" means an individual interacting with the Client through messengers.'
            - '"AI Agent" means a software AI module used to automate communications.'
            - '"Data Controller" means the person determining the purposes and means of processing (the Client).'
            - '"Data Processor" means the person processing data on behalf of the Controller (the Operator / Provider).'
        processing_roles:
          title: '3. Roles in Data Processing'
          paragraphs:
            - '3.1. The Operator as Controller processes Client data (B2B): registration, payments, and account data.'
            - '3.2. The Operator as Processor processes End User data through the Platform on behalf of Clients.'
            - '3.3. Detailed terms are set out in the DPA at vconsult.kz/one-link/dpa.'
        collected_data:
          title: '4. What Data We Collect'
          points:
            - 'Client data (B2B): company name, BIN/IIN, address; full name and position of the contact person; email, phone number; payment details; login, hashed password; IP address, cookies.'
            - 'End User data: messenger identifiers (WhatsApp ID, Telegram ID, Instagram ID, TikTok ID); phone number (WhatsApp); name and avatar; message content (text, images, files, voice messages); metadata; support history.'
            - 'AI Agent data: text messages; dialogue context; analysis and classification results; personalization data.'
            - 'Technical data: IP address, browser, operating system; cookies; device; web analytics.'
        purposes:
          title: '5. Purposes of Processing'
          points:
            - 'Providing access to the Platform; operation of the inbox; operation of the AI agent; CRM integrations; technical support; improvement of the Platform using anonymized data; compliance with the laws of the Republic of Kazakhstan; security; marketing with separate consent.'
        legal_basis:
          title: '6. Legal Bases'
          paragraphs:
            - 'Under the laws of Kazakhstan: consent (Articles 7 and 8 of Law No. 94-V); performance of a contract (Article 9(2)); legal requirements (Article 9(3)).'
            - 'Under the GDPR: consent (Article 6(1)(a)); contract (Article 6(1)(b)); legitimate interests (Article 6(1)(f)); legal obligations (Article 6(1)(c)).'
            - 'Separate consent is required for: cross-border transfers (Article 7(6) of Law No. 94-V); transfers to third parties; marketing.'
        third_party_sharing:
          title: '7. Sharing Data with Third Parties'
          points:
            - 'Meta Platforms (WhatsApp, Instagram, Facebook Messenger): phone numbers, messages, metadata. Data accessed through Meta APIs is not used for profiling and is not sold. Processing is governed by the WhatsApp Business Policy, Meta Privacy Policy, and Meta Platform Terms.'
            - 'Telegram (Bot API): Telegram ID, name, messages. Data is encrypted at rest with a separate key storage system, in accordance with the Telegram Bot Platform Developer Terms of Service. No transfer to third parties without consent.'
            - 'TikTok: identifiers, messages. Data is not sold and not used for advertising. The service may be unavailable in the EEA, Switzerland, the United Kingdom, and the United States.'
            - 'CRM systems (AmoCRM, Bitrix24, Altegio): the scope of transferred data depends on the Client integration settings.'
            - 'AI providers: data is shared in anonymized form. It is not used for training models without consent.'
            - 'Hosting providers and contractors: DPAs are in place with all of them. The list is available at vconsult.kz/one-link/subprocessors. Changes are announced 14 days in advance.'
        localization_and_transfers:
          title: '8. Data Localization and Cross-Border Transfers'
          paragraphs:
            - '8.1. Pursuant to Order No. 566/NK dated September 19, 2024 (effective January 8, 2025) and Article 16 of Law No. 94-V, data is stored on servers located in Kazakhstan. Copies may be stored abroad.'
            - '8.2. Cross-border transfers through messenger APIs and cloud infrastructure may occur to the EU, the United States, and other jurisdictions.'
            - '8.3. Conditions for such transfers include: adequate protection (Convention No. 108); consent of the data subject (Article 7(6) of Law No. 94-V); performance of a contract; and contractual data protection safeguards with recipients.'
            - '8.4. Questions about cross-border data transfers may be sent to privacy@one-link.kz.'
        ai_processing:
          title: '9. Processing by the AI Agent'
          paragraphs:
            - '9.1. Purposes: generating replies, classification, topic and sentiment analysis, personalization.'
            - '9.2. Transparency (Articles 13(2)(f), 14(2)(g), and 22 GDPR, EU AI Act): users are informed about AI; they have the right to information about the logic involved; they have the right to human intervention; AI does not make legal decisions without human involvement.'
            - '9.3. Data is not used for training models without written consent.'
        cookies:
          title: '10. Cookies'
          paragraphs:
            - 'Strictly necessary cookies (without consent); functional cookies (with consent); analytics cookies (with consent); marketing cookies (with separate consent).'
            - 'A banner is displayed on the first visit. No pre-ticked checkboxes are used (C-673/17 Planet49). More details are available at vconsult.kz/one-link/cookies.'
        data_security:
          title: '11. Data Security'
          paragraphs:
            - 'Measures (Articles 20–23 of Law No. 94-V): TLS 1.2+ in transit, AES-256 at rest; encryption of Telegram data with separate key storage; role-based access control; backups; monitoring; testing; staff training; designated responsible person.'
            - 'Incidents: the authorized body of Kazakhstan is notified within 1 business day (Article 25 of Law No. 94-V); the EU supervisory authority within 72 hours (Article 33 GDPR); affected data subjects without undue delay where there is a high risk to their rights and freedoms (Article 34 GDPR); the Operator informs affected Clients immediately after identifying the incident.'
        data_subject_rights:
          title: '12. Rights of Data Subjects'
          paragraphs:
            - 'Under the laws of Kazakhstan (Article 24): the right to know about collection; access; correction; blocking/destruction; withdrawal of consent (Article 8); appeal.'
            - 'Under the GDPR (EU/EEA): information (Articles 13–14); access (Article 15); rectification (Article 16); erasure (Article 17); restriction (Article 18); portability (Article 20, JSON/CSV); objection (Article 21); automated decision-making (Article 22); withdrawal of consent (Article 7(3)); complaint (Article 77).'
            - 'Contact: privacy@one-link.kz or support@vconsult.kz. Time limits: Kazakhstan — 15 business days; GDPR — 1 month, extendable by 2 additional months for complex requests (Article 12(3)).'
        retention:
          title: '13. Retention Periods'
          points:
            - 'Account data: duration of the contract plus 3 years.'
            - 'Conversations: until deleted by the Client.'
            - 'Analytics: 26 months.'
            - 'Payments: 5 years for tax purposes.'
            - 'Telegram data: 30 days upon request.'
            - 'Cookies: as set out in the Cookies Policy.'
        consent_management:
          title: '14. Opt-in / Opt-out'
          paragraphs:
            - 'The Client must obtain opt-in that includes the business name, purpose, and number/account. End Users may opt out at any time. Management tools are available on the Platform.'
        minors:
          title: '15. Data of Minors'
          paragraphs:
            - 'The Platform is not intended for persons under 18. If such data is discovered, it is deleted immediately.'
        changes:
          title: '16. Changes'
          paragraphs:
            - 'The current version is available at vconsult.kz/one-link/privacy. Material changes are notified by email 10 business days in advance.'
        related_documents:
          title: '17. Related Documents'
          points:
            - 'Terms of Service — vconsult.kz/one-link/terms'
            - 'Veritas Consult'
            - 'Republic of Kazakhstan'
            - 'social@vconsult.kz'
            - 'one-link.kz; vconsult.kz'
            - '© 2026 IP "Veritas Consult" (VConsult)'
