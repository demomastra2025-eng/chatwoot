      description: Integrate Onelink with Slack to keep your team in sync. This integration allows you to receive notifications for new conversations and respond to them directly within Slack's interface.
    webhooks:
      name: Webhooks
      description: Webhook events provide real-time updates about activities in your Onelink account. You can subscribe to your preferred events, and Onelink will send you HTTP callbacks with the updates.
    dialogflow:
      name: Dialogflow
      short_description: Build chatbots to handle initial queries before transferring to agents.
      description: Build chatbots with Dialogflow and easily integrate them into your inbox. These bots can handle initial queries before transferring them to a customer service agent.
    google_translate:
      name: Google Translate
      short_description: Automatically translate customer messages for agents.
      description: Integrate Google Translate to help agents easily translate customer messages. This integration automatically detects the language and converts it to the agent's or admin's preferred language.
    openai:
      name: OpenAI
      short_description: AI-powered reply suggestions, summarization, and message enhancement.
      description: Leverage the power of large language models from OpenAI with the features such as reply suggestions, summarization, message rephrasing, spell-checking, and label classification.
    linear:
      name: Linear
      short_description: Create and link Linear issues directly from conversations.
      description: Create issues in Linear directly from your conversation window. Alternatively, link existing Linear issues for a more streamlined and efficient issue tracking process.
    notion:
      name: Notion
      short_description: Integrate databases, documents and pages directly with Captain.
      description: Connect your Notion workspace to enable Captain to access and generate intelligent responses using content from your databases, documents, and pages to provide more contextual customer support.
    shopify:
      name: Shopify
      short_description: Access order details and customer data from your Shopify store.
      description: Connect your Shopify store to access order details, customer information, and product data directly within your conversations and helps your support team provide faster, more contextual assistance to your customers.
    leadsquared:
      name: LeadSquared
      short_description: Sync your contacts and conversations with LeadSquared CRM.
      description: Sync your contacts and conversations with LeadSquared CRM. This integration automatically creates leads in LeadSquared when new contacts are added, and logs conversation activity to provide your sales team with complete context.
