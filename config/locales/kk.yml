    terms:
      title: Қызмет көрсету шарттары
      last_updated_value: 2026 жылғы 9 наурыз
      intro: []
      sections:
        general_provisions:
          title: 1. Жалпы ережелер
          paragraphs:
            - '1.1. Осы Қызмет көрсету шарттары (бұдан әрі — «Шарттар», «Келісім») Қазақстан Республикасының заңнамасына сәйкес тіркелген Жеке кәсіпкер Veritas Consult (VConsult бренді) (бұдан әрі — «Орындаушы», «біз») мен One-Link платформасын пайдаланатын тұлға (бұдан әрі — «Клиент», «сіз») арасындағы қатынастарды реттейді.'
            - '1.2. Орындаушы 2015 жылғы 29 қазандағы №375-V Қазақстан Республикасының Кәсіпкерлік кодексіне сәйкес кәсіпкерлік қызметті жүзеге асырады және жеке кәсіпкер ретінде тіркелген.'
            - '1.3. One-Link платформасы (бұдан әрі — «Платформа», «Сервис») Орындаушы жазылым негізінде ұсынатын бұлттық бағдарламалық қамтамасыз ету (SaaS) болып табылады және мессенджерлер мен әлеуметтік желілер арқылы бизнестің омниканалды коммуникацияларын басқаруға, сондай-ақ кіріктірілген AI-агентті пайдалануға арналған.'
            - '1.4. Платформа open-source Chatwoot шешімі (MIT лицензиясы) негізінде әзірленген және AI-агент пен CRM жүйелерімен интеграцияларды қоса алғанда қосымша функционалдылықты қамтиды.'
            - '1.5. Осы Шарттарды акцептеу Платформада тіркелу, жазылымды төлеу немесе Сервисті нақты пайдалану арқылы жүзеге асырылады, бұл 1994 жылғы 27 желтоқсандағы №268-XIII Қазақстан Республикасы Азаматтық кодексінің (Жалпы бөлім) 389-бабына сәйкес қосылу шартын жасасу болып табылады. Осы Шарттар сондай-ақ ҚР АК-нің 395-бабына сәйкес жария оферта болып табылады, ал 396-бапта көрсетілген әрекеттер оның акцепті деп танылады.'
            - '1.6. Осы Шарттар орыс және қазақ тілдерінде жасалған. Мәтіндер арасында қайшылықтар болған жағдайда орыс тіліндегі нұсқа басымдыққа ие болады.'
        subject_matter:
          title: 2. Келісімнің мәні
          paragraphs:
            - '2.1. Орындаушы Клиентке One-Link платформасына мына мақсаттар үшін қолжетімділік береді: қосылған мессенджер арналары (WhatsApp, Telegram, Instagram, TikTok және басқалар) арқылы хабарламаларды бірыңғай инбокста қабылдау және жіберу; клиенттермен байланысты автоматтандыру үшін кіріктірілген AI-агентті пайдалану; үшінші тарап CRM жүйелерімен (AmoCRM, Bitrix24, Altegio және басқалар) интеграцияларды баптау; операторлар командасын, контактілерді, тегтерді және коммуникация аналитикасын басқару.'
            - '2.2. Функционалдың нақты көлемі Клиент таңдаған тарифтік жоспармен айқындалады.'
            - '2.3. Жекелеген мессенджер арналарының қолжетімділігі тиісті платформалардың географиялық және техникалық шектеулеріне байланысты. Атап айтқанда, TikTok Business Messaging API функционалдығы кейбір өңірлерде (соның ішінде Еуропалық экономикалық аймақ, Швейцария, Ұлыбритания және АҚШ) қолжетімсіз болуы мүмкін.'
        pricing:
          title: 3. Тарифтер, төлем және жазылым
          paragraphs:
            - '3.1. Сервис ай сайынғы немесе жылдық жазылым шарттарымен ұсынылады. Өзекті тарифтік жоспарлар one-link.kz/pricing сайтында жарияланады.'
            - '3.2. Төлем алдын ала (prepaid) жүзеге асырылады. Төлем тәсілдері: банктік аударым, Kaspi Pay, банктік карта және Платформада қолжетімді өзге де тәсілдер.'
            - '3.3. Барлық бағалар теңгемен (KZT) көрсетіледі. Орындаушы оңайлатылған салық режимін қолданады және ҚҚС төлеуші болып табылмайды (ҚР Салық кодексінің 722-бабы 4-тармағы 2) тармақшасы).'
            - '3.4. Бағалар өзгерген жағдайда 30 күн бұрын хабарланады. Өзгеріс алдын ала төленген кезеңге қолданылмайды.'
            - '3.5. Сынақ кезеңі (Trial) берілуі мүмкін. Оның мерзімі аяқталғаннан кейін қолжетімділік шектеледі.'
            - '3.6. Қосымша шығыстар: WhatsApp Business API үлгілік хабарламалары (Meta тарификациясы), SMS және үшінші тұлғалардың өзге қызметтері Клиент есебінен төленеді.'
        refunds:
          title: 4. Ақшаны қайтару
          paragraphs:
            - '4.1. Егер Сервис мәні бойынша пайдаланылмаса (0 арна, 10 хабарламадан аз), төлем жасалған сәттен бастап 14 күн ішінде толық қайтару жүргізіледі.'
            - '4.2. Қайтару сол төлем тәсілімен 10 жұмыс күні ішінде жүзеге асырылады.'
            - '4.3. 14 күн өткеннен кейін қаражат қайтарылмайды. Клиент ақылы кезеңнің соңына дейін қолжетімділікті сақтайды. Бұл шектеу Клиенттің ҚР Азаматтық кодексінде көзделген тәртіппен шартты бұзу құқығына әсер етпейді.'
            - '4.4. Шарттарды, AUP-ты немесе мессенджерлер саясаттарын бұзғаны үшін бұғаттау кезінде қаражат қайтарылмайды.'
        acceptable_use:
          title: 5. Рұқсат етілген пайдалану саясаты
          paragraphs:
            - '5.1. Платформа тек заңды мақсаттарда және Қазақстан Республикасының заңнамасына, сондай-ақ мессенджерлер саясаттарына сәйкес пайдаланылуы тиіс.'
            - '5.2. Сақталуға тиіс талаптар: WhatsApp Business Policy (opt-in, 24 сағаттық терезе, 24 сағат ішінде 2 маркетингтік шаблон); Instagram Platform Policy; TikTok Developer Terms; Telegram Bot Developer Terms; Facebook Platform Terms.'
            - '5.3. Мыналарға тыйым салынады: спам; opt-in алмай маркетинг жүргізу; құқыққа қайшы контент; сатып алынған базалар бойынша тарату; қолжетімділікті үшінші тұлғаларға беру; қажетті лицензияларсыз AI-ды медициналық, заңдық немесе қаржылық кеңес беру үшін пайдалану; шектеулерді айналып өту; қайта сату; реверс-инжиниринг.'
            - '5.4. Клиент барлық хабарламалар үшін, соның ішінде AI-агент жасаған жауаптар үшін жауап береді.'
            - '5.5. Бұзушылық анықталған жағдайда алдын ала ескертусіз тоқтата тұру немесе бұғаттау қолданылуы мүмкін.'
        customer_obligations:
          title: 6. Клиенттің міндеттемелері
          paragraphs:
            - '6.1. Уақтылы төлеу; деректерді заңды түрде өңдеу (№94-V Заң, GDPR); пайдаланушыларды AI туралы хабардар ету; тірі оператордың қолжетімді болуын қамтамасыз ету; AI-агентті бақылау; іркілістер туралы хабарлау.'
            - '6.2. Клиент мессенджер арналарын қосуға құқығы бар екенін растайды.'
        ai_agent:
          title: '7. AI-агент: шарттар мен шектеулер'
          paragraphs:
            - '7.1. AI-агент — машиналық оқыту модельдеріне негізделген автоматтандыру құралы.'
            - '7.2. Мыналарға кепілдік берілмейді: 100% дәлдік; салалық талаптарға сәйкестік; қателердің болмауы; үздіксіз қолжетімділік.'
            - '7.3. Клиент мыналарға міндетті: баптауларды тексеру; диалогтарды бақылау; пайдаланушыларды хабардар ету (GDPR 22-бабы, EU AI Act); жауаптарды тексеру.'
            - '7.4. Жазбаша келісімсіз деректер AI модельдерін оқыту үшін пайдаланылмайды.'
            - '7.5. Орындаушы AI-агент жауаптарының негізінде қабылданған шешімдерден туындаған шығындар үшін жауап бермейді.'
        provider_obligations:
          title: 8. Орындаушының міндеттемелері
          paragraphs:
            - '8.1. SLA-ға сәйкес жұмыс қабілеттілігін қамтамасыз ету (9-бөлім); жоспарлы жұмыстар туралы 48 сағат бұрын хабарлау; деректер қауіпсіздігін қамтамасыз ету; қолдау көрсету (support@vconsult.kz); құжаттама ұсыну; инциденттер туралы хабарлау.'
        sla:
          title: 9. SLA
          paragraphs:
            - '9.1. Ай ішіндегі қолжетімділік деңгейі ≥ 99,5%.'
            - '9.2. Қолжетімсіздік = негізгі функциялардың толық қолжетімсіздігі. Өнімділіктің нашарлауы ≠ қолжетімсіздік.'
            - '9.3. Ерекшеліктер: жоспарлы жұмыстар; мессенджер API-ларының істен шығуы; хостинг-провайдерлер; форс-мажор; Клиент әрекеттері.'
            - '9.4. Кредиттер: 99,0–99,5% → 10%; 98,0–99,0% → 25%; <98% → 50% + шартты бұзу. Ең көбі айына 30%.'
            - '9.5. Кредит беру туралы сұрау ай аяқталғаннан кейін 10 жұмыс күні ішінде берілуі тиіс.'
        intellectual_property:
          title: 10. Зияткерлік меншік
          paragraphs:
            - '10.1. Платформаға барлық құқықтар Орындаушыға тиесілі. Chatwoot MIT лицензиясы бойынша пайдаланылады.'
            - '10.2. Клиентке шектеулі, айрықша емес және берілмейтін лицензия беріледі.'
            - '10.3. Клиент өз контентіне құқықтарын сақтап қалады.'
        limitation_of_liability:
          title: 11. Жауапкершілікті шектеу
          paragraphs:
            - '11.1. Ең жоғары жауапкершілік мөлшері — соңғы 12 ай үшін төленген сома.'
            - '11.2. Деректердің жария болып кетуі бойынша жауапкершілік ең көбі 24 айлық жазылым сомасымен шектеледі.'
            - '11.3. Біз мыналар үшін жауап бермейміз: жоғалған пайда; үшінші тарап сервистері; мессенджерлердің бұғаттауы; AI жауаптары; Клиент әрекеттері; форс-мажор.'
            - '11.4. Бұл шектеу қасақана әрекеттерге және өрескел абайсыздыққа қолданылмайды.'
            - '11.5. Платформа "бар күйінде" (as is) ұсынылады.'
        indemnity:
          title: 12. Өзара талаптардан қорғау
          paragraphs:
            - '12.1. Орындаушы → зияткерлік меншік құқықтарының бұзылуы туралы талаптардан Клиентті қорғау.'
            - '12.2. Клиент → мессенджер саясаттарына, контентке, дербес деректерге немесе Шарттарды бұзуға байланысты талаптардан Орындаушыны қорғау.'
            - '12.3. Талап алған тарап бұл туралы екінші тарапты дереу хабардар етуге тиіс.'
        confidentiality:
          title: 13. Құпиялылық
          paragraphs:
            - '13.1. Қазақстан Республикасының заңнамасында көзделген жағдайларды (соның ішінде уәкілетті мемлекеттік органдардың сұраулары бойынша) қоспағанда, жазбаша келісімсіз мәліметтер ашылмайды.'
            - '13.2. Деректерді өңдеу тәртібі — vconsult.kz/one-link/privacy.'
            - '13.3. ЕО/ЕЭА деректері үшін DPA — vconsult.kz/one-link/dpa.'
            - '13.4. Құпиялылық міндеттемелері тоқтатылғаннан кейін 3 жыл бойы сақталады.'
        force_majeure:
          title: 14. Форс-мажор
          paragraphs:
            - '14.1. Табиғи апаттар; пандемиялар; әскери іс-қимылдар; мемлекеттік органдардың әрекеттері; кибершабуылдар; мессенджер API-ларының істен шығуы; бұлттық провайдерлер; API кілттерінің кері қайтарылуы.'
            - '14.2. Хабарлау мерзімі — 3 жұмыс күні.'
            - '14.3. Егер форс-мажор 60 күннен асса, шарт бұзылып, қаражат пропорционалды түрде қайтарылады.'
        termination:
          title: 15. Тоқтату
          paragraphs:
            - '15.1. Клиент шартты кез келген уақытта тоқтата алады.'
            - '15.2. Орындаушы шартты бұзушылық, 15 күннен астам төлемеу, заңсыз қызмет немесе сот шешімі болған жағдайда тоқтата алады.'
            - '15.3. Төтенше бұғаттаудан басқа жағдайларда 7 күн бұрын хабарланады.'
            - '15.4. Осы Келісім тоқтатылғаннан кейін де 10–13 және 16-бөлімдердің ережелері күшінде қалады.'
        data_export:
          title: 16. Деректерді экспорттау
          paragraphs:
            - '16.1. CSV/JSON форматы арқылы экспорттау бұзылғаннан кейін 30 күн бойы қолжетімді.'
            - '16.2. 30 күннен кейін деректер жойылады (салықтық деректерден басқа — 5 жыл).'
            - '16.3. Мессенджерлер мен CRM жүйелеріндегі деректер олардың өз саясаттарына сәйкес өңделеді.'
        governing_law:
          title: 17. Қолданылатын құқық
          paragraphs:
            - '17.1. Қолданылатын құқық — Қазақстан Республикасының заңнамасы.'
            - '17.2. Алдымен 30 күндік келіссөздер жүргізіледі, содан кейін дау Орындаушы орналасқан жердегі сотта қаралады.'
            - '17.3. ЕО/ЕЭА резиденттерінің дербес деректерін өңдеуге қатысты GDPR нормалары қолданылады; мұндай деректерді өңдеуге байланысты даулар GDPR-де көзделген тәртіппен тиісті ЕО мүше мемлекетінің қадағалау органы арқылы қаралады.'
        final_provisions:
          title: 18. Қорытынды ережелер
          paragraphs:
            - '18.1. Осы Шарттар толық келісімді құрайды.'
            - '18.2. Қандай да бір ереженің жарамсыздығы қалған ережелердің күшіне әсер етпейді.'
            - '18.3. Өзгерістер туралы 30 күн бұрын және email арқылы хабарланады.'
            - '18.4. Әрекетсіздік құқықтардан бас тарту болып табылмайды.'
            - '18.5. Құқықтарды беру тек жазбаша келісіммен жүзеге асырылады.'
        related_documents:
          title: 19. Байланысты құжаттар
          points:
            - Құпиялылық саясаты
            - vconsult.kz/one-link/privacy
            - Veritas Consult
            - Қазақстан Республикасы
            - social@vconsult.kz
            - one-link.kz; vconsult.kz
            - © 2026 ИП «Veritas Consult» (VConsult)
    privacy:
      title: Құпиялылық саясаты
      last_updated_value: 2026 жылғы 9 наурыз
      intro: []
      sections:
        general_provisions:
          title: 1. Жалпы ережелер
          paragraphs:
            - '1.1. Осы Құпиялылық саясатын Қазақстан Республикасында тіркелген Жеке кәсіпкер Veritas Consult (VConsult) әзірлеген және ол One-Link платформасы (one-link.kz) пайдаланушыларының дербес деректерін жинау, өңдеу, сақтау, беру және қорғау тәртібін айқындайды.'
            - '1.2. Саясат мына құжаттарға сәйкес әзірленді: 2013 жылғы 21 мамырдағы №94-V «Дербес деректер және оларды қорғау туралы» ҚР Заңы (2025 жылғы 17 қарашадағы №231-VIII түзетулерімен, 2026 жылғы 18 қаңтардан бастап күшіне енген); ЕО 2016/679 Регламенті (GDPR); Meta Platforms, Inc. саясаттары (WhatsApp Business API, Instagram API, Facebook Messenger); TikTok Developer Terms of Service және TikTok Partner Privacy Policy; Telegram Bot Platform Developer Terms of Service (telegram.org/tos/bot-developers).'
            - '1.3. Платформаны пайдалану арқылы Пайдаланушы дербес деректерді өңдеуге келісімін растайды (ҚР Заңы №94-V 8-бабы).'
            - '1.4. Саясат орыс және қазақ тілдерінде жасалған. Мәтіндер арасында қайшылықтар болған жағдайда орыс тіліндегі нұсқа басымдыққа ие болады.'
        definitions:
          title: 2. Негізгі ұғымдар
          points:
            - '«Дербес деректер» — белгілі бір немесе айқындалатын жеке тұлғаға қатысты кез келген ақпарат (ҚР Заңы №94-V 1-бабы).'
            - '«Пайдаланушы» — Платформаны пайдаланатын кез келген тұлға, соның ішінде Клиенттер мен Соңғы пайдаланушылар.'
            - '«Клиент» — Платформаны пайдалану туралы шарт жасасқан заңды тұлға немесе жеке кәсіпкер (GDPR бойынша Деректер контроллері).'
            - '«Соңғы пайдаланушы» — Клиентпен мессенджерлер арқылы өзара әрекеттесетін жеке тұлға.'
            - '«AI-агент» — қарым-қатынасты автоматтандыруға арналған жасанды интеллект бағдарламалық модулі.'
            - '«Деректер контроллері» — өңдеу мақсаттары мен құралдарын айқындайтын тұлға (Клиент).'
            - '«Деректерді өңдеуші» — Контроллердің атынан деректерді өңдейтін тұлға (Оператор/Орындаушы).'
        processing_roles:
          title: 3. Деректерді өңдеудегі рөлдер
          paragraphs:
            - '3.1. Оператор Контроллер ретінде — Клиенттердің (B2B) деректері: тіркеу, төлемдер, аккаунт.'
            - '3.2. Оператор Өңдеуші ретінде — Клиенттердің атынан Платформа арқылы өңделетін Соңғы пайдаланушылар деректері.'
            - '3.3. Толық шарттар — DPA құжатында (vconsult.kz/one-link/dpa).'
        collected_data:
          title: 4. Біз қандай деректерді жинаймыз
          points:
            - 'Клиент деректері (B2B): атауы, БСН/ЖСН, мекенжайы; байланыс тұлғасының аты-жөні, лауазымы; email, телефон; төлем реквизиттері; логин, хэштелген пароль; IP мекенжайы, cookies.'
            - 'Соңғы пайдаланушылар деректері: мессенджер идентификаторлары (WhatsApp ID, Telegram ID, Instagram ID, TikTok ID); телефон нөмірі (WhatsApp); аты және аватары; хабарламалардың мазмұны (мәтін, суреттер, файлдар, дауыстық хабарламалар); метадеректер; өтініштер тарихы.'
            - 'AI-агент деректері: мәтіндік хабарламалар; диалог контексті; талдау және жіктеу нәтижелері; дербестендіру деректері.'
            - 'Техникалық деректер: IP, браузер, операциялық жүйе; cookies; құрылғы; веб-аналитика.'
        purposes:
          title: 5. Өңдеу мақсаттары
          points:
            - 'Платформаға қолжетімділік беру; инбокстың жұмысын қамтамасыз ету; AI-агенттің жұмысы; CRM-пен интеграция; техникалық қолдау; Платформаны жақсарту (иесіздендірілген деректер); ҚР заңнамасын орындау; қауіпсіздік; маркетинг (жеке келісім болған жағдайда).'
        legal_basis:
          title: 6. Құқықтық негіздер
          paragraphs:
            - 'ҚР бойынша: келісім (№94-V Заңның 7, 8-баптары); шартты орындау (9-бап 2-тармақ); заң талаптары (9-бап 3-тармақ).'
            - 'GDPR бойынша: келісім (6(1)(a)-бап); шарт (6(1)(b)-бап); заңды мүдделер (6(1)(f)-бап); заңдық міндеттемелер (6(1)(c)-бап).'
            - 'Бөлек келісім талап етілетін жағдайлар: трансшекаралық беру (№94-V Заңның 7-бабы 6-тармағы); үшінші тұлғаларға беру; маркетинг.'
        third_party_sharing:
          title: 7. Деректерді үшінші тұлғаларға беру
          points:
            - 'Meta Platforms (WhatsApp, Instagram, Facebook Messenger): телефон нөмірлері, хабарламалар, метадеректер. Meta API арқылы алынған деректер профильдеу үшін пайдаланылмайды және сатылмайды. Өңдеу WhatsApp Business Policy, Meta Privacy Policy және Meta Platform Terms құжаттарына сәйкес жүзеге асырылады.'
            - 'Telegram (Bot API): Telegram ID, аты, хабарламалар. Сақтау кезінде кілттерді бөлек сақтау арқылы шифрлау қолданылады (Telegram Bot Platform Developer Terms of Service талаптарына сәйкес). Келісімсіз үшінші тұлғаларға берілмейді.'
            - 'TikTok: идентификатор, хабарламалар. Сатылмайды және жарнама үшін пайдаланылмайды. ЕЭП, Швейцария, Ұлыбритания және АҚШ-та қолжетімсіз болуы мүмкін.'
            - 'CRM жүйелері (AmoCRM, Bitrix24, Altegio): беру көлемі Клиенттің интеграция баптауларына байланысты.'
            - 'AI провайдерлері: деректер иесіздендірілген түрде беріледі. Келісімсіз модельдерді оқыту үшін пайдаланылмайды.'
            - 'Хостинг-провайдерлер мен мердігерлер: барлығымен DPA жасалған. Тізім — vconsult.kz/one-link/subprocessors. Өзгерістер туралы 14 күн бұрын хабарланады.'
        localization_and_transfers:
          title: 8. Деректерді оқшаулау және трансшекаралық беру
          paragraphs:
            - '8.1. 2024 жылғы 19.09. №566/НК бұйрығына (2025 жылғы 08.01 бастап) және №94-V Заңның 16-бабына сәйкес деректер Қазақстан Республикасындағы серверлерде сақталады. Шетелде көшірмелерін сақтауына жол беріледі.'
            - '8.2. Мессенджер API-лары мен бұлттық сервистер арқылы трансшекаралық беру ЕО, АҚШ және өзге юрисдикцияларға жүзеге асырылуы мүмкін.'
            - '8.3. Шарттары: жеткілікті қорғау (№108 Конвенция); деректер субъектісінің келісімі (№94-V Заңның 7-бабы 6-тармағы); шартты орындау; алушылармен деректерді қорғау жөніндегі шарттық кепілдіктер.'
            - '8.4. Деректерді трансшекаралық беру туралы сұрақтар — privacy@one-link.kz.'
        ai_processing:
          title: 9. AI-агент арқылы деректерді өңдеу
          paragraphs:
            - '9.1. Мақсаттары: жауаптарды генерациялау, жіктеу, тақырып пен көңіл күйді талдау, дербестендіру.'
            - '9.2. Ашықтық (GDPR 13(2)(f), 14(2)(g), 22-баптары, EU AI Act): пайдаланушыларға AI туралы хабарлау; қолданылатын логика туралы ақпарат алу құқығы; адамның араласуын талап ету құқығы; AI адамның қатысуынсыз заңдық шешімдер қабылдамайды.'
            - '9.3. Деректер жазбаша келісімсіз модельдерді оқыту үшін пайдаланылмайды.'
        cookies:
          title: 10. Cookies
          paragraphs:
            - 'Міндетті cookies (келісімсіз); функционалдық (келісіммен); аналитикалық (келісіммен); маркетингтік (жеке келісіммен).'
            - 'Алғашқы кіру кезінде баннер көрсетіледі. Алдын ала белгіленген checkbox-тар қолданылмайды (C-673/17 Planet49). Толығырақ — vconsult.kz/one-link/cookies.'
        data_security:
          title: 11. Деректерді қорғау
          paragraphs:
            - 'Шаралар (№94-V Заңның 20–23-баптары): беру кезінде TLS 1.2+; сақтау кезінде AES-256; Telegram деректерін кілттерді бөлек сақтау арқылы шифрлау; рөлдік қолжетімділік; резервтік көшірмелер; мониторинг; тестілеу; оқыту; жауапты тұлға.'
            - 'Инциденттер: ҚР уәкілетті органына — 1 жұмыс күні ішінде (№94-V Заңның 25-бабы); ЕО қадағалау органына — 72 сағат ішінде (GDPR 33-бабы); жоғары тәуекел болған жағдайда деректер субъектілеріне — негізсіз кідіріссіз (GDPR 34-бабы); Оператор зардап шеккен Клиенттерді инцидент анықталғаннан кейін дереу хабардар етеді.'
        data_subject_rights:
          title: 12. Деректер субъектілерінің құқықтары
          paragraphs:
            - 'ҚР бойынша (24-бап): жинау туралы білу; қол жеткізу; нақтылау; бұғаттау/жою; келісімді кері қайтарып алу (8-бап); шағымдану.'
            - 'GDPR бойынша (ЕО/ЕЭА): ақпарат алу (13–14-баптар); қол жеткізу (15-бап); түзету (16-бап); жою (17-бап); шектеу (18-бап); тасымалдау (20-бап, JSON/CSV); қарсылық білдіру (21-бап); автоматтандырылған өңдеу (22-бап); келісімді кері қайтарып алу (7(3)-бап); шағым беру (77-бап).'
            - 'Байланыс: privacy@one-link.kz немесе support@vconsult.kz. Мерзімдер: ҚР — 15 жұмыс күні; GDPR — 1 ай (+2 ай, егер сұрау күрделі болса, 12(3)-бап).'
        retention:
          title: 13. Сақтау мерзімдері
          points:
            - 'Аккаунт — шарт мерзімі + 3 жыл.'
            - 'Хат-хабарлар — Клиент жойғанға дейін.'
            - 'Аналитика — 26 ай.'
            - 'Төлемдер — 5 жыл (салықтық талаптар).'
            - 'Telegram — сұрау бойынша 30 күн.'
            - 'Cookies — Cookies саясатына сәйкес.'
        consent_management:
          title: 14. Opt-in / Opt-out
          paragraphs:
            - 'Клиент бизнестің атауын, ниетін және нөмірді/аккаунтты қамтитын opt-in алуға міндетті. Соңғы пайдаланушылар кез келген уақытта opt-out жасай алады. Басқару құралдары Платформада қолжетімді.'
        minors:
          title: 15. Кәмелетке толмағандардың деректері
          paragraphs:
            - 'Платформа 18 жасқа толмаған адамдарға арналмаған. Мұндай деректер анықталған жағдайда олар дереу жойылады.'
        changes:
          title: 16. Өзгерістер
          paragraphs:
            - 'Өзекті редакция — vconsult.kz/one-link/privacy. Елеулі өзгерістер туралы 10 жұмыс күні бұрын email арқылы хабарланады.'
        related_documents:
          title: 17. Байланысты құжаттар
          points:
            - 'Қызмет көрсету шарттары — vconsult.kz/one-link/terms'
            - Veritas Consult
            - Қазақстан Республикасы
            - social@vconsult.kz
