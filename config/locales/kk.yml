      name: Shopify
      short_description: Access order details and customer data from your Shopify store.
      description: Connect your Shopify store to access order details, customer information, and product data directly within your conversations and helps your support team provide faster, more contextual assistance to your customers.
    kaspi_pay:
      name: Kaspi Pay
      short_description: Create Kaspi QR payments directly from OneLink.
      description: Connect Kaspi Pay to generate QR payment links from OneLink and record successful payments in scheduling finance automatically.
    leadsquared:
      name: LeadSquared
      short_description: Sync your contacts and conversations with LeadSquared CRM.
      description: Sync your contacts and conversations with LeadSquared CRM. This integration automatically creates leads in LeadSquared when new contacts are added, and logs conversation activity to provide your sales team with complete context.
    medelement:
      name: Medelement
      short_description: Import specialists, cabinets, services, receptions, and patients from Medelement into scheduling.
      description: Connect Medelement to import specialists, cabinets, services, receptions, and patient data into Onelink scheduling while keeping imported data isolated from manual scheduling flows.
