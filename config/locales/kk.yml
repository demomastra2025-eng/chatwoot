    shared:
      last_updated_label: Жаңартылған күні
      last_updated_value: 2026 жылғы 7 наурыз
    terms:
      title: Қызмет көрсету шарттары
      intro:
        - Осы Қызмет көрсету шарттары OneLink платформасына, сайтына, қолданбаларына және байланысты сервистеріне қол жеткізу мен пайдалануды реттейді.
        - Workspace ашу, сервисті пайдалану немесе ұйым атынан OneLink қолдану арқылы сіз осы шарттарды сол ұйым атынан қабылдауға өкілетті екеніңізді растайсыз.
      sections:
        eligibility:
          title: Пайдалану құқығы және workspace үшін жауапкершілік
          paragraphs:
            - Сіз тіркеу деректерін дәл көрсетуге, тіркелгі деректерін құпия сақтауға және workspace туралы елеулі өзгерістерді уақтылы жаңартуға міндеттісіз.
            - Қызметкерлерге, мердігерлерге және әкімшілерге берілген рұқсаттарды қоса алғанда, сіздің workspace арқылы жасалған барлық әрекеттер үшін өзіңіз жауап бересіз.
        acceptable_use:
          title: Рұқсат етілген пайдалану
          paragraphs:
            - OneLink тек заңды бизнес мақсаттарында және дербес деректер, тұтынушылардың құқықтарын қорғау, еңбек және электрондық коммуникациялар туралы қолданылатын заңнаманы сақтай отырып пайдаланылуы тиіс.
          points:
            - Зиянды код жүктеуге, сервистің қолжетімділігіне кедергі келтіруге немесе деректерге, жүйелерге не workspace-терге рұқсатсыз қол жеткізуге әрекет жасауға тыйым салынады.
            - OneLink заңсыз хабар тарату, үшінші тұлғалардың құқықтарын бұзатын, жала жабатын немесе өзге де заңсыз контентті тарату үшін пайдаланылмауы тиіс.
        customer_data:
          title: Клиент деректері және нұсқаулар
          paragraphs:
            - Қызметке жүктеген клиент деректері, хабарламалар, файлдар және өзге контентке құқықтар заңда немесе шартта өзгеше көзделмесе, сізде қалады.
            - Сіз OneLink-ке мұндай деректерді сервисті ұсыну, қорғау, қолдау және жетілдіру, сондай-ақ заң талаптарын орындау үшін өңдеуді тапсырасыз.
        fees:
          title: Тарифтер, төлем және тоқтата тұру
          paragraphs:
            - Ақылы функциялар таңдалған тариф аясында төленеді. Заң бойынша қайтару міндетті болатын жағдайларды қоспағанда, төлемдер жазбаша түрде өзгеше келісілмесе, қайтарылмайды.
            - Төлем мерзімі өтіп кеткенде, құқықтық немесе қауіпсіздік тәуекелі туындағанда немесе зиянның алдын алу қажет болғанда OneLink қолжетімділікті шектеуге не тоқтата тұруға құқылы.
        intellectual_property:
          title: Зияткерлік меншік
          paragraphs:
            - OneLink және оның лицензиарлары сіздің клиент деректеріңізден басқа платформаға, бағдарламалық жасақтамаға, құжаттамаға, брендке және басқа зияткерлік меншік объектілеріне иелік етеді.
            - Осы шарттарды сақтаған жағдайда сізге жазылым мерзімі ішінде сервисті пайдалануға шектеулі, айрықша емес және берілмейтін құқық беріледі.
        warranties_liability:
          title: Кепілдіктерден бас тарту және жауапкершілікті шектеу
          paragraphs:
            - Егер бөлек жазбаша келісімде өзгеше тікелей көрсетілмесе, сервис бар күйінде және қолжетімділігіне қарай ұсынылады.
            - Заңмен рұқсат етілген ең жоғары шекте OneLink жанама, кездейсоқ, арнайы, айыппұлдық залалдар, сондай-ақ жоғалған пайда, табыс, деректер немесе іскерлік бедел үшін жауап бермейді.
            - Заңмен рұқсат етілген ең жоғары шекте осы шарттардан немесе сервистен туындайтын OneLink жиынтық жауапкершілігі талап туындаған оқиғаға дейінгі соңғы он екі айда сервис үшін төлеген сомаңыздан аспайды.
        termination:
          title: Тоқтату және байланыс
          paragraphs:
            - Сіз сервисті пайдалануды кез келген уақытта тоқтата аласыз. OneLink елеулі бұзушылық, заң талаптары немесе сервисті ұзақ уақыт теріс пайдалану жағдайында қолжетімділікті тоқтатуға не шектеуге құқылы.
            - Осы шарттар бойынша сұрақтарды legal@one-link.kz мекенжайына жіберуге болады.
    privacy:
      title: Құпиялылық саясаты
      intro:
        - Осы Құпиялылық саясаты OneLink сайтқа кіргенде, workspace ашқанда немесе клиенттік коммуникация платформасын пайдаланғанда дербес деректерді қалай жинайтынын, пайдаланатынын, сақтайтынын және ашатынын түсіндіреді.
        - OneLink workspace атынан клиент деректерін өңдеген жағдайда, тиісті workspace сол деректердің операторы болып қалады, ал OneLink қолданылатын құқықтық режимге сәйкес өңдеуші немесе сервистік провайдер ретінде әрекет етеді.
      sections:
        collected_data:
          title: Біз қандай деректерді жинаймыз
          points:
            - Тіркелгі және профиль деректері, соның ішінде аты, email, workspace атауы, рөлі және аутентификация деректері.
            - Құрылғы, браузер, IP-мекенжай, жүйелік логтар, оқиғалар және функциялармен әрекеттесу туралы сервис пайдалану деректері.
            - Сіз немесе пайдаланушыларыңыз платформаға жіберетін клиенттік коммуникация деректері, соның ішінде хабарламалар, файлдар, белгілер және баптаулар.
        purposes:
          title: Деректерді қалай пайдаланамыз
          points:
            - Сервисті ұсыну, аутентификациялау, сүйемелдеу және қолдау үшін.
            - Платформаны қорғау, теріс пайдалануды анықтау, ақауларды жою және өнімділік пен функционалдылықты жақсарту үшін.
            - Сервистік хабарламалар, транзакциялық хабарламалар, заңды хабарламалар және рұқсат етілген жағдайда өнім жаңартуларын жіберу үшін.
        legal_basis:
          title: Құқықтық негіздер және деректерді беру
          paragraphs:
            - Жағдайға қарай OneLink деректерді шартты орындау, заңды мүдделер, құқықтық міндеттемелер және заң бойынша қажет болған жағдайда келісім негізінде өңдейді.
            - Біз деректерді инфрақұрылым провайдерлеріне, аналитика сервистеріне, қолдау қызметтеріне, төлем провайдерлеріне және құпиялылық пен деректерді қорғау міндеттемелерімен байланысты кәсіби кеңесшілерге бере аламыз.
        retention:
          title: Сақтау мерзімі және қауіпсіздік
          paragraphs:
            - Біз дербес деректерді сервисті ұсыну, заңдық және бухгалтерлік міндеттемелерді орындау, дауларды шешу және шарттық құқықтарымызды қорғау үшін қажет мерзімде сақтаймыз.
            - Біз дербес деректерді қорғау үшін техникалық және ұйымдастырушылық шаралар қолданамыз, бірақ ешбір беру немесе сақтау тәсілі абсолютті қауіпсіз болады деп кепілдік берілмейді.
        rights:
          title: Сіздің құқықтарыңыз
          paragraphs:
            - Қолданылатын заңнамаға сәйкес сіз қолжеткізуді, түзетуді, жоюды, өңдеуді шектеуді, қарсылық білдіруді, деректерді тасымалдауды немесе өңдеу келісімге негізделсе, келісімді қайтарып алуды сұрай аласыз.
            - Егер сіздің деректеріңізді OneLink клиенті ұсынған соңғы пайдаланушы болсаңыз, алдымен тиісті workspace-ке жүгініңіз, себебі мұндай деректерді өңдеу мақсаттарын сол workspace айқындайды.
        international:
          title: Халықаралық беру және байланыс
          paragraphs:
            - Дербес деректер шекара арқылы берілген жағдайда, OneLink беру сипатына сәйкес келетін шарттық, техникалық және ұйымдастырушылық қорғау шараларын қолданады.
            - Құпиялылыққа қатысты сұрақтар мен өтініштерді legal@one-link.kz мекенжайына жіберуге болады.
