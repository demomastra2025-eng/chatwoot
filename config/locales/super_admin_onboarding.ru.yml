# Russian texts of «Новый клиент» (one page: account, organization, plan, first administrator) and of the adding of a user
# in the «Пользователи» block of the account card. Both ask the same thing of a new person: an invitation by e-mail or a
# password the super admin sets, so they share the member texts.
ru:
  super_admin:
    audits:
      actions:
        create_client: "Подключение клиента"
        add_user: "Пользователь добавлен в аккаунт"

    onboarding:
      timezones:
        astana: "Астана, Алматы"
        moscow: "Москва"
        tashkent: "Ташкент"
        bishkek: "Бишкек"
        baku: "Баку"
        tbilisi: "Тбилиси"
        yerevan: "Ереван"
        minsk: "Минск"
        kyiv: "Киев"
        istanbul: "Стамбул"
        dubai: "Дубай"

      page:
        title: "Новый клиент"
        description: "Аккаунт, организация, тариф и первый администратор на одной странице. Всё создаётся одним действием: если что-то не получится, не сохранится ничего."
        back: "К списку аккаунтов"
        submit: "Создать клиента"
        cancel: "Отмена"
        errors_title: "Клиент не создан, ничего не сохранено. Исправьте отмеченные поля: всё, что вы ввели, осталось на месте."

      account:
        title: "Аккаунт"
        hint: "Рабочее пространство клиента: его операторы, чаты и настройки."
        name: "Название аккаунта"
        name_hint: "Так аккаунт называется в списках и в кабинете оператора."
        language: "Язык: русский"
        language_hint: "Платформа пока работает только на русском, поэтому язык аккаунта не выбирается."
        timezone: "Часовой пояс"
        timezone_hint: "По нему считаются отчёты и рабочие часы. Для большинства клиентов подходит Астана."

      organization:
        title: "Организация"
        hint: "Компания, которая платит за аккаунты. К одной организации можно привязать несколько аккаунтов."
        none:
          title: "Без организации"
          hint: "Аккаунт работает сам по себе. Организацию можно привязать позже на карточке аккаунта."
        existing:
          title: "Выбрать из списка"
          hint: "Аккаунт войдёт в организацию, которая уже создана."
          hint_empty: "Организаций пока нет: создайте новую."
          label: "Организация"
          prompt: "Выберите организацию"
        new:
          title: "Создать новую"
          hint: "Название и БИН. Остальные реквизиты можно заполнить позже на карточке организации."
          name: "Название организации"
          bin: "БИН"
          bin_hint: "12 цифр. Можно оставить пустым и заполнить позже."

      plan:
        title: "Тариф"
        hint: "База включена всегда. Отметьте модули, которые нужны аккаунту; их можно поменять позже."
        limits_note: "Лимиты операторов и хранилища берутся из тарифа: вводить их здесь не нужно. Для одного аккаунта их можно изменить на его карточке."

      admin:
        title: "Первый администратор"
        hint: "Человек, который будет управлять аккаунтом клиента. Остальных пользователей можно добавить позже на карточке аккаунта."
        name: "Имя и фамилия"
        email: "E-mail"
        email_hint: "По нему человек входит в кабинет."
        adopt:
          label: "Добавить этого пользователя администратором нового аккаунта"
          hint: "Он уже есть на платформе: его пароль и данные не изменятся, приглашение не отправляется."

      member:
        title: "Добавить пользователя"
        hint: "Выберите человека, который уже есть на платформе, или добавьте нового."
        mode:
          pick:
            title: "Уже есть на платформе"
            hint: "Выберите из списка: его пароль и данные не изменятся."
          create:
            title: "Новый пользователь"
            hint: "Введите e-mail и имя, а затем выберите, как человек получит доступ."
        pick:
          label: "Пользователь"
          hint: "Начните вводить имя или e-mail."
        role:
          label: "Роль"
          hint: "Администратор управляет аккаунтом и его настройками, оператор отвечает на чаты."
        name: "Имя и фамилия"
        email: "E-mail"
        submit: "Добавить"
        password_for: "Пароль для %{email}"
        adopt:
          label: "Добавить этого пользователя в аккаунт"
        errors_title: "Пользователь не добавлен. Исправьте отмеченные поля: всё, что вы ввели, осталось на месте."
        added:
          existing: "%{name} добавлен(а) в аккаунт: %{role}."
          invited: "%{name} добавлен(а) в аккаунт: %{role}. Приглашение отправлено на %{email}."
          invite_failed: "%{name} добавлен(а) в аккаунт: %{role}. Приглашение отправить не удалось: откройте карточку пользователя и задайте пароль."
          password: "%{name} добавлен(а) в аккаунт: %{role}. Пароль задан, он показан ниже один раз."
        errors:
          role_unknown: "Выберите роль из списка."
          pick_missing: "Выберите пользователя из списка."
          already_member: "%{name} уже состоит в этом аккаунте: %{role}."
          email_blank: "Введите e-mail."
          email_invalid: "Проверьте e-mail: в нём ошибка."
          email_taken: "Пользователь с таким e-mail уже есть: %{name}."
          email_taken_plain: "Пользователь с таким e-mail уже есть."
          name_blank: "Введите имя и фамилию."
          name_long: "Имя длиннее %{max} знаков."
          access_missing: "Выберите, как человек получит доступ."
          mail_off: "Почта платформы не настроена, письмо не уйдёт. Задайте пароль."
          password_blank: "Введите пароль или нажмите «Сгенерировать»."
          failed: "Не удалось добавить пользователя, ничего не сохранено. Повторите попытку; если ошибка повторится, сообщите разработчику."

      access:
        title: "Как человек получит доступ"
        invitation:
          title: "Отправить приглашение на почту"
          hint: "Человек получит письмо со ссылкой и сам задаст пароль."
          hint_off: "Сейчас недоступно: письму некуда уходить."
        password:
          title: "Задать пароль"
          hint: "Вы придумываете пароль и передаёте его человеку. После создания он будет показан один раз."
        mail_ok: "Почта платформы работает"
        mail_off: "Почта не настроена — письмо не уйдёт, задайте пароль"

      password:
        label: "Пароль"
        placeholder: "Нажмите «Сгенерировать» или придумайте свой"
        generate: "Сгенерировать"
        copy: "Скопировать"
        copied: "Скопировано"
        requirements: "Пароль должен содержать"
        latin_note: "Допустимы только латинские буквы, цифры и знаки: русские буквы не подходят."
        bad: "Пароль не подходит: он должен содержать %{details}."
        rules:
          length: "не меньше %{min} знаков"
          uppercase: "заглавную латинскую букву"
          lowercase: "строчную латинскую букву"
          number: "цифру"
          special: "спецсимвол (например %{examples})"
          unknown: "только латинские буквы, цифры и знаки: русские буквы не подходят"

      errors:
        account_name_blank: "Введите название аккаунта."
        account_name_long: "Название длиннее %{max} знаков."
        timezone_unknown: "Выберите часовой пояс из списка."
        organization_mode_unknown: "Выберите, как указать организацию."
        organization_missing: "Выберите организацию из списка."
        organization_name_blank: "Введите название организации."
        organization_bin_taken: "Организация с таким БИН уже есть: выберите её из списка."
        failed: "Не удалось создать клиента, ничего не сохранено. Повторите попытку; если ошибка повторится, сообщите разработчику."

      created:
        title: "Готово: клиент подключён"
        description: "Аккаунт «%{name}» создан и готов к работе."
        account: "Аккаунт создан: %{name} (#%{id}). Язык: русский, часовой пояс: %{timezone}."
        organization:
          none: "Организация: без организации."
          linked: "Организация: аккаунт привязан к «%{name}»."
          created: "Организация: создана «%{name}», аккаунт привязан к ней."
        plan: "Тариф: %{plan}."
        trial: "Пробный период до %{date} (Астана)."
        admin:
          invited: "Приглашение отправлено на %{email}. Ссылка в письме действует %{hours} ч.; если человек не успеет, на странице входа есть «Забыли пароль?»."
          invite_failed: "Приглашение на %{email} отправить не удалось. Откройте карточку пользователя и задайте ему пароль."
          password: "Пароль для %{email} задан."
          existing: "%{name} (%{email}) назначен(а) администратором аккаунта. Пароль не менялся."
        password_title: "Пароль для входа"
        password_once: "Пароль показан один раз. Скопируйте его сейчас и передайте человеку: после этой страницы увидеть его будет нельзя. После входа человек сможет сменить пароль сам."
        card: "Открыть карточку аккаунта"
        enter: "Войти в аккаунт"
        enter_waits: "Войти под администратором можно, когда он примет приглашение: до этого его e-mail не подтверждён."
        another: "Создать ещё одного клиента"
        next_title: "Что дальше"

      already:
        title: "Клиент уже создан"
        description: "Аккаунт «%{name}» уже создан: форма отправлена повторно, и второго аккаунта не появилось."
        next_title: "Ничего не изменилось"
        note: "Пароль показывается один раз, при создании. Если вы его не записали, задайте новый на карточке пользователя."
