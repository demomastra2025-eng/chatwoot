ru:
  captain:
    reply_suggestion:
      errors:
        voice_channel_unsupported: В звонке нельзя отправить текст. Откройте чат клиента в мессенджере, чтобы получить подсказку.
        busy: Сейчас слишком много запросов к ИИ в аккаунте. Повторите через минуту.
        conversation_not_found: Диалог не найден.
        api_key_missing: ИИ не настроен.
        disabled: ИИ-функции выключены для аккаунта.
        quota_exceeded: Лимит ИИ-ответов исчерпан.
        forbidden: Нет доступа к этому диалогу.
        not_found: Подсказка не найдена.
        no_active_agent: 'AI выключен: все агенты выключены.'
        no_routing_cards: 'AI не может выбрать агента: заполните у агентов «Что делает агент».'
        action_agent_unavailable: 'Действие недоступно: агент, который его подготовил, выключен. Попросите AI снова.'
      claims:
        cancelled: что запись отменена
        moved: что запись перенесена
        no_appointment: что записи нет или нечего отменять
      reasons:
        consent_required: Пациент ещё не подтвердил согласие на обработку данных ИИ — ответьте сами или дождитесь согласия.
        safety_blocked: Проверка безопасности остановила ответ ИИ — ответьте клиенту сами.
        agent_rule: 'Сработало правило агента: %{reason}. Ответьте клиенту сами.'
        patient_requested_human: Пациент просит живого сотрудника — ответьте ему сами.
        router_no_reply: Пациент только благодарит или прощается — ответ не требуется; ИИ ничего не готовил.
        swallowed_request: Пациент просит отменить, перенести или оформить запись, а ИИ счёл, что ответ не нужен. Проверьте сообщение и ответьте сами.
        unsafe_silence: Пациент отвечает на предложение или время клиники или подтверждает визит, которого нет в записях, а ИИ счёл, что ответ не нужен. Проверьте сообщение и ответьте сами.
        unverified_times: 'Проверьте время %{times}: ИИ не нашёл его среди свободных окон, которые искал.'
        misattributed_times: 'Проверьте врача для времени %{times}: в результатах поиска это время есть у другого специалиста, а не у названного.'
        unsupported_claims: 'Проверьте черновик: в нём сказано, %{claims}, но ИИ этого не делал и не нашёл, а его поиск охватывает только записи, оформленные из этого чата.'
        claim_check_unavailable: 'Проверка черновика недоступна — ответьте клиенту сами.'
        appointment_exists: 'В черновике сказано, что записи нет, но ИИ видел предстоящую запись этого пациента. Проверьте и ответьте клиенту сами.'
        council_unresolved: 'ИИ не решил часть обращения — ответьте на неё сами: %{parts}.'
        council_technical: 'Часть обращения не выполнена из-за технической ошибки — ответьте на неё сами: %{parts}.'
        council_unreported: 'По части обращения подготовлено действие, но текста для пациента нет — проверьте карточку: %{parts}.'
        council_no_text: ИИ-консилиум не подготовил текст для пациента — проверьте подготовленные действия или ответьте сами.
        council_no_reply: Сообщения пациента не требуют ответа (только благодарность, «ок» или приветствие).
