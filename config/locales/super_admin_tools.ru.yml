# Russian texts of the tools of the super admin: the search box of the header, the actions on many accounts, the block
# «Требует внимания» of «Сводка» and the history of the entries into an account.
# The main file of the super admin is super_admin.ru.yml. A count in a sentence takes the form of its noun by the plural
# rule of Russian (one / few / many / other, see config/locales/pluralization.ru.rb).
ru:
  super_admin:
    audits:
      actions:
        suspend_account: "Блокировка аккаунта"
        activate_account: "Разблокировка аккаунта"

    # ------------------------------------------------------------------ search
    search:
      title: "Поиск"
      description: "Аккаунты, пользователи и организации: найдите нужную запись и откройте её."
      label: "Поиск по аккаунтам, пользователям и организациям"
      placeholder: "Аккаунт, e-mail или БИН"
      results_for: "Результаты по запросу «%{query}»"
      blank: "Введите название или номер аккаунта, e-mail или имя пользователя, название или БИН организации."
      too_short: "Введите не меньше двух символов."
      nothing: "По запросу «%{query}» ничего не найдено. Проверьте написание или поищите по номеру аккаунта, e-mail пользователя или БИН организации."
      none_in_group: "Совпадений нет."
      show_all: "Показать все (%{count})"
      super_admin: "Супер-администратор"
      groups:
        accounts: "Аккаунты"
        users: "Пользователи"
        organizations: "Организации"
      user_accounts:
        one: "в %{count} аккаунте"
        few: "в %{count} аккаунтах"
        many: "в %{count} аккаунтах"
        other: "в %{count} аккаунта"
      organization_accounts:
        one: "%{count} аккаунт"
        few: "%{count} аккаунта"
        many: "%{count} аккаунтов"
        other: "%{count} аккаунта"

    # ------------------------------------------------- actions on many accounts
    bulk:
      actions:
        apply_plan: "Применить тариф и модули"
        extend_trial: "Продлить пробный период"
        suspend: "Заблокировать"
        activate: "Разблокировать"
        link_organization: "Привязать к организации"
      bar:
        label: "Действия с выбранными аккаунтами"
        selected: "Выбрано: %{count}"
        select_all: "Выбрать все на странице"
        select_row: "Выбрать аккаунт «%{name}»"
        clear: "Снять выбор"
        limit:
          one: "За один раз можно выбрать не больше %{count} аккаунта. Что изменится, вы увидите до подтверждения."
          few: "За один раз можно выбрать не больше %{count} аккаунтов. Что изменится, вы увидите до подтверждения."
          many: "За один раз можно выбрать не больше %{count} аккаунтов. Что изменится, вы увидите до подтверждения."
          other: "За один раз можно выбрать не больше %{count} аккаунтов. Что изменится, вы увидите до подтверждения."
      page:
        description: "Выбрано аккаунтов: %{count}. Сначала смотрим, что изменится, потом применяем."
        back: "Вернуться к списку"
      parameters:
        apply_plan:
          title: "Тариф и модули"
          hint: "База включена всегда. Отметьте модули, которые должны быть у выбранных аккаунтов: остальные модули у них отключатся."
          submit: "Показать, что изменится"
        link_organization:
          title: "Организация"
          hint: "Выбранные аккаунты привяжутся к этой организации; аккаунты других организаций перейдут в неё. «Без организации» отвяжет их."
          label: "Организация"
          prompt: "Выберите организацию"
          none: "Без организации"
          submit: "Показать, что изменится"
      errors:
        unknown_module: "Такого модуля нет. Выберите модули из списка."
        unknown_organization: "Выберите организацию из списка или «Без организации»."
      warnings:
        suspend: "Заблокированный аккаунт не обслуживает операторов и виджеты, пока его не разблокируют. Данные аккаунта сохраняются."
      summary:
        changing: "Изменятся"
        changing_note: "аккаунтов"
        skipping: "Будут пропущены"
        skipping_none: "ничего не пропускаем"
        functions: "Функции"
        enable: "Включатся (аккаунтов)"
        disable: "Отключатся (аккаунтов)"
        note: "Аккаунтов с отметкой — %{count}. %{text}"
        accounts: "Аккаунты"
        time_note: "Время указано по Астане"
      columns:
        account: "Аккаунт"
        now: "Сейчас"
        result: "Что произойдёт"
      outcome:
        change: "Изменится"
        skip: "Пропустим"
      reasons:
        deleting: "Аккаунт на удалении"
        missing: "Аккаунт не найден"
        no_changes: "Тариф уже такой же"
        not_trial: "Нет пробного периода из админ-панели"
        already_suspended: "Уже заблокирован"
        already_active: "Не заблокирован"
        already_there: "Уже в этой организации"
        already_free: "Уже без организации"
        failed: "Не удалось выполнить"
      detail:
        enable: "Включится: %{count}"
        disable: "Отключится: %{count}"
        limits: "Лимиты: %{count}"
        nothing: "Функции и лимиты не меняются"
        trial_none: "Пробного периода нет"
        trial_active: "До %{time}"
        trial_ended: "Закончился %{time}"
        trial_reopen: "Пробный период откроется снова"
        no_organization: "Без организации"
      confirm:
        title: "Подтверждение"
        hint: "Действие применяется к аккаунтам по одному, для каждого изменённого аккаунта в журнале аудита появится отдельная запись."
        nothing: "Менять нечего: все выбранные аккаунты будут пропущены."
        submit:
          one: "Применить к %{count} аккаунту"
          few: "Применить к %{count} аккаунтам"
          many: "Применить к %{count} аккаунтам"
          other: "Применить к %{count} аккаунта"
        cancel: "Отмена"
      flashes:
        none_selected: "Отметьте в списке хотя бы один аккаунт."
        too_many:
          one: "За один раз можно выбрать не больше %{count} аккаунта. Ничего не изменено."
          few: "За один раз можно выбрать не больше %{count} аккаунтов. Ничего не изменено."
          many: "За один раз можно выбрать не больше %{count} аккаунтов. Ничего не изменено."
          other: "За один раз можно выбрать не больше %{count} аккаунтов. Ничего не изменено."
        malformed: "Список аккаунтов передан в неверном виде. Отметьте аккаунты в списке заново."
        unknown_action: "Такого действия нет. Выберите действие на панели над списком."
        not_ready: "Сначала выберите параметры действия и посмотрите, что изменится. Ничего не изменено."
      result:
        summary: "%{action}: успешно %{done}, пропущено %{skipped}%{reasons}."
        reasons: " (%{list})"
        reason_item: "%{reason} — %{count}"

    # ------------------------------------------------------------------ alerts
    alerts:
      title: "Требует внимания"
      all_clear: "Всё в порядке: пробные периоды, место, очереди и каналы не требуют внимания."
      found: "Найдено: %{count}"
      and_more: "Показаны первые, ещё: %{count}"
      show_all: "Показать все"
      incomplete:
        title: "Часть проверок не выполнена"
        text: "Не удалось проверить: %{sources}. Остальные проверки выполнены."
      sources:
        trials: "пробные периоды"
        storage: "место на диске"
        openrouter: "ключ OpenRouter"
        sidekiq: "очереди задач"
        channels: "каналы"
      trials_ending:
        title: "Пробный период заканчивается в ближайшие 3 дня"
        text: "Продлите пробный период или назначьте тариф, пока функции пробного периода не отключились."
        note: "осталось %{left} · до %{time}"
      trials_expired:
        title: "Пробный период закончился за последние 7 дней"
        text: "Если аккаунт продолжает работать, назначьте ему тариф или продлите пробный период."
        note: "закончился %{time}"
      storage:
        note: "%{percent}% · %{used} из %{total}"
      storage_critical:
        title: "Место заполнено более чем на 95%"
        text: "Загрузки сотрудников и документы ИИ упрутся в лимит: увеличьте лимит места или очистите корзину аккаунта."
      storage_warning:
        title: "Место заполнено более чем на 80%"
        text: "Лимит места скоро закончится: увеличьте его заранее или очистите корзину аккаунта."
      openrouter:
        link: "Модели ИИ: состояние ключа OpenRouter"
        missing:
          title: "Ключ OpenRouter не задан"
          text: "Без ключа ИИ-агенты не отвечают. Укажите ключ на странице «Модели ИИ»."
        invalid:
          title: "Ключ OpenRouter не принимается"
          text: "ИИ-агенты не отвечают. Проверьте ключ или укажите новый на странице «Модели ИИ»."
        expired:
          title: "Срок действия ключа OpenRouter истёк"
          text: "ИИ-агенты не отвечают. Укажите новый ключ на странице «Модели ИИ»."
        credits_exhausted:
          title: "Кредиты OpenRouter закончились"
          text: "ИИ-агенты перестанут отвечать, пока баланс не пополнен."
        key_limit_exhausted:
          title: "Лимит ключа OpenRouter исчерпан"
          text: "ИИ-агенты перестанут отвечать, пока лимит ключа не увеличен."
        unavailable:
          title: "Состояние ключа OpenRouter проверить не удалось"
          text: "Откройте страницу «Модели ИИ» и запустите проверку ключа ещё раз."
        credits_low:
          title: "Кредиты OpenRouter заканчиваются"
          text: "Осталось меньше 10% от пополненной суммы: пополните баланс заранее."
      queues:
        link: "Мониторинг: вкладка «Очереди»"
        waiting: "ждёт %{wait}, задач в очереди: %{jobs}"
      queues_slow:
        title: "Очередь задач отстаёт"
        text: "Задачи ждут дольше минуты. Проверьте фоновые процессы на вкладке «Очереди»."
      queues_dead:
        title: "Есть задачи, которые не удалось выполнить"
        text: "Откройте очереди, посмотрите причину и перезапустите нужные задачи."
      queues_unavailable:
        title: "Очереди задач недоступны для проверки"
        text: "Состояние очередей прочитать не удалось. Откройте вкладку «Очереди» на странице мониторинга."
      reauthorization:
        title: "Каналы требуют повторной авторизации"
        text: "Канал работает с перебоями, пока его не подключат заново. Откройте аккаунт и сообщите администратору."

    # ------------------------------------------------ entries into an account
    impersonations:
      title: "Входы в аккаунт"
      hint:
        account: "Кто из супер-администраторов входил в этот аккаунт под пользователем (последние 20)."
        user: "Когда супер-администраторы входили в аккаунты под этим пользователем (последние 20)."
      empty: "Входов пока не было."
      columns:
        when: "Когда (Астана)"
        actor: "Кто вошёл"
        user: "Под пользователем"
        account: "В аккаунт"
      unknown_user: "Пользователь не найден"
      deleted_user: "пользователь удалён"
      deleted_account: "аккаунт удалён"
