kk:
  captain:
    reply_suggestion:
      errors:
        voice_channel_unsupported: Қоңырауда мәтін жіберу мүмкін емес. Ұсыныс алу үшін клиенттің мессенджердегі чатын ашыңыз.
        busy: Қазір аккаунтта ЖИ-ге сұраныс тым көп. Бір минуттан кейін қайталаңыз.
        conversation_not_found: Диалог табылмады.
        api_key_missing: ЖИ бапталмаған.
        disabled: Бұл аккаунтта ЖИ функциялары өшірулі.
        quota_exceeded: ЖИ жауаптарының лимиті таусылды.
        forbidden: Бұл диалогқа қолжетімділік жоқ.
        not_found: Ұсыныс табылмады.
      claims:
        cancelled: жазба болдырылды
        moved: жазба ауыстырылды
        no_appointment: жазба жоқ немесе болдыратын ештеңе жоқ
      reasons:
        safety_blocked: Қауіпсіздік тексеруі ЖИ жауабын тоқтатты — клиентке өзіңіз жауап беріңіз.
        agent_rule: 'Агент ережесі іске қосылды: %{reason}. Клиентке өзіңіз жауап беріңіз.'
        patient_requested_human: Пациент тірі қызметкермен сөйлескісі келеді — өзіңіз жауап беріңіз.
        router_no_reply: Пациент тек алғыс айтады немесе қоштасады — жауап қажет емес; ЖИ ештеңе дайындаған жоқ.
        swallowed_request: Пациент жазылуды болдырмауды, ауыстыруды немесе жаңадан жазылуды сұрайды, ал ЖИ жауап қажет емес деп шешті. Хабарламаны тексеріп, өзіңіз жауап беріңіз.
        unsafe_silence: Пациент клиниканың ұсынысына немесе уақытына жауап береді немесе жазылмаған визитті растайды, ал ЖИ жауап қажет емес деп шешті. Хабарламаны тексеріп, өзіңіз жауап беріңіз.
        unverified_times: '%{times} уақытын тексеріңіз: ЖИ оны өзі іздеген бос уақыттардың арасынан таппады.'
        misattributed_times: '%{times} уақытына дәрігерді тексеріңіз: іздеу нәтижесінде бұл уақыт аталған маманда емес, басқа маманда бар.'
        unsupported_claims: 'Қолжазбаны тексеріңіз: онда %{claims} делінген, бірақ ЖИ мұны орындаған немесе тапқан жоқ, оның іздеуі тек осы чаттан рәсімделген жазбаларды қамтиды.'
        council_unresolved: 'ЖИ өтініштің бір бөлігін шеше алмады — оған өзіңіз жауап беріңіз: %{parts}.'
        council_technical: 'Өтініштің бір бөлігі техникалық қатеге байланысты орындалмады — оған өзіңіз жауап беріңіз: %{parts}.'
        council_unreported: 'Өтініштің бір бөлігі бойынша әрекет дайындалды, бірақ пациентке мәтін жоқ — карточканы тексеріңіз: %{parts}.'
        council_no_text: ЖИ-консилиум пациентке мәтін дайындамады — дайындалған әрекеттерді тексеріңіз немесе өзіңіз жауап беріңіз.
        council_no_reply: Пациенттің хабарламалары жауапты қажет етпейді (тек алғыс, «ок» немесе сәлемдесу).
