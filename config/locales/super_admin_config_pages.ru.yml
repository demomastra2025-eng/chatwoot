# Russian texts of the config pages of the super admin as the owner sees them: the settings he really sets in view, the
# technical ones folded under «Для разработчика», the addresses to copy into the console of a service, the one-line effect
# and the question of the switches that change the platform for every account, the contents of the settings, and the
# «Для разработчика» block of the cards. The super admin is Russian only (ru-only freeze): nothing here is translated.
ru:
  super_admin:
    developer:
      title: "Для разработчика"
      account_hint: "Служебные данные аккаунта: номер, версия тарифа, служебные параметры. Менять их здесь не нужно."
      user_hint: "Служебные данные пользователя: номер, дата изменения и токен. Менять их здесь не нужно."
      organization_hint: "Служебные данные организации: номер и даты. Менять их здесь не нужно."
      id: "Номер"
      updated: "Изменено"
      created: "Создано"
      plan_version: "Версия тарифа"
      locale_code: "Код языка"
      none: "нет"

    # The language of an account as a word in a sentence («Язык: русский»)
    locale_names:
      ru: "русский"
      kk: "казахский"
      en: "английский"

    navigation:
      version: "Версия %{version}"

    settings:
      contents_title: "Страницы настроек"
      open: "Открыть"
      version_footer: "Версия OneLink:"
      groups:
        platform:
          title: "Платформа"
          hint: "Общие правила платформы, ИИ и внешний вид."
        connections:
          title: "Каналы и интеграции"
          hint: "Ключи сервисов, через которые аккаунты подключают каналы и почту."
      status:
        configured: "Настроено"
        not_configured: "Не настроено"
      pages:
        general: "Регистрация новых аккаунтов, лимиты по умолчанию, размер файлов."
        captain: "Ключ OpenRouter и модели ИИ-агентов."
        custom_branding: "Название платформы, логотипы и ссылки."
        email: "Суточный лимит писем и входящая почта."
        facebook: "Приложение Meta для сообщений Facebook Messenger."
        instagram: "Приложение Meta для сообщений Instagram."
        tiktok: "Приложение TikTok для сообщений и лидов."
        whatsapp_embedded: "Приложение Meta для быстрого подключения WhatsApp."
        google: "Подключение почты Gmail и вход через Google."
        microsoft: "Подключение корпоративной почты Microsoft 365."
        slack: "Уведомления и ответы из Slack."

    app_config:
      switch_on: "Включено"
      switch_off: "Выключено"
      flashes:
        api_version_invalid: "%{title}: версия должна выглядеть как v25.0 (буква v, число, точка и число)."

      layout:
        developer:
          title: "Для разработчика"
          hint: "Технические настройки: их обычно задаёт разработчик один раз."
          warning: "Ошибка в этих настройках может остановить канал или вход у всех аккаунтов. Если не уверены, не меняйте."
          read_only: "Только для просмотра: из админки эти значения не меняются."
          version_default: "По умолчанию: %{version}"
          destination_note: "На рабочем сервере оставьте пустым."
          targets:
            dev: "DEV"
            widget: "МедЭлемент"
            not_set: "Не задано"
        google_login:
          server_not_ready: "Нужна настройка сервера: пока её нет, кнопка входа через Google не появится, что бы вы ни выбрали."
        signup:
          protection_label: "Защита от ботов (hCaptcha)"
          protection_on: "Настроена: у формы регистрации есть проверка."
          protection_off: "Не настроена: боты смогут создавать аккаунты. Заполните оба ключа ниже."
          protection_half: "Заполнен только один ключ: проверка не заработает. Нужны и ключ сайта, и секретный ключ."
        sections:
          general:
            signup:
              title: "Регистрация новых аккаунтов"
              hint: "Решите, могут ли новые люди сами создать аккаунт на странице входа."
            limits:
              title: "Лимиты по умолчанию и файлы"
              hint: "Действуют для аккаунтов, у которых нет своего значения. У отдельного аккаунта лимит задаётся на его карточке."

      addresses:
        title: "Что указать в кабинете сервиса"
        copy: "Скопировать"
        copied: "Скопировано"
        webhook: "Адрес вебхука (Callback URL)"
        redirect: "Адрес возврата (Redirect URI)"
        pages:
          facebook:
            title: "Что указать в кабинете Meta"
            hint: "В настройках приложения Meta для Messenger вставьте этот адрес в раздел вебхуков. Токен проверки лежит в блоке «Для разработчика»."
          instagram:
            title: "Что указать в кабинете Meta"
            hint: "В настройках приложения Meta для Instagram вставьте эти адреса. Токен проверки лежит в блоке «Для разработчика»."
          tiktok:
            title: "Что указать в кабинете TikTok"
            hint: "Адрес возврата вставьте в настройках приложения TikTok. Адрес вебхука платформа сообщает TikTok сама."
          whatsapp_embedded:
            title: "Что указать в кабинете Meta"
            hint: "В настройках приложения Meta для WhatsApp вставьте этот адрес в раздел вебхуков. Токен проверки лежит в блоке «Для разработчика»."
          google:
            title: "Что указать в Google Cloud Console"
            hint: "Этот адрес вставьте в приложение Google в поле «Авторизованные URI перенаправления». Система берёт его из адреса платформы, здесь его менять не нужно."
          microsoft:
            title: "Что указать в кабинете Azure"
            hint: "Этот адрес вставьте в приложение Azure как адрес перенаправления. Система берёт его из адреса платформы, здесь его менять не нужно."

      guards:
        protection:
          "on": "настроена"
          "off": "не настроена, боты смогут создавать аккаунты"
        ENABLE_ACCOUNT_SIGNUP:
          effect: "Включено — любой человек может сам создать аккаунт на странице входа. Выключено — аккаунты создаёте только вы."
          confirm_on: "Включить самостоятельную регистрацию? Каждый новый аккаунт получит пробный период на %{trial_days} дн. с ИИ-агентами за счёт ключа платформы, после него операторы и каналы — 0. Защита от ботов: %{protection}."
          confirm_off: "Выключить самостоятельную регистрацию? Новые люди не смогут сами создать аккаунт. Уже созданные аккаунты продолжат работать."
        ENABLE_GOOGLE_OAUTH_LOGIN:
          effect: "Включено — на странице входа у всех операторов появляется кнопка «Войти через Google»."
          confirm_on: "Показать вход через Google на странице входа всех операторов?"
          confirm_off: "Убрать вход через Google? Операторы, которые входят только через Google, не смогут войти этим способом."
        ENABLE_MESSENGER_CHANNEL_HUMAN_AGENT:
          effect: "Включено — оператор может ответить клиенту в Messenger в течение 7 дней вместо 24 часов. Нужно отдельное одобрение приложения в Meta. Подключено страниц: %{count}."
          confirm_on: "Включить тег «человек-оператор» для всех страниц Messenger (подключено: %{count})? Если приложение не одобрено в Meta, ответы позже 24 часов не дойдут."
          confirm_off: "Выключить тег «человек-оператор»? Ответить клиенту в Messenger можно будет только в течение 24 часов после его сообщения (подключено страниц: %{count})."
        ENABLE_INSTAGRAM_CHANNEL_HUMAN_AGENT:
          effect: "Включено — оператор может ответить клиенту в Instagram в течение 7 дней вместо 24 часов. Нужно отдельное одобрение приложения в Meta. Подключено каналов: %{count}."
          confirm_on: "Включить тег «человек-оператор» для всех каналов Instagram (подключено: %{count})? Если приложение не одобрено в Meta, ответы позже 24 часов не дойдут."
          confirm_off: "Выключить тег «человек-оператор»? Ответить клиенту в Instagram можно будет только в течение 24 часов после его сообщения (подключено каналов: %{count})."
        WHATSAPP_REQUIRE_NON_EXPIRING_SYSTEM_USER_TOKEN:
          effect: "Включено — новые и переподключаемые каналы WhatsApp принимают только токены без срока действия. Канал с обычным токеном подключить не получится. Подключено каналов: %{count}."
          confirm_on: "Требовать токены без срока действия у новых и переподключаемых каналов WhatsApp (сейчас подключено: %{count})? Канал с обычным токеном подключить не получится."
          confirm_off: "Перестать требовать токены без срока действия? Новые каналы WhatsApp можно будет подключать с обычным токеном, который со временем истекает."
        WHATSAPP_PROACTIVE_REAUTHORIZATION_ENABLED:
          effect: "Включено — у каналов WhatsApp, чей токен скоро истечёт, оператор заранее видит кнопку переподключения. Включайте, когда обновлены все серверы платформы. Подключено каналов: %{count}."
          confirm_on: "Показывать операторам кнопку переподключения WhatsApp заранее (подключено каналов: %{count})? Включайте, только если обновлены все серверы платформы."
          confirm_off: "Не показывать кнопку переподключения WhatsApp заранее? Токен придётся обновлять уже после того, как он истёк."

      fields:
        HCAPTCHA_SITE_KEY:
          title: "Защита от ботов: ключ сайта (hCaptcha)"
          hint: "Публичный ключ с сайта hCaptcha. Он рисует проверку в форме регистрации. Нужен вместе с секретным ключом."
        HCAPTCHA_SERVER_KEY:
          title: "Защита от ботов: секретный ключ (hCaptcha)"
          hint: "Секретный ключ с сайта hCaptcha: по нему платформа проверяет ответ. Значение не показывается: оставьте поле пустым, чтобы не менять."
