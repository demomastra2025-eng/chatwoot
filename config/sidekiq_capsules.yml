# Sidekiq 7 Multi-Capsule Configuration ("Plan A + Turbo" for 200+ Clinics)
# Covers 100% of all 36 queues across OneLink while isolating workloads by SLA.
---
:verbose: false
:concurrency: <%= ENV.fetch("SIDEKIQ_CONCURRENCY", 5) %>
:timeout: 25
:max_retries: 3

:capsules:
  # 1. Realtime UI, ActionCable, Outbound Replies & Auto-Assignment (<100ms SLA)
  realtime:
    :concurrency: <%= ENV.fetch("CAPSULE_REALTIME_CONCURRENCY", 12) %>
    :queues:
      - [action_cable_realtime, 8]
      - [communication_thread_realtime, 6]
      - [critical, 4]
      - [outbound_messages, 4]
      - [high, 3]
      - [auto_assignment, 3]

  # 2. Inbound Messenger Webhooks (WhatsApp Cloud/Coexistence, WhatsApp Web, Telegram, Personal)
  inbound_channels:
    :concurrency: <%= ENV.fetch("CAPSULE_INBOUND_CHANNELS_CONCURRENCY", 8) %>
    :queues:
      - [whatsapp_inbound, 4]
      - [telegram_inbound, 2]
      - [telegram_personal_inbound, 2]
      - [whatsapp_webhook_forward, 2]
      - [whatsappweb_inbound, 1]
      - [whatsappweb_echo, 1]

  # 3. AI Captain (OpenRouter LLM) & Audio/Voice Transcription
  ai_captain:
    :concurrency: <%= ENV.fetch("CAPSULE_AI_CAPTAIN_CONCURRENCY", 6) %>
    :queues:
      - [captain_runtime, 4]
      - [audio_transcription, 2]
      - [voice_recording_transcription, 2]

  # 4. Live Telephony & Calls
  voice_telephony:
    :concurrency: <%= ENV.fetch("CAPSULE_VOICE_TELEPHONY_CONCURRENCY", 4) %>
    :queues:
      - [telephony_realtime, 4]
      - [whatsapp_calls, 1]

  # 5. MedElement CRM Sync (Fast commands weighted 5x above background full sync)
  medelement:
    :concurrency: <%= ENV.fetch("CAPSULE_MEDELEMENT_CONCURRENCY", 5) %>
    :queues:
      - [medelement_provider_commands, 5]
      - [medelement_sync, 1]

  # 6. Core Default (incl. ReceptionsDeltaJob), Webhooks, Cron & Mailers
  core_scheduled:
    :concurrency: <%= ENV.fetch("CAPSULE_CORE_SCHEDULED_CONCURRENCY", 8) %>
    :queues:
      - [default, 4]
      - [reminders, 3]
      - [medium, 3]
      - [scheduled_jobs, 2]
      - [mailers, 2]
      - [action_mailbox_routing, 1]

  # 7. History Imports, Bulk Operations, Audio Compression & Housekeeping
  history_maintenance:
    :concurrency: <%= ENV.fetch("CAPSULE_HISTORY_MAINTENANCE_CONCURRENCY", 4) %>
    :queues:
      - [whatsapp_coexistence_history_recovery, 3]
      - [whatsapp_coexistence_history, 2]
      - [whatsappweb_history_recovery, 2]
      - [whatsappweb_history, 1]
      - [telegram_personal_history, 1]
      - [linkedin_personal_history, 1]
      - [low, 2]
      - [deferred, 1]
      - [purgable, 1]
      - [housekeeping, 1]
      - [async_database_migration, 1]
      - [bulk_reindex_low, 1]
      - [active_storage_analysis, 1]
      - [active_storage_purge, 1]
      - [action_mailbox_incineration, 1]
