# Account plans: BASE + MODULES. There are no tariffs and no prices here (or anywhere in the code).
#
# Every clinic gets the base. Modules are switched on per clinic on top of it.
# Accounts::Plans loads this file, validates it and freezes it; Accounts::ApplyPlan writes it into an account.
#
# Every flag of config/features.yml sits in exactly ONE of these places:
#   base          the flags of the base plan
#   modules.*     the flags of one module
#   locked_on     operational flags that must always stay on (hidden from manual tuning)
#   never_enabled flags a plan switches OFF (and the platform never offers): dangerous, removed or deprecated.
#                 May name flags that are absent from features.yml (another branch deletes scheduling_finance).
#   internal      flags a plan never touches: whatever the account has is kept as it is
#
# Limits: a number sets the limit, `unlimited` stores the number the code treats as "no limit" (Accounts::Plans.unlimited_value:
# ChatwootApp.max_limit, and a number nobody reaches for the storage and the AI tokens), null leaves the clinic's own value
# untouched. A key that is not listed is invalid; base lists every key.
# These numbers go to the limits of an account that FOLLOWS the plan («Как в тарифе» in the super admin). A limit a super admin chose
# for one account (a number of its own or «Без ограничений», Accounts::LimitSettings) is not touched when the plan is applied: change a
# number here, press «Применить тариф» (one account or many), and only the accounts that follow the plan get the new number.
# A number counts as «как в тарифе» while it is the number of the plan or the number the plan wrote last (kept in the account, see
# Accounts::LimitSettings); any other number is the account's own and stays. An account whose plan was applied before that number was
# kept holds what the plans of that time wrote: 100 000 for conversations and non_web_inboxes (the only limits they set, see
# Accounts::LimitSettings::LEGACY_PLAN_NUMBERS). So these two limits of such an account follow the plan when you change their numbers
# here, even before the plan is applied to the account again; any other number there is the account's own. A limit with `null` here has
# no number to follow: what the account holds there is its own.
# Version history: 1 = first base + modules, 2 = agent_bots left the base (the Agent Bots were removed from the product).
# An account keeps the version it was applied with; applying the plan again moves it to the current one.
version: 2

base:
  features:
    # Chats
    - channel_website
    - channel_email
    - inbound_emails
    - channel_facebook
    - channel_instagram
    - channel_tiktok # shown to clinics only when the platform channel switch allows it; the flag itself is base
    - auto_resolve_conversations
    - macros
    - canned_responses
    - automations
    - integrations
    - reports
    # CRM and booking
    - crm
    - companies
    - crm_deals
    - crm_tasks
    - scheduling
    # Telephony is part of the base
    - channel_voice
    - whatsapp_call
    - voice_recorder
  limits:
    # Owner sets the numbers later: null = the clinic keeps its own value.
    agents: null
    storage_bytes: null
    # Not limited by the plan. Without an explicit value the global installation defaults apply, and those are a
    # trap for a new clinic (500 conversations per 30 days, 0 channels besides the website widget).
    conversations: unlimited
    non_web_inboxes: unlimited
    # Not decided or governed elsewhere: no limit unless a clinic has its own value.
    inboxes: null
    emails: null # daily mail limit, governed by ACCOUNT_EMAILS_LIMIT
    captain_responses: null # AI quotas, governed by the Captain plan quota settings
    captain_documents: null
    captain_tokens: null

modules:
  ai_agents:
    features:
      - captain_integration
      - captain_integration_v2
      - captain_tasks
    limits: {}
  broadcasts:
    features:
      - campaigns
      - whatsapp_campaign
    limits: {}
  quality:
    features:
      - sla
      - audit_logs
      - csat_review_notes
    limits: {}
  extensions:
    features:
      - custom_tools
      - crm_integration
      - conversation_required_attributes
      - disable_branding
    limits: {}

# Operational flags: always on, never offered for manual tuning.
locked_on:
  - agent_management
  - team_management
  - inbox_management
  - labels
  - custom_attributes

# Switched off by every plan.
never_enabled:
  - scheduling_finance # being removed by another branch
  - custom_roles
  - saml
  - captain_scheduling_grounding_guard
  - contact_chatwoot_support_team # the Chatwoot support widget
  # Deprecated Chatwoot flags (config/features.yml `deprecated: true`)
  - channel_twitter
  - response_bot
  - message_reply_to
  - insert_article_in_reply
  - report_v4
  - whatsapp_embedded_signup
  - twilio_content_templates
  # Agent Bots and Help Center were removed from the product (the flags keep their bits in Featurable::LEGACY_BITMASK_FEATURE_NAMES)
  - agent_bots
  - help_center
  - help_center_embedding_search

# Plans never touch these: infrastructure switches, owner decisions that are still open, flags without a product meaning.
internal:
  - ip_lookup # needs the geo database
  - email_continuity_on_api_channel # dead flag, API channel is hidden by default
  - report_rollup # read path switched by a rake task after a parity check
  - custom_reply_email # dead flag
  - custom_reply_domain # dead flag
  - inbox_view
  - linear_integration
  - notion_integration
  - shopify_integration
  - chatwoot_v4 # dead flag
  - search_with_gin
  - crm_v2
  - assignment_v2 # switches the auto-assignment engine: an owner decision, not a plan option
  - advanced_assignment
  - advanced_search
  - advanced_search_indexing
  - reply_mailer_migration
  - quoted_email_reply # dead flag
  - communication_threads # one chat per patient: an owner decision, not a plan option
  - deferred_touch_materialization
  - captain_openrouter_byok

# New accounts get a short trial of the base plus these modules.
trial:
  days: 3
  modules:
    - ai_agents
