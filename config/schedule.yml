# https://github.com/ondrejbartas/sidekiq-cron
# use https://crontab.guru/ to validate
# validations for this file exist in /spec/configs/schedule_spec.rb

# executed daily at 0000 UTC
# schedules daily deferred jobs at stable times for each installation
internal_check_new_versions_job:
  cron: '0 0 * * *'
  class: 'Internal::TriggerDailyScheduledItemsJob'
  queue: scheduled_jobs
# executed every minute for delayed items like touches/reminders
trigger_scheduled_items_job:
  cron: '*/1 * * * *'
  class: 'TriggerScheduledItemsJob'
  queue: scheduled_jobs

# executed every minute to keep Weixin Personal gateway pollers synced after gateway restarts
weixin_sync_channels_job:
  cron: '*/1 * * * *'
  class: 'Weixin::SyncChannelsJob'
  queue: scheduled_jobs

# executed At every minute..
trigger_imap_email_inboxes_job:
  cron: '*/1 * * * *'
  class: 'Inboxes::FetchImapEmailInboxesJob'
  queue: scheduled_jobs

# cleanup stale whatsapp calls and reconcile stuck ringing/in-progress calls
whatsapp_call_cleanup_job:
  cron: '*/5 * * * *'
  class: 'Whatsapp::CallCleanupJob'
  queue: whatsapp_calls

# reconcile active native telephony sessions
telephony_call_reconciliation_job:
  cron: '*/5 * * * *'
  class: 'Telephony::ReconcileCallSessionsJob'
  queue: low

# executed daily at 2230 UTC
# which is our lowest traffic time
remove_stale_contact_inboxes_job.rb:
  cron: '30 22 * * *'
  class: 'Internal::RemoveStaleContactInboxesJob'
  queue: scheduled_jobs

# executed daily at 2230 UTC
# which is our lowest traffic time
remove_stale_redis_keys_job.rb:
  cron: '30 22 * * *'
  class: 'Internal::RemoveStaleRedisKeysJob'
  queue: scheduled_jobs

# DISABLED: investigating if this job is the source of orphan conversations
# #executed daily at 0430 UTC
# # which will be IST 10:00 AM
# process_stale_contacts_job:
#   cron: '30 04 * * *'
#   class: 'Internal::ProcessStaleContactsJob'
#   queue: housekeeping

# executed daily at 0100 UTC
# to delete accounts marked for deletion
delete_accounts_job:
  cron: '0 1 * * *'
  class: 'Internal::DeleteAccountsJob'
  queue: scheduled_jobs

# executed every 15 minutes
# evaluates account-scoped Captain observability alerts and dispatches notifications
deliver_captain_observability_alerts_job:
  cron: '*/15 * * * *'
  class: 'Internal::DeliverCaptainObservabilityAlertsJob'
  queue: scheduled_jobs

# executed every 10 minutes
# progressively backfills llm_event.trace_id from persisted payloads without a heavy deploy-time table rewrite
backfill_llm_event_trace_id_job:
  cron: '*/10 * * * *'
  class: 'Internal::BackfillLlmEventTraceIdJob'
  queue: scheduled_jobs

# executed hourly
# keeps cached OpenRouter key/credits health fresh for diagnostics and catalog refresh gating
refresh_openrouter_key_health_job:
  cron: '7 * * * *'
  class: 'Internal::RefreshOpenRouterKeyHealthJob'
  queue: scheduled_jobs

# executed every 6 hours
# keeps the shared OpenRouter model catalog warm without blocking account settings pages
refresh_openrouter_model_catalog_job:
  cron: '17 */6 * * *'
  class: 'Internal::RefreshOpenRouterModelCatalogJob'
  queue: scheduled_jobs

# executed every 6 hours
# verifies WhatsApp Cloud API token validity, WABA access, and phone-number access
whatsapp_token_health_check_job:
  cron: '23 */6 * * *'
  class: 'Whatsapp::TokenHealthCheckJob'
  queue: scheduled_jobs

# executed every 30 minutes for assignment_v2
periodic_assignment_job:
  cron: '*/30 * * * *'
  class: 'AutoAssignment::PeriodicAssignmentJob'
  queue: scheduled_jobs

# executed daily at 2230 UTC
# removes old notifications (>1 month) and trims to 300 per user
remove_old_notification_job:
  cron: '30 22 * * *'
  class: 'Notification::RemoveOldNotificationJob'
  queue: purgable

# executed daily at 2245 UTC
# enforces account-scoped llm_event retention windows and removes stale annotations
enforce_llm_event_retention_job:
  cron: '45 22 * * *'
  class: 'Internal::EnforceLlmEventRetentionJob'
  queue: scheduled_jobs

# executed every 12 hours
# to remove orphan conversations without contact
remove_orphan_conversations_job:
  cron: '0 */12 * * *'
  class: 'Internal::RemoveOrphanConversationsJob'
  queue: housekeeping
