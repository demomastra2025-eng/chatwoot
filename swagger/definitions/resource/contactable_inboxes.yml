type: object
properties:
  source_id:
    type: string
    description: Contact Inbox Source Id
  contact_inbox_id:
    type: integer
    nullable: true
    description: Existing contact inbox identity to reuse when creating a conversation
  inbox:
    type: object
    $ref: '#/components/schemas/inbox'
  active_conversation_id:
    type: integer
    nullable: true
    description: Display ID of the latest unresolved conversation for this contact inbox
  reply_window_open:
    type: boolean
    description: Whether free-text WhatsApp messages are currently allowed
  reply_window_closes_at:
    type: string
    format: date-time
    nullable: true
    description: WhatsApp reply-window deadline
  allowed_content_kinds:
    type: array
    items:
      type: string
      enum:
        - free_text
        - channel_template
    description: Outbound content kinds allowed for this contact inbox
