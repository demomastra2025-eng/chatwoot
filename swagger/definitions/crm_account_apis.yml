crm_error:
  type: object
  required: [error, code]
  properties:
    error: { type: string }
    code: { type: string }
    details: { type: object, additionalProperties: true }

crm_field_requirement:
  type: object
  properties:
    id: { type: integer, readOnly: true }
    field_key: { type: string }
    required: { type: boolean }
    validation: { type: object, additionalProperties: true }
    role_exemptions: { type: array, items: { type: string } }

crm_stage:
  type: object
  properties:
    id: { type: integer }
    account_id: { type: integer }
    pipeline_id: { type: integer }
    name: { type: string }
    code: { type: string }
    color: { type: string }
    position: { type: integer }
    outcome: { type: string, enum: [open, won, lost] }
    system: { type: boolean }
    position_locked: { type: boolean }
    closing_reason_options: { type: array, items: { type: string }, description: Configured loss reasons; always empty on open and won stages. }
    closing_reason_required: { type: boolean, description: Whether loss reasons are required; always false on open and won stages. }
    transition_reason_options: { type: array, maxItems: 0, items: { type: string }, deprecated: true, readOnly: true, description: Compatibility field; always empty. Ordinary transition reasons are removed. }
    transition_reason_required: { type: boolean, enum: [false], deprecated: true, readOnly: true, description: Compatibility field; ordinary stage moves never require a reason. }
    active: { type: boolean }
    default: { type: boolean }
    field_requirements: { type: array, items: { $ref: '#/components/schemas/crm_field_requirement' } }
    deal_count: { type: integer }
    dialog_deal_count: { type: integer }
    created_at: { type: string, format: date-time }
    updated_at: { type: string, format: date-time }

crm_pipeline:
  type: object
  properties:
    id: { type: integer }
    account_id: { type: integer }
    name: { type: string }
    code: { type: string }
    position: { type: integer }
    active: { type: boolean }
    default: { type: boolean }
    auto_create_deal_on_channel_contact: { type: boolean, description: Incoming-channel deal creation; independent of appointment_automation.auto_create_deals. }
    appointment_automation: { $ref: '#/components/schemas/crm_appointment_automation' }
    restrict_stage_skipping: { type: boolean }
    restrict_backward_move: { type: boolean }
    allow_stage_rule_override: { type: boolean }
    deal_count: { type: integer }
    dialog_deal_count: { type: integer }
    stages: { type: array, items: { $ref: '#/components/schemas/crm_stage' } }
    created_at: { type: string, format: date-time }
    updated_at: { type: string, format: date-time }

crm_task_status:
  type: object
  properties:
    id: { type: integer }
    account_id: { type: integer }
    name: { type: string }
    code: { type: string }
    color: { type: string }
    position: { type: integer }
    category: { type: string, enum: [open, in_progress, completed, cancelled] }
    active: { type: boolean }
    default: { type: boolean }
    created_at: { type: string, format: date-time }
    updated_at: { type: string, format: date-time }

crm_task_outcome:
  type: object
  properties:
    id: { type: integer }
    account_id: { type: integer }
    task_type_id: { type: integer }
    name: { type: string }
    code: { type: string }
    position: { type: integer }
    active: { type: boolean }
    default: { type: boolean }
    requires_note: { type: boolean }
    created_at: { type: string, format: date-time }
    updated_at: { type: string, format: date-time }

crm_task_type:
  type: object
  properties:
    id: { type: integer }
    account_id: { type: integer }
    name: { type: string }
    code: { type: string }
    icon: { type: string }
    position: { type: integer }
    active: { type: boolean }
    default: { type: boolean }
    outcomes: { type: array, items: { $ref: '#/components/schemas/crm_task_outcome' } }
    created_at: { type: string, format: date-time }
    updated_at: { type: string, format: date-time }

crm_deal:
  type: object
  properties:
    id: { type: integer }
    account_id: { type: integer }
    pipeline_id: { type: integer }
    stage_id: { type: integer }
    owner_id: { type: integer, nullable: true }
    creator_id: { type: integer, nullable: true }
    team_id: { type: integer, nullable: true }
    company_id: { type: integer, nullable: true }
    originating_conversation_id: { type: integer, nullable: true }
    originating_conversation_display_id: { type: integer, nullable: true }
    originating_communication_thread_id: { type: integer, nullable: true }
    originating_communication_thread_display_id: { type: integer, nullable: true }
    dialog_id: { type: integer, nullable: true }
    dialog_display_id: { type: integer, nullable: true }
    dialog_kind: { type: string, nullable: true }
    dialog_status: { type: string, nullable: true }
    title: { type: string }
    description: { type: string, nullable: true }
    amount: { type: number, nullable: true }
    amount_minor: { type: integer, nullable: true }
    currency: { type: string, nullable: true }
    expected_close_on: { type: string, format: date, nullable: true }
    closed_at: { type: string, format: date-time, nullable: true }
    waiting_until: { type: string, format: date-time, nullable: true }
    waiting_reason: { type: string, nullable: true }
    waiting_started_at: { type: string, format: date-time, nullable: true }
    waiting_set_by_id: { type: integer, nullable: true }
    next_action: { type: object, nullable: true, additionalProperties: true }
    closing_reasons: { type: array, items: { type: string }, description: Loss reasons on the current lost stage; empty for open and won deals. }
    position: { type: integer }
    win_probability: { type: number, nullable: true }
    external_ref: { type: string, nullable: true }
    idempotency_key: { type: string, nullable: true }
    lock_version: { type: integer }
    appointment_plan: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/crm_appointment_plan_item' } }
    selected_appointment_id: { type: integer, nullable: true }
    appointment_automation_state: { type: object, additionalProperties: true, description: Public automation state; signed delivery policies are excluded. }
    custom_attributes: { type: object, additionalProperties: true }
    archived_at: { type: string, format: date-time, nullable: true }
    company: { type: object, nullable: true, additionalProperties: true }
    deal_contacts: { type: array, items: { type: object, properties: { contact_id: { type: integer }, primary: { type: boolean } } } }
    primary_contact: { type: object, nullable: true, additionalProperties: true }
    primary_contact_id: { type: integer, nullable: true }
    created_at: { type: string, format: date-time }
    updated_at: { type: string, format: date-time }

crm_task:
  type: object
  properties:
    id: { type: integer }
    account_id: { type: integer }
    context_kind: { type: string }
    deal_id: { type: integer, nullable: true }
    status_id: { type: integer }
    task_type_id: { type: integer, nullable: true }
    task_outcome_id: { type: integer, nullable: true }
    assignee_id: { type: integer, nullable: true }
    creator_id: { type: integer, nullable: true }
    completed_by_id: { type: integer, nullable: true }
    cancelled_by_id: { type: integer, nullable: true }
    team_id: { type: integer, nullable: true }
    originating_conversation_id: { type: integer, nullable: true }
    title: { type: string }
    description: { type: string, nullable: true }
    activity_type: { type: string, nullable: true, description: 'Compatibility projection for legacy tasks without a catalog task type.' }
    outcome: { type: string, nullable: true }
    outcome_note: { type: string, nullable: true }
    priority: { type: string, nullable: true }
    all_day: { type: boolean }
    start_at: { type: string, format: date-time, nullable: true }
    due_at: { type: string, format: date-time, nullable: true }
    due_on: { type: string, format: date, nullable: true }
    schedule_timezone: { type: string, nullable: true }
    completed_at: { type: string, format: date-time, nullable: true }
    cancelled_at: { type: string, format: date-time, nullable: true }
    cancellation_reason: { type: string, nullable: true }
    reschedule_count: { type: integer }
    task_type: { type: object, nullable: true, additionalProperties: true }
    task_outcome: { type: object, nullable: true, additionalProperties: true }
    position: { type: integer }
    external_ref: { type: string, nullable: true }
    idempotency_key: { type: string, nullable: true }
    lock_version: { type: integer }
    custom_attributes: { type: object, additionalProperties: true }
    archived_at: { type: string, format: date-time, nullable: true }
    created_at: { type: string, format: date-time }
    updated_at: { type: string, format: date-time }

crm_task_lifecycle_snapshot:
  type: object
  description: State captured before or after a CRM task lifecycle command in its timeline event.
  properties:
    status_id: { type: integer }
    position: { type: integer }
    task_type_id: { type: integer, nullable: true }
    task_outcome_id: { type: integer, nullable: true }
    outcome: { type: string, nullable: true }
    outcome_note: { type: string, nullable: true }
    assignee_id: { type: integer, nullable: true }
    team_id: { type: integer, nullable: true }
    start_at: { type: string, format: date-time, nullable: true }
    due_at: { type: string, format: date-time, nullable: true }
    due_on: { type: string, format: date, nullable: true }
    all_day: { type: boolean }
    schedule_timezone: { type: string }
    completed_at: { type: string, format: date-time, nullable: true }
    completed_by_id: { type: integer, nullable: true }
    cancelled_at: { type: string, format: date-time, nullable: true }
    cancelled_by_id: { type: integer, nullable: true }
    cancellation_reason: { type: string, nullable: true }
    reschedule_count: { type: integer }
  additionalProperties: true

crm_task_timeline_event:
  type: object
  description: CRM event attached to the task timeline. Lifecycle command events carry state snapshots in before_data and after_data.
  properties:
    id: { type: integer }
    account_id: { type: integer }
    eventable_type: { type: string }
    eventable_id: { type: integer }
    actor_id: { type: integer, nullable: true }
    actor_kind: { type: string }
    event_type: { type: string }
    source: { type: string, nullable: true }
    before_data: { allOf: [{ $ref: '#/components/schemas/crm_task_lifecycle_snapshot' }], nullable: true }
    after_data: { allOf: [{ $ref: '#/components/schemas/crm_task_lifecycle_snapshot' }], nullable: true }
    correlation_id: { type: string, nullable: true }
    causation_id: { type: string, nullable: true }
    schema_version: { type: integer }
    meta: { type: object, additionalProperties: true }
    created_at: { type: string, format: date-time }
  additionalProperties: true

crm_task_timeline_entry:
  type: object
  properties:
    item_type: { type: string, enum: [event, comment, conversation] }
    occurred_at: { type: string, format: date-time }
    payload:
      $ref: '#/components/schemas/crm_task_timeline_event'
      description: Event entries use this shape; comment and conversation entries carry their respective payload.

crm_task_timeline_response:
  type: object
  properties:
    payload:
      type: array
      items: { $ref: '#/components/schemas/crm_task_timeline_entry' }
    meta:
      type: object
      properties:
        count: { type: integer }
        next_cursor: { type: string, format: date-time, nullable: true }

crm_report_meta:
  type: object
  properties:
    count: { type: integer }
    page: { type: integer }
    per_page: { type: integer }
    total_count: { type: integer }
    has_more: { type: boolean }
    metric_kind: { type: string }
    reliability: { type: string }
    timezone: { type: string }
    generated_at: { type: string, format: date-time }
    generated_at_local: { type: string, format: date-time }
    query_fingerprint: { type: string }
    metric_definition: { type: string }
    temporal_definition: { type: string }

crm_report_rows_response:
  type: object
  properties:
    payload:
      type: object
      properties:
        rows: { type: array, items: { type: object, additionalProperties: true } }
    meta: { $ref: '#/components/schemas/crm_report_meta' }

crm_storage_summary:
  type: object
  properties:
    total_limit_bytes: { type: integer }
    consumed_bytes: { type: integer }
    available_bytes: { type: integer }
    unlimited: { type: boolean }
    usage_percent: { type: number }
    breakdown: { type: object, additionalProperties: true }
    last_updated_at: { type: string, format: date-time, nullable: true }

crm_storage_file:
  type: object
  properties:
    id: { type: string }
    name: { type: string }
    file_type: { type: string }
    byte_size: { type: integer }
    human_size: { type: string }
    created_at: { type: string, format: date-time }
    inbox_id: { type: integer, nullable: true }
    inbox_name: { type: string }
    conversation_id: { type: integer, nullable: true }
    download_url: { type: string, nullable: true }

crm_storage_trash_item:
  type: object
  properties:
    id: { type: string }
    item_type: { type: string, enum: [recording, attachment] }
    file_name: { type: string }
    file_type: { type: string }
    byte_size: { type: integer }
    created_at: { type: string, format: date-time }
    inbox_id: { type: integer, nullable: true }
    inbox_name: { type: string }
    trashed_at: { type: string, format: date-time }
    expires_at: { type: string, format: date-time }

captain_assistant:
  type: object
  description: An independent agent in the requested account. Instructions live in description. Separate response_guidelines and guardrails are not returned; config.rules, config.skills and prompt-migration internals are excluded from config.
  properties:
    id: { type: integer }
    account_id: { type: integer }
    name: { type: string }
    description: { type: string, nullable: true, description: This agent's own main prompt. }
    usage_mode: { type: string, enum: [external_agent, internal_assistant] }
    active: { type: boolean, description: Only active external agents can be channel main agents or work in a channel with other agents. }
    routing_description: { type: string, nullable: true, maxLength: 2000, description: Describes when another agent should route a request to this agent. }

    legacy_scenario_id: { type: integer, nullable: true, readOnly: true, description: Original scenario ID for an agent converted from a legacy scenario. }
    migration_warnings:
      type: array
      readOnly: true
      items: { $ref: '#/components/schemas/captain_agent_migration_warning' }
      description: Review notices recorded during legacy scenario conversion; empty for agents without notices.
    avatar_url: { type: string, nullable: true }
    config:
      type: object
      description: 'Assistant configuration is updated through the existing assistant endpoint. Model, tool access, follow-up settings, and outcome reason settings are account-scoped per assistant. Safety checks are one workspace setting (captain/settings, section safety); safety_settings is read-only legacy data that the runtime ignores.'
      properties:
        model: { type: string }
        safety_settings: { allOf: [{ $ref: '#/components/schemas/captain_assistant_safety_settings' }], readOnly: true }
        tool_access: { type: object, additionalProperties: true }
        follow_up_settings: { type: object, additionalProperties: true }
        outcome_reason_settings: { $ref: '#/components/schemas/captain_outcome_reason_settings' }
        context_access: { type: object, additionalProperties: true }
        voice_settings: { type: object, additionalProperties: true }
      additionalProperties: true
    outcome_reason_options:
      allOf: [{ $ref: '#/components/schemas/captain_outcome_reason_settings' }]
      readOnly: true
      description: Normalized reason options including built-in IDs and active flags, returned for every assistant. Configure custom options through config.outcome_reason_settings.
    type: { type: string, enum: [captain_assistant] }
    created_at: { type: integer, format: int64, description: Unix timestamp in seconds }
    updated_at: { type: integer, format: int64, description: Unix timestamp in seconds }

captain_agent_migration_warning:
  type: object
  required: [code, message]
  properties:
    code: { type: string }
    message: { type: string }
    reference_ids: { type: array, items: { type: string }, description: Parent-prompt tool, field or skill references that were not copied. }
  additionalProperties: false

captain_assistants_response:
  type: object
  required: [payload, meta]
  properties:
    payload:
      type: array
      items: { $ref: '#/components/schemas/captain_assistant' }
    meta:
      type: object
      properties:
        total_count: { type: integer }
        page: { type: integer, description: Pagination structure is reserved; current response reports page 1. }

captain_assistant_safety_settings:
  type: object
  description: Legacy per-agent safety data, kept as it was stored and ignored by the runtime. Safety checks are one workspace setting (captain/settings, section safety).
  properties:
    moderation_enabled: { type: [boolean, 'null'], description: Enable or disable provider moderation for this assistant; null inherits the workspace value. }
    prompt_injection_action: { type: [string, 'null'], enum: [disabled, flag, block, null], description: Runtime prompt-injection guardrail action; null inherits the workspace value. }
    sensitive_info_action: { type: [string, 'null'], enum: [disabled, flag, block, null], description: Runtime sensitive-information guardrail action; null inherits the workspace value. }
    custom_rules:
      type: array
      maxItems: 20
      description: Legacy per-agent rule list, kept as it was stored, neither validated nor evaluated. Custom rules are a workspace setting (captain/settings, section safety).
      items: { $ref: '#/components/schemas/captain_custom_safety_rule' }
  additionalProperties: false

captain_custom_safety_rule:
  type: object
  required: [id, name, direction, instruction, action, enabled]
  properties:
    id:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'
      not: { enum: [none] }
      description: Stable unique identifier. The exact identifier none is reserved and rejected. Preserve this ID when editing or reordering a rule.
    name: { type: string, minLength: 1, maxLength: 120, description: Nonblank display name; it is not sent to the classifier. }
    direction: { type: string, enum: [input, output] }
    instruction: { type: string, minLength: 1, maxLength: 2000, description: Nonblank condition describing when the rule matches. Rules are evaluated in saved array order. }
    action:
      type: string
      enum: [handoff, block, rewrite]
      description: Server-owned action associated with this ID. Rewrite is valid only for output rules. Block is accepted for compatibility; input handoff and block stop automation and transfer to staff.
    enabled: { type: boolean, description: A literal boolean is required; strings and numeric values are rejected. }
    message:
      type: string
      maxLength: 2000
      description: Optional preapproved public message after a match. Omitted or empty uses the configured handoff message. Null is rejected. This field is not sent to the classifier.
  oneOf:
    - properties:
        direction: { type: string, enum: [input] }
        action: { type: string, enum: [handoff, block] }
    - properties:
        direction: { type: string, enum: [output] }
        action: { type: string, enum: [handoff, block, rewrite] }
  additionalProperties: false

captain_assistant_playground_request:
  type: object
  required: [assistant]
  properties:
    assistant: { $ref: '#/components/schemas/captain_assistant_playground_parameters' }

captain_assistant_playground_parameters:
  type: object
  properties:
    message_content: { type: string, maxLength: 12000, description: Required for the default message action. }
    playground_mode: { type: string, enum: [workspace, trial], default: workspace, description: Workspace uses a synthetic caller and server-owned history. The trial compatibility value also opens a workspace session; legacy live mode is rejected. }
    playground_action: { type: string, enum: [message, session, reset, permissions, confirm], default: message }
    playground_session_id: { type: string, description: Server-owned session identifier scoped to this account, user and entry assistant. Required for permissions; use the same session for confirming a preview. }
    scenario: { type: object, additionalProperties: true, description: Synthetic business data. Changing the scenario revokes pending real-action previews. }
    real_data_read: { type: boolean, default: false, description: Applied by the permissions action. Enables selected tools to read real account data under the current operator's permissions. }
    real_data_write: { type: boolean, default: false, description: Applied by the permissions action; requires real_data_read. Each real change still needs an explicit preview confirmation. }
    approval_id: { type: string, description: ID of a pending action preview required by the confirm action. }
    approval_digest: { type: string, description: Digest of the unchanged action preview required by the confirm action. }
    external_delivery_enabled: { type: boolean, enum: [false], default: false, description: External delivery is unavailable; true is rejected. }
    message_history:
      type: array
      description: External-agent sessions use server-owned history and ignore client history. Reserved for the enabled internal assistant playground.
      items:
        type: object
        required: [role, content]
        properties:
          role: { type: string }
          content: { type: string }
          agent_name: { type: string }
    conversation_id: { type: string, description: External-agent Playground rejects real conversations. Used only by the enabled internal assistant playground with the operator's conversation access. }
    test_model: { type: string, description: Per-request selectable model override. It is validated against the assistant model registry and is not saved to the assistant. }
    test_temperature: { type: number, minimum: 0, maximum: 1, description: Per-request temperature override; accepted only when the selected model supports temperature. }
    test_thinking_effort: { type: string, description: Per-request reasoning effort override; validated against the selected model's supported capabilities. }

captain_assistant_playground_response:
  type: object
  properties:
    response: { type: string, nullable: true, description: Present for a message action. Session, reset and permissions return session state; confirm returns the action result. }
    playground: { $ref: '#/components/schemas/captain_playground_session' }
    delivery:
      type: object
      description: Present for an external-agent message action; replies stay in the Playground transcript.
      properties:
        enabled: { type: boolean, enum: [false] }
        status: { type: string, enum: [playground_only] }
        delivered: { type: boolean, enum: [false] }
    agent_name: { type: [string, 'null'], description: Runtime agent key. }
    agent_id: { type: [integer, 'null'], description: Account-scoped ID of the acting agent after any handoff. }
    agent_display_name: { type: [string, 'null'], description: Display name of the acting agent. }
    agent_tasks:
      type: array
      maxItems: 30
      items: { $ref: '#/components/schemas/captain_agent_task' }
      description: Results and remaining work for a multi-request task queue. Empty when no queue was created; these are runtime tasks rather than CRM task records.
    reasoning: { type: [string, 'null'] }
    response_latency_ms: { type: integer, minimum: 0, description: Measured end-to-end response latency in milliseconds. }
    reported_reasoning_tokens: { type: integer, minimum: 1, description: Provider-reported reasoning tokens, included only when the provider supplies this usage metric. }
    action_id: { type: string, description: Confirmed preview ID; present for a confirm action. }
    result: { description: Tool result returned by a confirm action; its representation follows the selected tool. }
    success: { type: boolean, description: Whether the confirmed action completed successfully. }
    delivered: { type: boolean, enum: [false], description: A confirm action does not deliver a customer message. }
    timed_out: { type: boolean, description: Present with response=null when the request times out. }
  additionalProperties: true

captain_agent_task:
  type: object
  properties:
    id: { type: string }
    title: { type: string, minLength: 1, maxLength: 500 }
    assistant_id: { type: integer, description: Assigned agent in the entry agent's reachable account-scoped graph. }
    status: { type: string, enum: [awaiting, active, waiting, completed, failed, cancelled] }
    result: { type: [string, 'null'], maxLength: 1500, description: Concise outcome or reason the request remains waiting. }
  additionalProperties: false

captain_playground_session:
  type: object
  properties:
    session_id: { type: string }
    mode: { type: string, enum: [workspace] }
    scenario: { type: object, additionalProperties: true }
    message_history: { type: array, items: { type: object, additionalProperties: true } }
    real_data_read: { type: boolean }
    real_data_write: { type: boolean }
    delivery_enabled: { type: boolean, enum: [false] }
    action_previews:
      type: array
      items: { $ref: '#/components/schemas/captain_playground_action_preview' }
      description: Pending unexpired previews for the current permissions and acting agent; changing either invalidates confirmation.
    expires_in: { type: integer, description: Session lifetime in seconds. }

captain_playground_action_preview:
  type: object
  properties:
    id: { type: string }
    digest: { type: string }
    tool: { type: string }
    arguments: { type: object, additionalProperties: true }
    target: { type: object, additionalProperties: true }
    status: { type: string, enum: [pending] }
    expires_at: { type: integer, format: int64, description: Unix timestamp in seconds. }
    binding:
      type: object
      properties:
        session_id: { type: string }
        mode: { type: string, enum: [workspace] }
        account_id: { type: integer }
        user_id: { type: integer }
        entry_assistant_id: { type: integer }
        assistant_id: { type: integer, description: Acting agent whose selected tools authorize this preview. }
      additionalProperties: false
  additionalProperties: false

captain_knowledge_access_parameters:
  type: object
  description: Access fields accepted inside document or assistant_response create/update payloads. Access changes are saved only when the request succeeds; material is shared through grants without duplication. Omitted allowed_assistant_ids retains existing grants unless visibility changes to general. Each selected agent must belong to the requested account.
  properties:
    assistant_id: { type: [integer, 'null'], description: Legacy owner. Personal knowledge may instead use an explicit allowed_assistant_ids selection with assistant_id=null. }
    visibility: { type: string, enum: [general, personal], description: General grants access to all agents in this account and clears explicit grants. Personal grants access to the legacy owner and selected agents. }
    allowed_assistant_ids:
      type: array
      items: { type: integer, minimum: 1 }
      description: Replaces the explicit selected-agent grants on save. Personal knowledge requires at least one selected agent or a legacy owner; switching to general clears these grants.

captain_knowledge_access:
  type: object
  description: Access fields returned by document and FAQ serializers. Legacy personal material with no owner and restricted_to_assistants=false remains workspace-shared; derived material inherits source access where applicable.
  properties:
    visibility: { type: string, enum: [general, personal] }
    allowed_assistant_ids:
      type: array
      uniqueItems: true
      readOnly: true
      items: { type: integer, minimum: 1 }
      description: Effective legacy owner and explicit grants for personal knowledge; empty for general visibility.
    restricted_to_assistants: { type: boolean, readOnly: true, description: Stored explicit-selection flag. Derived material also follows its source's access restrictions. }

crm_appointment_automation:
  type: object
  description: Prospective per-pipeline settings. enabled controls appointment-driven stage automation. auto_create_deals independently controls all automatic appointment deal creation, including cardinality cloning; incoming-channel auto-create never enables it. Existing links and explicit valid existing-deal selection remain usable while creation is off. A deliberate crm_deal_selection=create remains an explicit manual action subject to CRM validation. Legacy absent masters normalize true only from explicit calendar or integration source opt-ins.
  properties:
    enabled: { type: boolean, default: false, description: Enables appointment-driven stage automation. }
    auto_create_deals: { type: boolean, default: false, description: Independent master switch for automatic appointment deal creation. Turning it off preserves source preferences and historical links. }
    cardinality: { type: string, enum: [request, appointment], default: request }
    auto_create_from_calendar: { type: boolean, default: false }
    auto_create_from_medelement: { type: boolean, default: false }
    manual_stage_change: { type: string, enum: [continue, pause], default: continue }
    success_mode: { type: string, enum: [manual, any_attended, selected_attended, all_required_attended], default: manual }
    rules:
      type: array
      maxItems: 50
      description: Evaluated in array order; the first matching rule wins. Closed deals are not automatically reopened.
      items:
        type: object
        required: [stage_id, scope, conditions]
        properties:
          id: { type: string }
          name: { type: string }
          stage_id: { $ref: '#/components/schemas/crm_stage_reference' }
          scope: { type: string, enum: [any, all, selected, nearest] }
          conditions: { type: array, minItems: 1, items: { type: string, enum: [provider_confirmed, patient_confirmed, scheduled, attended, cancelled, no_show, today, tomorrow, past, future] } }
          closing_reasons: { type: array, items: { type: string }, description: Accepted only for a lost target stage; removed from rules targeting open or won stages. }

crm_appointment_plan_item:
  type: object
  required: [label]
  properties:
    id: { type: string, description: Stable plan item identifier; generated when omitted. }
    label: { type: string, minLength: 1, maxLength: 200 }
    required: { type: boolean, default: true }
    appointment_id: { type: integer, nullable: true, description: An appointment linked to this deal; one appointment may fulfill only one plan item. }

lead_appointment_conversion:
  type: object
  description: First inbound communication contacts in the selected period; appointment outcomes observed until observed_at. A caller booking two patients is one lead and two appointments.
  properties:
    leads_count: { type: integer }
    booked_leads_count: { type: integer }
    attended_leads_count: { type: integer }
    booking_conversion_percent: { type: number }
    attendance_conversion_percent: { type: number }
    repeat_contacts_count: { type: integer }
    appointments_count: { type: integer }
    provider_booked_appointments_count: { type: integer }
    attended_appointments_count: { type: integer }
    cancelled_or_no_show_appointments_count: { type: integer }
    unknown_attendance_appointments_count: { type: integer }
    appointments_without_contact_count: { type: integer }
    deals_count: { type: integer }
    won_deals_count: { type: integer }
    attribution_breakdown: { type: array, maxItems: 20, items: { type: object, additionalProperties: true } }
    observed_at: { type: string, format: date-time }
    cohort: { type: string, enum: [first_inbound_communication_contact] }
    outcomes: { type: string, enum: [observed_to_now] }
    scheduling_enabled: { type: boolean }

captain_assistant_payload:
  type: object
  required: [assistant]
  description: Creates an account-scoped independent agent. Routing and profile settings are persisted together only when the request succeeds. Instructions belong in assistant.description. Separate response_guidelines, guardrails or config.rules writes return 422 separate_rules_removed. config.skills is no longer permitted and is ignored.
  properties:
    assistant:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string, nullable: true, description: This agent's own main prompt. }
        usage_mode: { type: string, enum: [external_agent, internal_assistant] }
        active: { type: boolean, default: true, description: Enables this agent for entry and handoff routing when usage_mode is external_agent. }
        routing_description: { type: string, nullable: true, maxLength: 2000 }
        config:
          type: object
          description: 'Safety checks are one workspace setting (captain/settings, section safety); config.safety_settings is ignored.'
          properties:
            model: { type: string }
            tool_access: { type: object, additionalProperties: true }
            follow_up_settings: { type: object, additionalProperties: true }
            outcome_reason_settings: { $ref: '#/components/schemas/captain_outcome_reason_settings' }
            context_access: { type: object, additionalProperties: true }
            voice_settings: { type: object, additionalProperties: true }
          additionalProperties: true
      additionalProperties: true

captain_outcome_reason_settings:
  type: object
  description: Stable reason IDs for conversation completion and handoff. Completion is a conversation status outcome, not a sale. Labels may change without changing the ID. The other fallback remains active. Writes normalize at most 27 configured entries per type; read options additionally include built-in choices.
  properties:
    completion_reasons:
      type: array
      items: { $ref: '#/components/schemas/captain_outcome_reason_option' }
    handoff_reasons:
      type: array
      items: { $ref: '#/components/schemas/captain_outcome_reason_option' }
  additionalProperties: false

captain_outcome_reason_option:
  type: object
  required: [id, label]
  properties:
    id: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$', description: Stable ID unique within its outcome type. }
    label: { type: string, minLength: 1, maxLength: 255 }
    active: { type: boolean, default: true }
  additionalProperties: false

captain_removed_rules_error:
  type: object
  required: [error, fields, message]
  properties:
    error: { type: string, enum: [separate_rules_removed] }
    fields:
      type: array
      minItems: 1
      items: { type: string, enum: [response_guidelines, guardrails, config.rules] }
    message: { type: string, enum: ['Save instructions in assistant.description.'] }
  additionalProperties: false
