crm_error:
  type: object
  required: [error, code]
  properties:
    error: { type: string }
    code: { type: string }
    details: { type: object, additionalProperties: true }

crm_field_requirement:
  type: object
  properties:
    id: { type: integer }
    field_key: { type: string }
    required: { type: boolean }
    validation: { type: object, additionalProperties: true }
    role_exemptions: { type: array, items: { type: string } }

crm_stage:
  type: object
  properties:
    id: { type: integer }
    account_id: { type: integer }
    pipeline_id: { type: integer }
    name: { type: string }
    code: { type: string }
    color: { type: string }
    position: { type: integer }
    outcome: { type: string, enum: [open, won, lost] }
    system: { type: boolean }
    position_locked: { type: boolean }
    closing_reason_options: { type: array, items: { type: string } }
    closing_reason_required: { type: boolean }
    transition_reason_options: { type: array, items: { type: string } }
    transition_reason_required: { type: boolean }
    active: { type: boolean }
    default: { type: boolean }
    field_requirements: { type: array, items: { $ref: '#/components/schemas/crm_field_requirement' } }
    deal_count: { type: integer }
    dialog_deal_count: { type: integer }
    created_at: { type: string, format: date-time }
    updated_at: { type: string, format: date-time }

crm_pipeline:
  type: object
  properties:
    id: { type: integer }
    account_id: { type: integer }
    name: { type: string }
    code: { type: string }
    position: { type: integer }
    active: { type: boolean }
    default: { type: boolean }
    auto_create_deal_on_channel_contact: { type: boolean }
    appointment_automation: { $ref: '#/components/schemas/crm_appointment_automation' }
    restrict_stage_skipping: { type: boolean }
    restrict_backward_move: { type: boolean }
    allow_stage_rule_override: { type: boolean }
    deal_count: { type: integer }
    dialog_deal_count: { type: integer }
    stages: { type: array, items: { $ref: '#/components/schemas/crm_stage' } }
    created_at: { type: string, format: date-time }
    updated_at: { type: string, format: date-time }

crm_task_status:
  type: object
  properties:
    id: { type: integer }
    account_id: { type: integer }
    name: { type: string }
    code: { type: string }
    color: { type: string }
    position: { type: integer }
    category: { type: string, enum: [open, in_progress, completed, cancelled] }
    active: { type: boolean }
    default: { type: boolean }
    created_at: { type: string, format: date-time }
    updated_at: { type: string, format: date-time }

crm_task_outcome:
  type: object
  properties:
    id: { type: integer }
    account_id: { type: integer }
    task_type_id: { type: integer }
    name: { type: string }
    code: { type: string }
    position: { type: integer }
    active: { type: boolean }
    default: { type: boolean }
    requires_note: { type: boolean }
    created_at: { type: string, format: date-time }
    updated_at: { type: string, format: date-time }

crm_task_type:
  type: object
  properties:
    id: { type: integer }
    account_id: { type: integer }
    name: { type: string }
    code: { type: string }
    icon: { type: string }
    position: { type: integer }
    active: { type: boolean }
    default: { type: boolean }
    outcomes: { type: array, items: { $ref: '#/components/schemas/crm_task_outcome' } }
    created_at: { type: string, format: date-time }
    updated_at: { type: string, format: date-time }

crm_deal:
  type: object
  properties:
    id: { type: integer }
    account_id: { type: integer }
    pipeline_id: { type: integer }
    stage_id: { type: integer }
    owner_id: { type: integer, nullable: true }
    creator_id: { type: integer, nullable: true }
    team_id: { type: integer, nullable: true }
    company_id: { type: integer, nullable: true }
    originating_conversation_id: { type: integer, nullable: true }
    originating_conversation_display_id: { type: integer, nullable: true }
    originating_communication_thread_id: { type: integer, nullable: true }
    originating_communication_thread_display_id: { type: integer, nullable: true }
    dialog_id: { type: integer, nullable: true }
    dialog_display_id: { type: integer, nullable: true }
    dialog_kind: { type: string, nullable: true }
    dialog_status: { type: string, nullable: true }
    title: { type: string }
    description: { type: string, nullable: true }
    amount: { type: number, nullable: true }
    amount_minor: { type: integer, nullable: true }
    currency: { type: string, nullable: true }
    expected_close_on: { type: string, format: date, nullable: true }
    closed_at: { type: string, format: date-time, nullable: true }
    waiting_until: { type: string, format: date-time, nullable: true }
    waiting_reason: { type: string, nullable: true }
    waiting_started_at: { type: string, format: date-time, nullable: true }
    waiting_set_by_id: { type: integer, nullable: true }
    next_action: { type: object, nullable: true, additionalProperties: true }
    closing_reasons: { type: array, items: { type: string } }
    position: { type: integer }
    win_probability: { type: number, nullable: true }
    external_ref: { type: string, nullable: true }
    idempotency_key: { type: string, nullable: true }
    lock_version: { type: integer }
    appointment_plan: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/crm_appointment_plan_item' } }
    selected_appointment_id: { type: integer, nullable: true }
    appointment_automation_state: { type: object, additionalProperties: true, description: Public automation state; signed delivery policies are excluded. }
    custom_attributes: { type: object, additionalProperties: true }
    archived_at: { type: string, format: date-time, nullable: true }
    company: { type: object, nullable: true, additionalProperties: true }
    deal_contacts: { type: array, items: { type: object, properties: { contact_id: { type: integer }, primary: { type: boolean } } } }
    primary_contact: { type: object, nullable: true, additionalProperties: true }
    primary_contact_id: { type: integer, nullable: true }
    created_at: { type: string, format: date-time }
    updated_at: { type: string, format: date-time }

crm_task:
  type: object
  properties:
    id: { type: integer }
    account_id: { type: integer }
    context_kind: { type: string }
    deal_id: { type: integer, nullable: true }
    status_id: { type: integer }
    task_type_id: { type: integer, nullable: true }
    task_outcome_id: { type: integer, nullable: true }
    assignee_id: { type: integer, nullable: true }
    creator_id: { type: integer, nullable: true }
    completed_by_id: { type: integer, nullable: true }
    cancelled_by_id: { type: integer, nullable: true }
    team_id: { type: integer, nullable: true }
    originating_conversation_id: { type: integer, nullable: true }
    title: { type: string }
    description: { type: string, nullable: true }
    activity_type: { type: string, nullable: true, description: 'Compatibility projection for legacy tasks without a catalog task type.' }
    outcome: { type: string, nullable: true }
    outcome_note: { type: string, nullable: true }
    priority: { type: string, nullable: true }
    all_day: { type: boolean }
    start_at: { type: string, format: date-time, nullable: true }
    due_at: { type: string, format: date-time, nullable: true }
    due_on: { type: string, format: date, nullable: true }
    schedule_timezone: { type: string, nullable: true }
    completed_at: { type: string, format: date-time, nullable: true }
    cancelled_at: { type: string, format: date-time, nullable: true }
    cancellation_reason: { type: string, nullable: true }
    reschedule_count: { type: integer }
    task_type: { type: object, nullable: true, additionalProperties: true }
    task_outcome: { type: object, nullable: true, additionalProperties: true }
    position: { type: integer }
    external_ref: { type: string, nullable: true }
    idempotency_key: { type: string, nullable: true }
    lock_version: { type: integer }
    custom_attributes: { type: object, additionalProperties: true }
    archived_at: { type: string, format: date-time, nullable: true }
    created_at: { type: string, format: date-time }
    updated_at: { type: string, format: date-time }

crm_task_lifecycle_snapshot:
  type: object
  description: State captured before or after a CRM task lifecycle command in its timeline event.
  properties:
    status_id: { type: integer }
    position: { type: integer }
    task_type_id: { type: integer, nullable: true }
    task_outcome_id: { type: integer, nullable: true }
    outcome: { type: string, nullable: true }
    outcome_note: { type: string, nullable: true }
    assignee_id: { type: integer, nullable: true }
    team_id: { type: integer, nullable: true }
    start_at: { type: string, format: date-time, nullable: true }
    due_at: { type: string, format: date-time, nullable: true }
    due_on: { type: string, format: date, nullable: true }
    all_day: { type: boolean }
    schedule_timezone: { type: string }
    completed_at: { type: string, format: date-time, nullable: true }
    completed_by_id: { type: integer, nullable: true }
    cancelled_at: { type: string, format: date-time, nullable: true }
    cancelled_by_id: { type: integer, nullable: true }
    cancellation_reason: { type: string, nullable: true }
    reschedule_count: { type: integer }
  additionalProperties: true

crm_task_timeline_event:
  type: object
  description: CRM event attached to the task timeline. Lifecycle command events carry state snapshots in before_data and after_data.
  properties:
    id: { type: integer }
    account_id: { type: integer }
    eventable_type: { type: string }
    eventable_id: { type: integer }
    actor_id: { type: integer, nullable: true }
    actor_kind: { type: string }
    event_type: { type: string }
    source: { type: string, nullable: true }
    before_data: { allOf: [{ $ref: '#/components/schemas/crm_task_lifecycle_snapshot' }], nullable: true }
    after_data: { allOf: [{ $ref: '#/components/schemas/crm_task_lifecycle_snapshot' }], nullable: true }
    correlation_id: { type: string, nullable: true }
    causation_id: { type: string, nullable: true }
    schema_version: { type: integer }
    meta: { type: object, additionalProperties: true }
    created_at: { type: string, format: date-time }
  additionalProperties: true

crm_task_timeline_entry:
  type: object
  properties:
    item_type: { type: string, enum: [event, comment, conversation] }
    occurred_at: { type: string, format: date-time }
    payload:
      $ref: '#/components/schemas/crm_task_timeline_event'
      description: Event entries use this shape; comment and conversation entries carry their respective payload.

crm_task_timeline_response:
  type: object
  properties:
    payload:
      type: array
      items: { $ref: '#/components/schemas/crm_task_timeline_entry' }
    meta:
      type: object
      properties:
        count: { type: integer }
        next_cursor: { type: string, format: date-time, nullable: true }

crm_report_meta:
  type: object
  properties:
    count: { type: integer }
    page: { type: integer }
    per_page: { type: integer }
    total_count: { type: integer }
    has_more: { type: boolean }
    metric_kind: { type: string }
    reliability: { type: string }
    timezone: { type: string }
    generated_at: { type: string, format: date-time }
    generated_at_local: { type: string, format: date-time }
    query_fingerprint: { type: string }
    metric_definition: { type: string }
    temporal_definition: { type: string }

crm_report_rows_response:
  type: object
  properties:
    payload:
      type: object
      properties:
        rows: { type: array, items: { type: object, additionalProperties: true } }
    meta: { $ref: '#/components/schemas/crm_report_meta' }

crm_storage_summary:
  type: object
  properties:
    total_limit_bytes: { type: integer }
    consumed_bytes: { type: integer }
    available_bytes: { type: integer }
    unlimited: { type: boolean }
    usage_percent: { type: number }
    breakdown: { type: object, additionalProperties: true }
    last_updated_at: { type: string, format: date-time, nullable: true }

crm_storage_file:
  type: object
  properties:
    id: { type: string }
    name: { type: string }
    file_type: { type: string }
    byte_size: { type: integer }
    human_size: { type: string }
    created_at: { type: string, format: date-time }
    inbox_id: { type: integer, nullable: true }
    inbox_name: { type: string }
    conversation_id: { type: integer, nullable: true }
    download_url: { type: string, nullable: true }

crm_storage_trash_item:
  type: object
  properties:
    id: { type: string }
    item_type: { type: string, enum: [recording, attachment] }
    file_name: { type: string }
    file_type: { type: string }
    byte_size: { type: integer }
    created_at: { type: string, format: date-time }
    inbox_id: { type: integer, nullable: true }
    inbox_name: { type: string }
    trashed_at: { type: string, format: date-time }
    expires_at: { type: string, format: date-time }

captain_assistant:
  type: object
  properties:
    id: { type: integer }
    account_id: { type: integer }
    name: { type: string }
    description: { type: string, nullable: true }
    usage_mode: { type: string, enum: [external_agent, internal_assistant] }
    response_guidelines: { type: array, nullable: true, items: { type: string } }
    guardrails: { type: array, nullable: true, items: { type: string } }
    config:
      type: object
      description: 'Assistant configuration is updated through the existing assistant endpoint. Model, tool access, follow-up settings, and outcome reason settings are account-scoped per assistant. Omitted safety fields retain saved overrides during a partial update; explicit null resets a safety field to inheritance from the workspace policy. Unspecified safety fields on a new assistant inherit workspace policy.'
      properties:
        model: { type: string }
        safety_settings: { $ref: '#/components/schemas/captain_assistant_safety_settings' }
        tool_access: { type: object, additionalProperties: true }
        follow_up_settings: { type: object, additionalProperties: true }
        outcome_reason_settings: { type: object, additionalProperties: true }
        context_access: { type: object, additionalProperties: true }
        voice_settings: { type: object, additionalProperties: true }
      additionalProperties: true
    type: { type: string, enum: [captain_assistant] }
    created_at: { type: integer, format: int64, description: Unix timestamp in seconds }
    updated_at: { type: integer, format: int64, description: Unix timestamp in seconds }

captain_assistants_response:
  type: object
  required: [payload, meta]
  properties:
    payload:
      type: array
      items: { $ref: '#/components/schemas/captain_assistant' }
    meta:
      type: object
      properties:
        total_count: { type: integer }
        page: { type: integer, description: Pagination structure is reserved; current response reports page 1. }

captain_assistant_safety_settings:
  type: object
  description: Omitted safety fields retain saved overrides during a partial update; explicit null resets a safety field to inheritance from the workspace policy. Unspecified safety fields on a new assistant inherit workspace policy.
  properties:
    moderation_enabled: { type: [boolean, 'null'], description: Enable or disable provider moderation for this assistant; null inherits the workspace value. }
    prompt_injection_action: { type: [string, 'null'], enum: [disabled, flag, block, null], description: Runtime prompt-injection guardrail action; null inherits the workspace value. }
    sensitive_info_action: { type: [string, 'null'], enum: [disabled, flag, block, null], description: Runtime sensitive-information guardrail action; null inherits the workspace value. }
  additionalProperties: false

captain_assistant_playground_request:
  type: object
  required: [assistant]
  properties:
    assistant: { $ref: '#/components/schemas/captain_assistant_playground_parameters' }

captain_assistant_playground_parameters:
  type: object
  properties:
    message_content: { type: string, description: Required for the default message action. }
    playground_mode: { type: string, enum: [trial, live], default: trial, description: Live requires an account administrator and uses real clinic operations with a synthetic caller. }
    playground_action: { type: string, enum: [message, session, reset], default: message }
    playground_session_id: { type: string, description: Server-owned session identifier scoped to this account, user, assistant and mode. }
    scenario: { type: object, additionalProperties: true, description: Trial accepts synthetic business data; Live accepts only the synthetic caller profile. }
    live_inbox_id: { type: integer }
    external_delivery_enabled: { type: boolean, default: false }
    controlled_test_number: { type: string, description: Explicit controlled delivery target for Live mode. }
    message_history:
      type: array
      description: External-agent sessions use server-owned history and ignore client history. Reserved for the enabled internal assistant playground.
      items:
        type: object
        required: [role, content]
        properties:
          role: { type: string }
          content: { type: string }
          agent_name: { type: string }
    conversation_id: { type: string, description: Trial rejects real conversations; Live accepts only its own dedicated session conversation display ID. }
    test_model: { type: string, description: Per-request selectable model override. It is validated against the assistant model registry and is not saved to the assistant. }
    test_temperature: { type: number, minimum: 0, maximum: 1, description: Per-request temperature override; accepted only when the selected model supports temperature. }
    test_thinking_effort: { type: string, description: Per-request reasoning effort override; validated against the selected model's supported capabilities. }

captain_assistant_playground_response:
  type: object
  properties:
    response: { type: string, nullable: true, description: Present for a message action; session and reset actions return session state without a generated reply. }
    playground: { $ref: '#/components/schemas/captain_playground_session' }
    delivery: { type: object, additionalProperties: true, description: Actual delivery result; a queued message is not confirmed delivery. }
    agent_name: { type: [string, 'null'] }
    reasoning: { type: [string, 'null'] }
    response_latency_ms: { type: integer, minimum: 0, description: Measured end-to-end response latency in milliseconds. }
    reported_reasoning_tokens: { type: integer, minimum: 1, description: Provider-reported reasoning tokens, included only when the provider supplies this usage metric. }
    tool_trace:
      type: array
      items:
        type: object
        properties:
          tool: { type: string }
          event: { type: string }
        additionalProperties: true
  additionalProperties: true

captain_playground_session:
  type: object
  properties:
    session_id: { type: string }
    mode: { type: string, enum: [trial, live] }
    scenario: { type: object, additionalProperties: true }
    message_history: { type: array, items: { type: object, additionalProperties: true } }
    live_available: { type: boolean }
    live_warning: { type: string }
    conversation_id: { type: integer, description: Dedicated Live conversation display ID. }
    inbox_id: { type: integer }
    delivery_enabled: { type: boolean }
    delivery_target: { type: string }
    inboxes: { type: array, items: { type: object, properties: { id: { type: integer }, name: { type: string }, channel_type: { type: string } } } }

crm_appointment_automation:
  type: object
  description: Prospective, per-pipeline configuration. Stage automation is disabled until explicitly enabled; historical appointment links and existing channel autodeal settings are retained.
  properties:
    enabled: { type: boolean, default: false }
    cardinality: { type: string, enum: [request, appointment], default: request }
    auto_create_from_calendar: { type: boolean, default: false }
    auto_create_from_medelement: { type: boolean, default: false }
    manual_stage_change: { type: string, enum: [continue, pause], default: continue }
    success_mode: { type: string, enum: [manual, any_attended, selected_attended, all_required_attended], default: manual }
    rules:
      type: array
      maxItems: 50
      description: Evaluated in array order; the first matching rule wins. Closed deals are not automatically reopened.
      items:
        type: object
        required: [stage_id, scope, conditions]
        properties:
          stage_id: { type: integer }
          scope: { type: string, enum: [any, all, selected, nearest] }
          conditions: { type: array, minItems: 1, items: { type: string, enum: [provider_confirmed, patient_confirmed, scheduled, attended, cancelled, no_show, today, tomorrow, past, future] } }
          closing_reasons: { type: array, items: { type: string } }
          transition_reason: { type: string }

crm_appointment_plan_item:
  type: object
  required: [label]
  properties:
    id: { type: string, description: Stable plan item identifier; generated when omitted. }
    label: { type: string, minLength: 1, maxLength: 200 }
    required: { type: boolean, default: true }
    appointment_id: { type: integer, nullable: true, description: An appointment linked to this deal; one appointment may fulfill only one plan item. }

lead_appointment_conversion:
  type: object
  description: First inbound communication contacts in the selected period; appointment outcomes observed until observed_at. A caller booking two patients is one lead and two appointments.
  properties:
    leads_count: { type: integer }
    booked_leads_count: { type: integer }
    attended_leads_count: { type: integer }
    booking_conversion_percent: { type: number }
    attendance_conversion_percent: { type: number }
    repeat_contacts_count: { type: integer }
    appointments_count: { type: integer }
    provider_booked_appointments_count: { type: integer }
    attended_appointments_count: { type: integer }
    cancelled_or_no_show_appointments_count: { type: integer }
    unknown_attendance_appointments_count: { type: integer }
    appointments_without_contact_count: { type: integer }
    deals_count: { type: integer }
    won_deals_count: { type: integer }
    attribution_breakdown: { type: array, maxItems: 20, items: { type: object, additionalProperties: true } }
    observed_at: { type: string, format: date-time }
    cohort: { type: string, enum: [first_inbound_communication_contact] }
    outcomes: { type: string, enum: [observed_to_now] }
    scheduling_enabled: { type: boolean }

captain_assistant_payload:
  type: object
  required: [assistant]
  properties:
    assistant:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        usage_mode: { type: string, enum: [external_agent, internal_assistant] }
        response_guidelines: { type: array, items: { type: string } }
        guardrails: { type: array, items: { type: string } }
        config:
          type: object
          description: 'Omitted safety fields retain saved overrides during a partial update; explicit null resets a safety field to inheritance from the workspace policy. Unspecified safety fields on a new assistant inherit workspace policy.'
          properties:
            model: { type: string }
            safety_settings: { $ref: '#/components/schemas/captain_assistant_safety_settings' }
            tool_access: { type: object, additionalProperties: true }
            follow_up_settings: { type: object, additionalProperties: true }
            outcome_reason_settings: { type: object, additionalProperties: true }
            context_access: { type: object, additionalProperties: true }
            voice_settings: { type: object, additionalProperties: true }
          additionalProperties: true
      additionalProperties: true
