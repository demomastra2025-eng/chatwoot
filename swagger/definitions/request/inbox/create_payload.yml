type: object
properties:
  name:
    type: string
    description: The name of the inbox
    example: 'Support'
  avatar:
    type: string
    format: binary
    description: Image file for avatar
  greeting_enabled:
    type: boolean
    description: Enable greeting message
    example: true
  greeting_message:
    type: string
    description: Greeting message to be displayed on the widget
    example: Hello, how can I help you?
  enable_email_collect:
    type: boolean
    description: Enable email collection
    example: true
  csat_survey_enabled:
    type: boolean
    description: Enable CSAT survey
    example: true
  enable_auto_assignment:
    type: boolean
    description: Enable Auto Assignment
    example: true
  working_hours_enabled:
    type: boolean
    description: Enable working hours
    example: true
  out_of_office_message:
    type: string
    description: Out of office message to be displayed on the widget
    example: We are currently out of office. Please leave a message and we will get back to you.
  timezone:
    type: string
    description: Timezone of the inbox
    example: 'America/New_York'
  allow_messages_after_resolved:
    type: boolean
    description: Allow messages after conversation is resolved
    example: true
  lock_to_single_conversation:
    type: boolean
    description: Lock to single conversation
    example: true
  portal_id:
    type: integer
    description: Id of the help center portal to attach to the inbox
    example: 1
  sender_name_type:
    type: string
    description: Sender name type for the inbox
    enum: ['friendly', 'professional']
    example: 'friendly'
  business_name:
    type: string
    description: Business name for the inbox
    example: 'My Business'
  channel:
    type: object
    properties:
      type:
        type: string
        description: Type of the channel
        enum:
          ['web_widget', 'api', 'whatsapp_web', 'email', 'line', 'telegram', 'whatsapp', 'sms']
        example: web_widget
      website_url:
        type: string
        description: URL at which the widget will be loaded
        example: 'https://example.com'
      welcome_title:
        type: string
        description: Welcome title to be displayed on the widget
        example: 'Welcome to our support'
      welcome_tagline:
        type: string
        description: Welcome tagline to be displayed on the widget
        example: 'We are here to help you'
      widget_color:
        type: string
        description: A Hex-color string used to customize the widget
        example: '#FF5733'
      phone_number:
        type: string
        description: E.164 phone number for SMS or WhatsApp Web channels
        example: '+15551234567'
      conversation_pending:
        type: boolean
        description: Start new live inbound WhatsApp Web conversations as pending
        example: false
      history_lookback_days:
        type: integer
        description: Number of days to import during the initial WhatsApp Web history sync
        example: 365
      ignore_jids:
        type: array
        description: WhatsApp JIDs that should be ignored by the native WhatsApp Web channel
        items:
          type: string
        example: ['15550001111@s.whatsapp.net']
      sign_messages:
        type: boolean
        description: Prefix outgoing WhatsApp Web message bodies with the agent name
        example: false
      sign_delimiter:
        type: string
        description: Delimiter inserted between the agent signature and the message body. Use \\n for a newline.
        example: '\\n'
      import_contacts:
        type: boolean
        description: Enable address book import for WhatsApp Web contact sync
        example: true
      import_messages:
        type: boolean
        description: Enable history import for WhatsApp Web message sync
        example: true
      sync_labels:
        type: boolean
        description: Sync WhatsApp labels into Onelink conversation labels
        example: true
      provider_config:
        type: object
        description: Provider-specific configuration for channels that support it
