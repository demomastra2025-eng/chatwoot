type: object
properties:
  app_id:
    type: string
    description: The ID of app for which integration hook is being created
    example: webhook
  inbox_id:
    type: integer
    description: The inbox ID, if the hook is an inbox hook
    example: 1
  status:
    type: string
    description: The status of the integration
    example: enabled
  access_token:
    type: string
    description: Secret token stored separately from integration settings
    example: secret-token
  settings:
    type: object
    description: The settings required by the integration
    example: {}
