type: object
required:
  - name
  - email
anyOf:
  - required: [role]
  - required: [custom_role_id]
  - required: [access_role_id]
properties:
  name:
    type: string
    description: Full Name of the agent
    example: 'John Doe'
  email:
    type: string
    description: Email of the Agent
    example: 'john.doe@acme.inc'
  role:
    type: string
    enum: ['agent', 'administrator']
    description: Legacy system role. Do not combine with custom_role_id or access_role_id.
    example: 'agent'
  custom_role_id:
    type:
      - integer
      - 'null'
    description: Legacy custom role ID. Do not combine with role or access_role_id.
  access_role_id:
    type: integer
    description: Canonical account-scoped access role ID. Available only when access-role assignment capability is enabled; do not combine with legacy role fields.
  availability_status:
    type: string
    enum: ['available', 'busy', 'offline']
    description: The availability setting of the agent.
    example: 'available'
  auto_offline:
    type: boolean
    description: Whether the availability status of agent is configured to go offline automatically when away.
    example: true
