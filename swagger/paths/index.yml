    security: [{ userApiKey: [] }]
    responses: { '200': { description: Task status catalog, content: { application/json: { schema: { type: object, properties: { payload: { type: array, items: { $ref: '#/components/schemas/crm_task_status' } }, meta: { type: object } } } } } }}
