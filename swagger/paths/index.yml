/api/v1/accounts/{account_id}/crm/field_definitions:
  parameters:
    - $ref: '#/components/parameters/account_id'
  get:
    tags: [CRM]
    operationId: list-crm-field-definitions
    summary: List managed custom field definitions
    description: Returns field definitions for deal, task, or appointment entities. `appointment` definitions require the scheduling feature.
    security:
      - userApiKey: []
    parameters:
      - in: query
        name: entity_kind
        schema:
          type: string
          enum: [deal, task, appointment]
    responses:
      '200':
        description: Managed field definitions
        content:
          application/json:
            schema:
              type: object
              properties:
                payload:
                  type: array
                  items: *crm_field_definition_schema
                meta:
                  type: object
                  properties:
                    count: { type: integer }
      '403':
        description: Relevant CRM or scheduling feature is disabled for this account
        content:
          application/json:
            schema: *crm_error_schema
  post:
    tags: [CRM]
    operationId: create-crm-field-definition
    summary: Create a managed custom field definition
    description: Creates a field definition for `deal`, `task`, or `appointment`. Built-in entity fields are reserved and cannot be reused as custom keys.
    security:
      - userApiKey: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [entity_kind, key, label, field_type]
            properties:
              entity_kind:
                type: string
                enum: [deal, task, appointment]
              key: { type: string }
              label: { type: string }
              description: { type: string }
              field_type:
                type: string
                enum: [text, textarea, number, currency, percent, checkbox, date, datetime, select, multiselect, url]
              required: { type: boolean }
              active: { type: boolean }
              position: { type: integer }
              default_value:
                nullable: true
                oneOf:
                  - { type: string }
                  - { type: number }
                  - { type: boolean }
                  - { type: array, items: { type: string } }
                  - { type: object, additionalProperties: true }
              options:
                type: array
                items:
                  oneOf:
                    - { type: string }
                    - { type: object, additionalProperties: true }
              rules:
                type: object
                additionalProperties: true
    responses:
      '201':
        description: Field definition created
        content:
          application/json:
            schema:
              type: object
              properties:
                payload: *crm_field_definition_schema
      '403':
        description: Relevant CRM or scheduling feature is disabled for this account
        content:
          application/json:
            schema: *crm_error_schema
      '422':
        description: Invalid field definition payload
        content:
          application/json:
            schema: *crm_error_schema

