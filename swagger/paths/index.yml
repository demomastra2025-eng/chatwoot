  parameters: [{ $ref: '#/components/parameters/account_id' }, { in: path, name: id, required: true, schema: { type: integer } }]
  get:
    tags: [CRM]
    operationId: get-crm-deal
    summary: Get a CRM deal
    security: [{ userApiKey: [] }]
    responses: { '200': { description: Deal, content: { application/json: { schema: { type: object, properties: { payload: { $ref: '#/components/schemas/crm_deal' } } } } } }, '404': { description: Not found or not visible, content: { application/json: { schema: { $ref: '#/components/schemas/crm_error' } } } }}
  patch:
    tags: [CRM]
    operationId: update-crm-deal
    summary: Update CRM deal fields
    description: Stage, close/reopen, waiting, reorder and archive fields use lifecycle commands. lock_version enables stale-write detection.
    security: [{ userApiKey: [] }]
    requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { owner_id: { type: integer }, creator_id: { type: integer }, team_id: { type: integer }, company_id: { type: integer }, title: { type: string }, description: { type: string }, amount_minor: { type: integer }, currency: { type: string }, expected_close_on: { type: string, format: date }, win_probability: { type: number }, external_ref: { type: string }, idempotency_key: { type: string }, primary_contact_id: { type: integer }, contact_ids: { type: array, items: { type: integer } }, closing_reasons: { type: array, items: { type: string } }, custom_attributes: { type: object, additionalProperties: true }, lock_version: { type: integer } } } } } }
    responses: { '200': { description: Updated deal, content: { application/json: { schema: { type: object, properties: { payload: { $ref: '#/components/schemas/crm_deal' } } } } } }, '409': { description: Stale update or idempotency conflict, content: { application/json: { schema: { $ref: '#/components/schemas/crm_error' } } } }, '422': { description: Invalid deal, content: { application/json: { schema: { $ref: '#/components/schemas/crm_error' } } } } }
