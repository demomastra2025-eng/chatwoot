x-crm-error-schema: &crm_error_schema
  type: object
  required:
    - error
    - code
  properties:
    error:
      type: string
    code:
      type: string
      enum:
        - VALIDATION_ERROR
        - FEATURE_DISABLED
        - DUPLICATE_EXTERNAL_REF
        - DUPLICATE_IDEMPOTENCY_KEY
        - NOT_FOUND
        - STALE_RECORD
    details:
      type: object
      nullable: true
      additionalProperties: true

x-crm-field-definition-schema: &crm_field_definition_schema
  type: object
  properties:
    id: { type: integer }
    account_id: { type: integer }
    entity_kind:
      type: string
      enum: [deal, task, appointment]
    key: { type: string }
    label: { type: string }
    description: { type: string, nullable: true }
    field_type:
      type: string
      enum: [text, textarea, number, currency, percent, checkbox, date, datetime, select, multiselect, url]
    required: { type: boolean }
    active: { type: boolean }
    position: { type: integer }
    default_value:
      nullable: true
      oneOf:
        - { type: string }
        - { type: number }
        - { type: boolean }
        - { type: array, items: { type: string } }
        - { type: object, additionalProperties: true }
    options:
      type: array
      items:
        oneOf:
          - { type: string }
          - { type: object, additionalProperties: true }
    rules:
      type: object
      additionalProperties: true
    created_at: { type: string, format: date-time }
    updated_at: { type: string, format: date-time }

