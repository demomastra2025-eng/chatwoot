  post:
    tags: [CRM]
    operationId: create-crm-deal
    summary: Create a CRM deal
    description: Creates an account-scoped CRM deal under the existing deal policy. An account idempotency_key returns the matching existing deal; related records remain subject to authorization. Supplying owner_id or team_id also requires the current assignment authorization.
    security: [{ userApiKey: [] }]
    requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { pipeline_id: { type: integer }, stage_id: { type: integer }, owner_id: { type: integer }, creator_id: { type: integer }, team_id: { type: integer }, company_id: { type: integer }, originating_conversation_id: { type: integer }, originating_communication_thread_id: { type: integer }, title: { type: string }, description: { type: string }, amount_minor: { type: integer }, currency: { type: string }, expected_close_on: { type: string, format: date }, position: { type: integer }, win_probability: { type: number }, external_ref: { type: string }, idempotency_key: { type: string }, primary_contact_id: { type: integer }, contact_ids: { type: array, items: { type: integer } }, closing_reasons: { type: array, items: { type: string } }, custom_attributes: { type: object, additionalProperties: true } } } } } }
    responses: { '201': { description: Created deal, content: { application/json: { schema: { type: object, properties: { payload: { $ref: '#/components/schemas/crm_deal' } } } } } }, '422': { description: Invalid deal, content: { application/json: { schema: { $ref: '#/components/schemas/crm_error' } } } }}
