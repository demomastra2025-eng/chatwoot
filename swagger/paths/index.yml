/api/v1/accounts/{account_id}/scheduling/appointments:
  parameters:
    - $ref: '#/components/parameters/account_id'
  get:
    tags: [Scheduling]
    operationId: list-scheduling-appointments
    summary: List appointments
    security:
      - userApiKey: []
    parameters:
      - in: query
        name: from
        schema: { type: string, format: date-time }
      - in: query
        name: to
        schema: { type: string, format: date-time }
      - in: query
        name: resource_ids
        schema: { type: string }
      - in: query
        name: contact_ids
        schema: { type: string }
        description: Comma-separated communication contact IDs.
      - in: query
        name: patient_contact_ids
        schema: { type: string }
        description: Comma-separated clinical patient IDs; legacy appointments fall back to contact_id.
      - in: query
        name: conversation_ids
        schema: { type: string }
      - in: query
        name: conversation_display_ids
        schema: { type: string }
      - in: query
        name: status
        schema: { type: string }
      - in: query
        name: custom_attribute_filters
        description: Deep-object map of managed appointment custom field keys to selected filter values or advanced operator payloads.
        style: deepObject
        explode: true
        schema:
          type: object
          additionalProperties: true
    responses:
      '200':
        description: Appointment list
        content:
          application/json:
            schema:
              type: object
              properties:
                payload:
                  type: array
                  items: *scheduling_appointment_schema
                meta: *scheduling_list_meta
      '403':
        description: Scheduling feature disabled
        content:
          application/json:
            schema: *scheduling_error_schema
  post:
    tags: [Scheduling]
    operationId: create-scheduling-appointment
    summary: Create a scheduling appointment
    description: Supports true idempotency via idempotency_key; a replay returns the existing appointment with HTTP 200. A selected patient_contact_id is separate from the communication contact. All automatic appointment deal creation, including cardinality clones, obeys appointment_automation.auto_create_deals independently of channel auto-create. crm_pipeline_id alone does not authorize creating a deal while the master is off; crm_deal_selection=create is an explicit manual choice. Valid account/contact-scoped existing deals may still be linked. Optional CRM validation or ambiguous-selection failures preserve the appointment and return crm_link_result.status=not_linked with an honest warning; do not retry appointment creation for this warning. Foreign or mismatched explicit links remain invalid. Provider command confirmation and interval availability checks still apply independently.
    security:
      - userApiKey: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [resource_id, starts_at]
            properties:
              resource_id: { type: integer }
              contact_id: { type: integer }
              patient_contact_id: { type: integer }
              crm_deal_id: { type: integer, minimum: 1, description: Existing deal in this account matching the appointment communication contact. Scope validation still applies with automatic creation off. }
              crm_pipeline_id: { type: integer, minimum: 1, description: Selects an account-owned pipeline for linkage; by itself it does not enable creation when auto_create_deals is false. }
              crm_deal_selection: { type: string, enum: [create], description: Explicit manual request to create a deal. Missing CRM required fields produce an optional crm_link_result warning after saving the appointment. }
              service_id: { type: integer }
              service_ids: { type: array, items: { type: integer } }
              company_id: { type: integer }
              conversation_id: { type: integer }
              conversation_display_id: { type: integer }
              created_by_id: { type: integer }
              starts_at: { type: string, format: date-time }
              ends_at: { type: string, format: date-time }
              duration_min: { type: integer, minimum: 5, maximum: 1440, description: Optional manual duration; ends_at or the service duration supplies the alternative end time. }
              status: { type: string }
              appointment_type: { type: string }
              client_name: { type: string }
              client_first_name: { type: string }
              client_last_name: { type: string }
              client_middle_name: { type: string }
              client_phone: { type: string }
              client_identifier: { type: string, description: Validates checksum when it looks like a 12-digit IIN }
              client_birth_date: { type: string, format: date }
              client_gender: { type: string }
              client_comment: { type: string }
              source: { type: string }
              external_ref: { type: string }
              idempotency_key: { type: string }
              service_amount: { type: integer }
              custom_attributes:
                type: object
                additionalProperties: true
                description: Free-form attributes by default. When active `appointment` field definitions exist for the account, unknown keys are rejected, field defaults may be applied on create, and deleted managed field values are removed on the next update while preserved system integration keys remain.
    responses:
      '200':
        description: Existing appointment returned for a replayed idempotency key, including any persisted optional CRM warning.
        content:
          application/json:
            schema:
              type: object
              properties:
                payload: *scheduling_appointment_schema
      '201':
        description: Appointment saved. Optional CRM failures appear in payload.crm_link_result and do not change this successful HTTP status; provider confirmation remains separate.
        content:
          application/json:
            schema:
              type: object
              properties:
                payload: *scheduling_appointment_schema
      '403':
        description: Scheduling feature disabled
        content:
          application/json:
            schema: *scheduling_error_schema
      '409':
        description: Slot conflict or duplicate key/reference
        content:
          application/json:
            schema: *scheduling_error_schema
      '422':
        description: Validation error, invalid IIN, or unavailable service/resource pair
        content:
          application/json:
            schema: *scheduling_error_schema

