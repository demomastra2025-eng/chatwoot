# Account-scoped CRM workspace APIs. Account and record policy checks apply to every operation.
/api/v1/accounts/{account_id}/crm/pipelines:
  parameters: [{ $ref: '#/components/parameters/account_id' }]
  get:
    tags: [CRM]
    operationId: list-crm-pipelines
    summary: List CRM pipelines and stages
    security: [{ userApiKey: [] }]
    responses: { '200': { description: Pipelines, content: { application/json: { schema: { type: object, properties: { payload: { type: array, items: { $ref: '#/components/schemas/crm_pipeline' } }, meta: { type: object } } } } } }}
  post:
    tags: [CRM]
    operationId: create-crm-pipeline
    summary: Create a CRM pipeline
    security: [{ userApiKey: [] }]
    requestBody: { required: true, content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/crm_pipeline_settings' }], type: object, required: [name] } } } }
    responses: { '201': { description: Created, content: { application/json: { schema: { type: object, properties: { payload: { $ref: '#/components/schemas/crm_pipeline' } } } } } }, '422': { description: Invalid pipeline, content: { application/json: { schema: { $ref: '#/components/schemas/crm_error' } } } } }
/api/v1/accounts/{account_id}/crm/pipelines/{id}:
  parameters: [{ $ref: '#/components/parameters/account_id' }, { in: path, name: id, required: true, schema: { type: integer } }]
  get:
    tags: [CRM]
    operationId: get-crm-pipeline
    summary: Get a CRM pipeline
    security: [{ userApiKey: [] }]
    responses: { '200': { description: Pipeline and stages, content: { application/json: { schema: { type: object, properties: { payload: { $ref: '#/components/schemas/crm_pipeline' } } } } } }}
  patch:
    tags: [CRM]
    operationId: update-crm-pipeline
    summary: Atomically save a CRM funnel draft
    description: Saves pipeline profile, movement rules, channel creation target, appointment creation master, stage edits, requirements, deletions and optional account pipeline order in one transaction. Existing IDs and new stage client_id references must belong to this account and draft. A failure rolls back every change. Omit stages for a partial settings update; including stages returns the selected payload plus full account pipelines for publishing defaults, source ownership and order. Incoming-channel auto-create never enables appointment creation. New and unconfigured appointment masters default off; explicit legacy calendar/integration opt-ins are normalized independently. Reasons apply only to lost stages; ordinary and won reasons are not required or retained as new stage settings.
    security: [{ userApiKey: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/crm_pipeline_save_payload' }
          example:
            name: Service requests
            active: true
            auto_create_deal_on_channel_contact: true
            auto_create_stage_id: draft-stage-1
            stages:
              - { id: 10, name: Review, color: '#2563eb', active: true }
              - { client_id: draft-stage-1, name: New requests, color: '#16a34a', active: true }
            deleted_stage_ids: []
            appointment_automation:
              auto_create_deals: false
              enabled: false
              auto_create_from_calendar: true
              rules:
                - { stage_id: draft-stage-1, scope: any, conditions: [scheduled] }
            pipeline_order: [1, 2]
    responses:
      '200':
        description: All changes saved; pipelines is included for a full stage draft.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/crm_pipeline_save_response' }
      '403': { description: Caller lacks CRM pipeline update permission or the CRM deals feature is unavailable. }
      '404': { description: Pipeline is outside the account policy scope. }
      '422':
        description: Invalid draft, required fields, blocked deletion, stage reference, auto-create target or pipeline order. No settings changes persist. Codes include INVALID_STAGE_REFERENCE, INVALID_AUTO_CREATE_STAGE and INVALID_PIPELINE_ORDER.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/crm_error' }
  delete:
    tags: [CRM]
    operationId: delete-crm-pipeline
    summary: Delete an empty pipeline
    description: Pipelines containing deals cannot be deleted.
    security: [{ userApiKey: [] }]
    responses: { '204': { description: Deleted }, '422': { description: Pipeline contains deals, content: { application/json: { schema: { $ref: '#/components/schemas/crm_error' } } } }}
/api/v1/accounts/{account_id}/crm/pipelines/{pipeline_id}/stages:
  parameters: [{ $ref: '#/components/parameters/account_id' }, { in: path, name: pipeline_id, required: true, schema: { type: integer } }]
  post:
    tags: [CRM]
    operationId: create-crm-stage
    summary: Create a pipeline stage
    description: Creates an ordinary open stage. System terminal stages are managed through the pipeline draft; ordinary stages have no transition or closing reasons. Save field requirements through their endpoint or the atomic pipeline draft.
    security: [{ userApiKey: [] }]
    requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string }, code: { type: string }, color: { type: string }, position: { type: integer }, active: { type: boolean }, default: { type: boolean, description: Legacy routing fallback selection. } } } } } }
    responses: { '201': { description: Created, content: { application/json: { schema: { type: object, properties: { payload: { $ref: '#/components/schemas/crm_stage' } } } } } }, '422': { description: Invalid stage, content: { application/json: { schema: { $ref: '#/components/schemas/crm_error' } } } }}
/api/v1/accounts/{account_id}/crm/pipelines/{pipeline_id}/stages/batch_update:
  parameters: [{ $ref: '#/components/parameters/account_id' }, { in: path, name: pipeline_id, required: true, schema: { type: integer } }]
  patch:
    tags: [CRM]
    operationId: batch-update-crm-stages
    summary: Atomically update a pipeline's stage list
    description: Submits the complete ordered movable stage list, optional terminal and technical settings, deletions and pipeline_rules together. Closing reasons apply only to the lost stage. System stages and stages referenced by deals remain subject to server validation. For one save that also includes channel and appointment automation settings, use PATCH crm/pipelines/{id}.
    security: [{ userApiKey: [] }]
    requestBody: { required: true, content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/crm_stage_draft' }, { type: object, required: [stages] }] } } } }
    responses: { '200': { description: Updated pipeline including all stages, content: { application/json: { schema: { type: object, properties: { payload: { $ref: '#/components/schemas/crm_pipeline' } } } } } }, '422': { description: Invalid stage set; all changes are rolled back, content: { application/json: { schema: { $ref: '#/components/schemas/crm_error' } } } } }

/api/v1/accounts/{account_id}/crm/stages/{id}:
  parameters: [{ $ref: '#/components/parameters/account_id' }, { in: path, name: id, required: true, schema: { type: integer } }]
  patch:
    tags: [CRM]
    operationId: update-crm-stage
    summary: Update a CRM stage
    description: Updates the permitted profile fields of a movable stage, the name of a terminal stage, or activity/color of a technical stage. Closing-reason settings are accepted only for the lost terminal stage. Ordinary transition-reason inputs and non-lost closing-reason inputs are ignored. Outcome and ordered position are not editable here; use the atomic pipeline draft for ordering and field requirements.
    security: [{ userApiKey: [] }]
    requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { name: { type: string }, code: { type: string }, color: { type: string }, active: { type: boolean }, default: { type: boolean, description: Legacy routing fallback selection for ordinary stages. }, closing_reason_options: { type: array, items: { type: string }, description: Available only for the lost terminal stage. }, closing_reason_required: { type: boolean, description: Available only for the lost terminal stage. } } } } } }
    responses: { '200': { description: Updated stage, content: { application/json: { schema: { type: object, properties: { payload: { $ref: '#/components/schemas/crm_stage' } } } } } }, '422': { description: Invalid stage update, content: { application/json: { schema: { $ref: '#/components/schemas/crm_error' } } } } }
  delete:
    tags: [CRM]
    operationId: delete-crm-stage
    summary: Delete an eligible stage
    security: [{ userApiKey: [] }]
    responses: { '204': { description: Deleted }, '422': { description: Stage cannot be deleted, content: { application/json: { schema: { $ref: '#/components/schemas/crm_error' } } } }}
/api/v1/accounts/{account_id}/crm/stages/{id}/deletion_check:
  parameters: [{ $ref: '#/components/parameters/account_id' }, { in: path, name: id, required: true, schema: { type: integer } }]
  get:
    tags: [CRM]
    operationId: check-crm-stage-deletion
    summary: Check whether a stage can be deleted
    security: [{ userApiKey: [] }]
    responses: { '200': { description: Deletion check result, content: { application/json: { schema: { type: object, properties: { payload: { type: object, additionalProperties: true } } } } } }}
/api/v1/accounts/{account_id}/crm/stages/{id}/field_requirements:
  parameters: [{ $ref: '#/components/parameters/account_id' }, { in: path, name: id, required: true, schema: { type: integer } }]
  patch:
    tags: [CRM]
    operationId: update-crm-stage-field-requirements
    summary: Update a stage's managed-field requirements
    security: [{ userApiKey: [] }]
    requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { field_requirements: { type: array, items: { type: object, properties: { field_key: { type: string }, required: { type: boolean }, validation: { type: object }, role_exemptions: { type: array, items: { type: string } } } } } } } } } }
    responses: { '200': { description: Updated stage, content: { application/json: { schema: { type: object, properties: { payload: { $ref: '#/components/schemas/crm_stage' } } } } } }, '422': { description: Invalid requirement, content: { application/json: { schema: { $ref: '#/components/schemas/crm_error' } } } } }

/api/v1/accounts/{account_id}/crm/task_statuses:
  parameters: [{ $ref: '#/components/parameters/account_id' }]
  get:
    tags: [CRM]
    operationId: list-crm-task-statuses
