  get:
    tags: [Scheduling]
    operationId: list-scheduling-appointments
    summary: List appointments
    security:
      - userApiKey: []
    parameters:
      - in: query
        name: from
        schema: { type: string, format: date-time }
      - in: query
        name: to
        schema: { type: string, format: date-time }
      - in: query
        name: resource_ids
        schema: { type: string }
      - in: query
        name: status
        schema: { type: string }
      - in: query
        name: payment_status
        schema: { type: string }
      - in: query
        name: custom_attribute_filters
        description: Deep-object map of managed appointment custom field keys to selected filter values or advanced operator payloads.
        style: deepObject
        explode: true
        schema:
          type: object
          additionalProperties: true
    responses:
      '200':
        description: Appointment list
        content:
          application/json:
            schema:
              type: object
              properties:
                payload:
                  type: array
                  items: *scheduling_appointment_schema
                meta: *scheduling_list_meta
      '403':
        description: Scheduling feature disabled
        content:
          application/json:
            schema: *scheduling_error_schema
  post:
    tags: [Scheduling]
    operationId: create-scheduling-appointment
    summary: Create a scheduling appointment
    description: Supports true idempotency via `idempotency_key`. Replaying the same key returns the existing appointment with HTTP 200.
    security:
      - userApiKey: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [resource_id, starts_at, ends_at, client_name]
            properties:
              resource_id: { type: integer }
              contact_id: { type: integer }
              service_id: { type: integer }
              company_id: { type: integer }
              conversation_id: { type: integer }
              created_by_id: { type: integer }
              starts_at: { type: string, format: date-time }
              ends_at: { type: string, format: date-time }
              duration_min: { type: integer }
              status: { type: string }
              appointment_type: { type: string }
              client_name: { type: string }
              client_phone: { type: string }
              client_identifier: { type: string, description: Validates checksum when it looks like a 12-digit IIN }
              client_birth_date: { type: string, format: date }
              client_gender: { type: string }
              client_comment: { type: string }
              source: { type: string }
              external_ref: { type: string }
              idempotency_key: { type: string }
              service_amount: { type: integer }
              prepaid_amount: { type: integer }
              prepaid_payment_method: { type: string }
              settlement_amount: { type: integer }
              settlement_payment_method: { type: string }
              payment_status: { type: string }
              custom_attributes:
                type: object
                additionalProperties: true
                description: Free-form attributes by default. When active `appointment` field definitions exist for the account, unknown keys are rejected, field defaults may be applied on create, and deleted managed field values are removed on the next update while preserved system integration keys remain.
    responses:
      '200':
        description: Existing appointment returned for a replayed idempotency key
        content:
          application/json:
            schema:
              type: object
              properties:
                payload: *scheduling_appointment_schema
      '201':
        description: Appointment created
        content:
          application/json:
            schema:
              type: object
              properties:
                payload: *scheduling_appointment_schema
      '403':
        description: Scheduling feature disabled
        content:
          application/json:
            schema: *scheduling_error_schema
      '409':
        description: Slot conflict or duplicate key/reference
        content:
          application/json:
            schema: *scheduling_error_schema
      '422':
        description: Validation error, invalid IIN, or unavailable service/resource pair
        content:
          application/json:
            schema: *scheduling_error_schema

