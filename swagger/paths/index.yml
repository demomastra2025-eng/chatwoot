  parameters: [{ $ref: '#/components/parameters/account_id' }, { in: path, name: id, required: true, schema: { type: integer } }]
  post:
    tags: [CRM]
    operationId: close-crm-deal-won
    summary: Close a deal as won
    description: Closes the deal in the won stage while retaining normal required-field and stale-write validation. Winning never requires or saves closing reasons; legacy closing_reasons input is ignored. Historical loss reasons in earlier events are preserved.
    security: [{ userApiKey: [] }]
    requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { lock_version: { type: integer }, idempotency_key: { type: string }, event_id: { type: string } } } } } }
    responses: { '200': { description: Won deal with no closing reasons, content: { application/json: { schema: { type: object, properties: { payload: { $ref: '#/components/schemas/crm_deal' } } } } } }, '422': { description: Required stage fields or other deal validation failed, content: { application/json: { schema: { $ref: '#/components/schemas/crm_error' } } } }}
