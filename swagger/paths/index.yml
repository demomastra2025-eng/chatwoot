  post:
    tags: [CRM]
    operationId: create-crm-pipeline
    summary: Create a CRM pipeline
    security: [{ userApiKey: [] }]
    requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { name: { type: string }, code: { type: string }, position: { type: integer }, active: { type: boolean }, default: { type: boolean }, auto_create_deal_on_channel_contact: { type: boolean }, restrict_stage_skipping: { type: boolean }, restrict_backward_move: { type: boolean }, allow_stage_rule_override: { type: boolean }, stages: { type: array, items: { type: object } } } } } } }
