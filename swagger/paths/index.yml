    description: Admin-only. Requires confirmed=true and the matching, unexpired preview token. Items remain in physical usage during the 30-day retention period.
    security: [{ userApiKey: [] }]
    requestBody: { required: true, content: { application/json: { schema: { type: object, required: [confirmed, preview_token], properties: { confirmed: { type: boolean, enum: [true] }, preview_token: { type: string }, file_type: { type: string, enum: [all, recordings, attachments] }, older_than_months: { type: integer }, inbox_id: { type: integer } } } } } }
    responses: { '200': { description: Moved and pending byte counts, content: { application/json: { schema: { type: object, additionalProperties: true } } } }, '422': { description: Invalid confirmation or preview manifest } }
/api/v1/accounts/{account_id}/storage/trash:
  parameters: [{ $ref: '#/components/parameters/account_id' }]
  get:
    tags: [Account Storage]
    operationId: list-account-storage-trash
    summary: List trashed storage items
    security: [{ userApiKey: [] }]
    parameters: [{ in: query, name: page, schema: { type: integer, default: 1 } }, { in: query, name: limit, schema: { type: integer, default: 50 } }]
    responses: { '200': { description: Paginated items and bytes, content: { application/json: { schema: { type: object, properties: { total_count: { type: integer }, total_bytes: { type: integer }, page: { type: integer }, limit: { type: integer }, items: { type: array, items: { $ref: '#/components/schemas/crm_storage_trash_item' } } } } } }}}
/api/v1/accounts/{account_id}/storage/restore_trash:
  parameters: [{ $ref: '#/components/parameters/account_id' }]
  post:
    tags: [Account Storage]
    operationId: restore-account-storage-trash
    summary: Restore items from account trash
    description: Admin-only. Restore all items or one item by specifying both item_type and item_id.
    security: [{ userApiKey: [] }]
    requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { restore_all: { type: boolean }, item_type: { type: string, enum: [recording, attachment] }, item_id: { type: string } } } } } }
    responses: { '200': { description: Restored item and byte counts, content: { application/json: { schema: { type: object, additionalProperties: true } } } }, '422': { description: Invalid restore target } }
/api/v1/accounts/{account_id}/storage/empty_trash:
  parameters: [{ $ref: '#/components/parameters/account_id' }]
  delete:
    tags: [Account Storage]
    operationId: purge-account-storage-trash
    summary: Permanently purge storage trash
    description: Admin-only and requires confirmed=true. With no item target, purges all trash; a single item requires both item_type and item_id.
    security: [{ userApiKey: [] }]
    parameters: [{ in: query, name: confirmed, required: true, schema: { type: boolean, enum: [true] } }, { in: query, name: item_type, schema: { type: string, enum: [recording, attachment] } }, { in: query, name: item_id, schema: { type: string } }]
    responses: { '200': { description: Purged items and freed bytes, content: { application/json: { schema: { type: object, additionalProperties: true } } } }, '422': { description: Invalid selection or missing confirmation } }

# Per-assistant model, tools, follow-up and outcome settings are stored through this existing API.
/api/v1/accounts/{account_id}/captain/assistants:
  parameters: [{ $ref: '#/components/parameters/account_id' }]
  get:
    tags: [Captain Assistants]
    operationId: list-captain-assistants
    summary: List account Captain assistants
    security: [{ userApiKey: [] }]
    responses: { '200': { description: Assistants with count metadata, content: { application/json: { schema: { $ref: '#/components/schemas/captain_assistants_response' } } } } }
  post:
    tags: [Captain Assistants]
    operationId: create-captain-assistant
    summary: Create an account Captain assistant
    description: Creates an assistant using the existing account-scoped API. Model, tool access, follow-up, outcome reasons, response guidelines, and guardrails can be supplied with the assistant.
    security: [{ userApiKey: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/captain_assistant_payload' }
    responses: { '200': { description: Created assistant configuration, content: { application/json: { schema: { $ref: '#/components/schemas/captain_assistant' } } } }, '422': { description: Invalid assistant configuration } }
/api/v1/accounts/{account_id}/captain/assistants/{id}:
  parameters: [{ $ref: '#/components/parameters/account_id' }, { in: path, name: id, required: true, schema: { type: integer } }]
  get:
    tags: [Captain Assistants]
    operationId: get-captain-assistant
    summary: Get an account Captain assistant
    security: [{ userApiKey: [] }]
    responses: { '200': { description: Assistant configuration, content: { application/json: { schema: { $ref: '#/components/schemas/captain_assistant' } } } }, '404': { description: Assistant not found } }
  patch:
    tags: [Captain Assistants]
    operationId: update-captain-assistant
    summary: Update an account Captain assistant
    description: Select model and update tool access, follow-up, outcome reason, and runtime safety settings inside the existing assistant.config object. Omitted safety fields retain saved overrides during a partial update; explicit null resets a safety field to inheritance from the workspace policy. Unspecified safety fields on a new assistant inherit workspace policy. Follow-ups use native reminders; disabling them cancels that assistant's open reminders.
    security: [{ userApiKey: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [assistant]
            properties:
              assistant:
                type: object
                properties:
                  name: { type: string }
                  description: { type: string }
                  usage_mode: { type: string, enum: [external_agent, internal_assistant] }
                  config:
                    type: object
                    properties:
                      model: { type: string }
                      safety_settings: { $ref: '#/components/schemas/captain_assistant_safety_settings' }
                      feature_faq: { type: boolean }
                      feature_memory: { type: boolean }
                      feature_citation: { type: boolean }
                      feature_web: { type: boolean }
                      feature_document_reading: { type: boolean }
                      feature_image_understanding: { type: boolean }
                      handoff_enabled: { type: boolean }
                      auto_completion_enabled: { type: boolean }
                      auto_reply_on_last_incoming: { type: boolean }
                      use_audio_transcriptions: { type: boolean }
                      tool_access: { type: object, additionalProperties: true }
                      follow_up_settings: { type: object, additionalProperties: true }
                      outcome_reason_settings: { type: object, additionalProperties: true }
                      context_access: { type: object, additionalProperties: true }
                      voice_settings: { type: object, additionalProperties: true }
                      rules: { type: object, additionalProperties: true }
                    additionalProperties: true
                additionalProperties: true
    responses: { '200': { description: Updated assistant configuration, content: { application/json: { schema: { type: object, additionalProperties: true } } } }, '422': { description: Invalid assistant configuration } }
  delete:
    tags: [Captain Assistants]
    operationId: delete-captain-assistant
    summary: Delete an account Captain assistant
    security: [{ userApiKey: [] }]
    responses: { '204': { description: Deleted }, '404': { description: Assistant not found } }
/api/v1/accounts/{account_id}/captain/assistants/{id}/playground:
  parameters: [{ $ref: '#/components/parameters/account_id' }, { in: path, name: id, required: true, schema: { type: integer } }]
  post:
    tags: [Captain Assistants]
    operationId: test-captain-assistant-playground
    summary: Run one assistant playground request
    description: Per-request model, temperature, and reasoning-effort overrides are validated against the existing model registry and are never persisted. The internal assistant playground is feature-gated and, when enabled, rejects these controls. Response latency is measured end-to-end; reasoning-token usage is returned only if reported by the provider.
    security: [{ userApiKey: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/captain_assistant_playground_request' }
    responses:
      '200':
        description: Assistant response and available runtime metrics
        content:
          application/json:
            schema: { $ref: '#/components/schemas/captain_assistant_playground_response' }
      '422':
        description: Unsupported or invalid per-request override
        content:
          application/json:
            schema:
              type: object
              required: [error, field]
              properties:
                error: { type: string, enum: [unsupported_playground_setting] }
                field: { type: string, enum: [test_model, test_temperature, test_thinking_effort] }
      '410':
        description: The internal assistant playground is not enabled
