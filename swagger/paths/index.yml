  parameters: [{ $ref: '#/components/parameters/account_id' }, { in: path, name: id, required: true, schema: { type: integer } }]
  get:
    tags: [CRM]
    operationId: get-crm-deal-timeline
    summary: Get CRM deal timeline
    description: Returns the retained event history. Ordinary stage-transition reasons are no longer recorded, and previously stored transition_reason metadata is removed without deleting events, notes, timestamps, actors or loss-reason history.
    security: [{ userApiKey: [] }]
    parameters: [{ in: query, name: before, schema: { type: string } }, { in: query, name: limit, schema: { type: integer } }]
    responses: { '200': { description: Events and pagination metadata, content: { application/json: { schema: { type: object, properties: { payload: { type: array, items: { type: object } }, meta: { type: object } } } } } }}

/api/v1/accounts/{account_id}/crm/deals/{id}/transition_stage:
  parameters: [{ $ref: '#/components/parameters/account_id' }, { in: path, name: id, required: true, schema: { type: integer } }]
  post:
    tags: [CRM]
    operationId: transition-crm-deal-stage
    summary: Transition a deal between stages
    description: Stage policy validates stage-skipping/backward moves and required target-stage fields. Closing reasons are validated only when moving to a lost stage; won and ordinary stages never require or retain new reasons. Legacy transition_reason input is ignored and is not recorded. Override remains available only where pipeline rules permit.
    security: [{ userApiKey: [] }]
    requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { stage_id: { type: integer }, position: { type: integer }, lock_version: { type: integer }, idempotency_key: { type: string }, event_id: { type: string }, override: { type: boolean }, override_reason: { type: string }, closing_reasons: { type: array, items: { type: string }, description: Loss reasons; applies only when the target stage is lost. } } } } } }
    responses: { '200': { description: Deal after transition, content: { application/json: { schema: { type: object, properties: { payload: { $ref: '#/components/schemas/crm_deal' } } } } } }, '409': { description: Stale state or idempotency conflict, content: { application/json: { schema: { $ref: '#/components/schemas/crm_error' } } } }, '422': { description: Transition or reason rejected, content: { application/json: { schema: { $ref: '#/components/schemas/crm_error' } } } }}
