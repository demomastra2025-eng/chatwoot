    responses: { '200': { description: File list, content: { application/json: { schema: { type: object, properties: { files: { type: array, items: { $ref: '#/components/schemas/crm_storage_file' } } } } } } }, '422': { description: Invalid filter, content: { application/json: { schema: { type: object, properties: { message: { type: string } } } } }}}
/api/v1/accounts/{account_id}/storage/refresh:
  parameters: [{ $ref: '#/components/parameters/account_id' }]
  post:
    tags: [Account Storage]
    operationId: refresh-account-storage
    summary: Refresh account storage usage
    security: [{ userApiKey: [] }]
    responses: { '200': { description: Updated storage summary, content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, storage: { $ref: '#/components/schemas/crm_storage_summary' } } } } } }, '403': { description: Account administrator access required } }
/api/v1/accounts/{account_id}/storage/preview_cleanup:
  parameters: [{ $ref: '#/components/parameters/account_id' }]
  post:
    tags: [Account Storage]
    operationId: preview-account-storage-cleanup
    summary: Preview storage cleanup
    description: Admin-only read-only preview. Defaults to items older than six months and returns an actor/account-bound token for the exact manifest; token expires after five minutes.
    security: [{ userApiKey: [] }]
    requestBody: { required: false, content: { application/json: { schema: { type: object, properties: { file_type: { type: string, enum: [all, recordings, attachments] }, older_than_months: { type: integer, default: 6 }, inbox_id: { type: integer } } } } } }
    responses: { '200': { description: 'Preview count, bytes, sample and confirmation_token', content: { application/json: { schema: { type: object, additionalProperties: true } } } }, '422': { description: Invalid cleanup filter } }
/api/v1/accounts/{account_id}/storage/move_to_trash:
  parameters: [{ $ref: '#/components/parameters/account_id' }]
  post:
    tags: [Account Storage]
    operationId: move-account-storage-to-trash
    summary: Move previewed storage items to trash
    description: Admin-only. Requires confirmed=true and the matching, unexpired preview token. Items remain in physical usage during the 30-day retention period.
    security: [{ userApiKey: [] }]
    requestBody: { required: true, content: { application/json: { schema: { type: object, required: [confirmed, preview_token], properties: { confirmed: { type: boolean, enum: [true] }, preview_token: { type: string }, file_type: { type: string, enum: [all, recordings, attachments] }, older_than_months: { type: integer }, inbox_id: { type: integer } } } } } }
    responses: { '200': { description: Moved and pending byte counts, content: { application/json: { schema: { type: object, additionalProperties: true } } } }, '422': { description: Invalid confirmation or preview manifest } }
/api/v1/accounts/{account_id}/storage/trash:
  parameters: [{ $ref: '#/components/parameters/account_id' }]
  get:
    tags: [Account Storage]
    operationId: list-account-storage-trash
    summary: List trashed storage items
    security: [{ userApiKey: [] }]
    parameters: [{ in: query, name: page, schema: { type: integer, default: 1 } }, { in: query, name: limit, schema: { type: integer, default: 50 } }]
    responses: { '200': { description: Paginated items and bytes, content: { application/json: { schema: { type: object, properties: { total_count: { type: integer }, total_bytes: { type: integer }, page: { type: integer }, limit: { type: integer }, items: { type: array, items: { $ref: '#/components/schemas/crm_storage_trash_item' } } } } } }}}
/api/v1/accounts/{account_id}/storage/restore_trash:
  parameters: [{ $ref: '#/components/parameters/account_id' }]
  post:
    tags: [Account Storage]
    operationId: restore-account-storage-trash
    summary: Restore items from account trash
    description: Admin-only. Restore all items or one item by specifying both item_type and item_id.
    security: [{ userApiKey: [] }]
    requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { restore_all: { type: boolean }, item_type: { type: string, enum: [recording, attachment] }, item_id: { type: string } } } } } }
    responses: { '200': { description: Restored item and byte counts, content: { application/json: { schema: { type: object, additionalProperties: true } } } }, '422': { description: Invalid restore target } }
/api/v1/accounts/{account_id}/storage/empty_trash:
  parameters: [{ $ref: '#/components/parameters/account_id' }]
  delete:
    tags: [Account Storage]
    operationId: purge-account-storage-trash
    summary: Permanently purge storage trash
    description: Admin-only and requires confirmed=true. With no item target, purges all trash; a single item requires both item_type and item_id.
    security: [{ userApiKey: [] }]
    parameters: [{ in: query, name: confirmed, required: true, schema: { type: boolean, enum: [true] } }, { in: query, name: item_type, schema: { type: string, enum: [recording, attachment] } }, { in: query, name: item_id, schema: { type: string } }]
    responses: { '200': { description: Purged items and freed bytes, content: { application/json: { schema: { type: object, additionalProperties: true } } } }, '422': { description: Invalid selection or missing confirmation } }

# Independent agents and their explicit account-scoped routes use the existing assistant API.
/api/v1/accounts/{account_id}/captain/assistants:
  parameters: [{ $ref: '#/components/parameters/account_id' }]
  get:
    tags: [Captain Assistants]
    operationId: list-captain-assistants
    summary: List account Captain assistants
    description: Returns each agent's main prompt in description and normalized read-only outcome_reason_options. Separate response_guidelines, guardrails, config.rules and config.skills are not returned.
    security: [{ userApiKey: [] }]
    responses: { '200': { description: Assistants with count metadata, content: { application/json: { schema: { $ref: '#/components/schemas/captain_assistants_response' } } } } }
  post:
    tags: [Captain Assistants]
    operationId: create-captain-assistant
    summary: Create an account Captain assistant
    description: Creates an independent agent in this account with its own prompt in assistant.description, model, tools and settings. active and routing_description are top-level assistant fields. The agents a channel can transfer to and its main agent are set on the channel grid (captain/channel_matrix), not on the agent. Safety checks are one workspace setting (captain/settings, section safety); config.safety_settings is ignored. response_guidelines, guardrails or config.rules writes are rejected with 422 separate_rules_removed before saving. config.skills is no longer permitted and is ignored. Responses exclude these separate instruction fields and include normalized outcome_reason_options.
    security: [{ userApiKey: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/captain_assistant_payload' }
    responses:
      '200':
        description: Created assistant configuration
        content:
          application/json:
            schema: { $ref: '#/components/schemas/captain_assistant' }
      '422':
        description: Invalid configuration or a removed separate instruction field; no assistant is created.
        content:
          application/json:
            schema:
              anyOf:
                - { $ref: '#/components/schemas/captain_removed_rules_error' }
                - { type: object, additionalProperties: true }
/api/v1/accounts/{account_id}/captain/assistants/{id}:
  parameters: [{ $ref: '#/components/parameters/account_id' }, { in: path, name: id, required: true, schema: { type: integer } }]
  get:
    tags: [Captain Assistants]
    operationId: get-captain-assistant
    summary: Get an account Captain assistant
    description: Returns the main prompt in description and normalized outcome_reason_options, including built-in completion and handoff reasons. Separate response_guidelines, guardrails, config.rules and config.skills are not returned.
    security: [{ userApiKey: [] }]
    responses: { '200': { description: Assistant configuration, content: { application/json: { schema: { $ref: '#/components/schemas/captain_assistant' } } } }, '404': { description: Assistant not found } }
  patch:
    tags: [Captain Assistants]
    operationId: update-captain-assistant
    summary: Update an account Captain assistant
    description: Saves the agent's own prompt in assistant.description, activity, routing description and configuration together. The agents a channel can transfer to are set on the channel grid (captain/channel_matrix); a handoff_agent_ids value is ignored and the stored legacy list restricts nothing. A validation failure rolls back the complete settings save. Model, tools, follow-ups and outcome reasons belong inside assistant.config. Safety checks are one workspace setting (captain/settings, section safety); config.safety_settings is ignored and any value stored on the agent is left as it is. Disabling follow-ups cancels this agent's open reminders. response_guidelines, guardrails or config.rules writes are rejected with 422 separate_rules_removed before saving. config.skills is no longer permitted and is ignored. Responses exclude these separate instruction fields and include normalized outcome_reason_options.
    security: [{ userApiKey: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [assistant]
            properties:
              assistant:
                type: object
                properties:
                  name: { type: string }
                  description: { type: string, nullable: true, description: This agent's own main prompt. }
                  usage_mode: { type: string, enum: [external_agent, internal_assistant] }
                  active: { type: boolean, description: Only active external agents are eligible for channel entry or handoff routing. }
                  routing_description: { type: string, nullable: true, maxLength: 2000 }

                  config:
                    type: object
                    properties:
                      model: { type: string }
                      feature_faq: { type: boolean }
                      feature_memory: { type: boolean }
                      feature_citation: { type: boolean }
                      feature_web: { type: boolean }
                      feature_document_reading: { type: boolean }
                      feature_image_understanding: { type: boolean }
                      handoff_enabled: { type: boolean }
                      auto_completion_enabled: { type: boolean }
                      auto_reply_on_last_incoming: { type: boolean }
                      use_audio_transcriptions: { type: boolean }
                      tool_access: { type: object, additionalProperties: true }
                      follow_up_settings: { type: object, additionalProperties: true }
                      outcome_reason_settings: { $ref: '#/components/schemas/captain_outcome_reason_settings' }
                      context_access: { type: object, additionalProperties: true }
                      voice_settings: { type: object, additionalProperties: true }
                    additionalProperties: true
                additionalProperties: true
    responses:
      '200':
        description: Saved agent configuration and routes
        content:
          application/json:
            schema: { $ref: '#/components/schemas/captain_assistant' }
      '422':
        description: Invalid configuration or a removed separate instruction field; no settings changes are saved.
        content:
          application/json:
            schema:
              anyOf:
                - { $ref: '#/components/schemas/captain_removed_rules_error' }
                - { type: object, additionalProperties: true }
  delete:
    tags: [Captain Assistants]
    operationId: delete-captain-assistant
    summary: Delete an account Captain assistant
    security: [{ userApiKey: [] }]
    responses: { '204': { description: Deleted }, '404': { description: Assistant not found } }
/api/v1/accounts/{account_id}/captain/assistants/{id}/playground:
  parameters: [{ $ref: '#/components/parameters/account_id' }, { in: path, name: id, required: true, schema: { type: integer } }]
  post:
    tags: [Captain Assistants]
    operationId: test-captain-assistant-playground
    summary: Run one assistant playground request
    description: External agents use server-owned workspace sessions with a synthetic caller and account-scoped routing. Real-data permissions start disabled; the permissions action enables reads or previews of real changes under the current operator's access. Every real change requires a confirm request bound to the unchanged preview, session and acting agent. External delivery is unavailable. Session, reset and permissions actions do not generate a message. Message responses expose the acting agent and any task queue results. Per-request model, temperature and reasoning controls are validated and never saved; the internal assistant playground is feature-gated and rejects those overrides. Latency is measured; reasoning tokens are returned only when reported by the provider.
    security: [{ userApiKey: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/captain_assistant_playground_request' }
    responses:
      '200':
        description: Message response, session state, confirmed action result or timeout response
        content:
          application/json:
            schema: { $ref: '#/components/schemas/captain_assistant_playground_response' }
      '422':
        description: Invalid scenario, action, expired preview, legacy live mode or unsupported per-request override
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [error, field]
                  properties:
                    error: { type: string, enum: [unsupported_playground_setting] }
                    field: { type: string, enum: [test_model, test_temperature, test_thinking_effort] }
                - type: object
                  required: [error, message]
                  properties:
                    error: { type: string, enum: [invalid_playground_scenario] }
                    message: { type: string }
      '403':
        description: Workspace, acting agent, tool or real-record access is not authorized
        content:
          application/json:
            schema:
              type: object
              required: [error]
              properties:
                error: { type: string, enum: [playground_live_forbidden] }
      '409':
        description: Session is already running, expired or changed
        content:
          application/json:
            schema:
              type: object
              required: [error, message]
              properties:
                error: { type: string, enum: [playground_session_conflict] }
                message: { type: string }
      '410':
        description: The internal assistant playground is not enabled
