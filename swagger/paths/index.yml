/api/v1/accounts/{account_id}/crm/deals/appointment_options:
  parameters: [{ $ref: '#/components/parameters/account_id' }]
  get:
    tags: [CRM]
    operationId: get-crm-appointment-deal-options
    summary: Resolve active deal choices for a communication contact
    description: Candidates are scoped to the account and contact. A single candidate or an eligible source deal is automatic; multiple candidates require a choice. Clinical patient changes do not change the communication contact or the conversation.
    security: [{ userApiKey: [] }]
    parameters:
      - { in: query, name: contact_id, schema: { type: integer } }
      - { in: query, name: conversation_display_id, schema: { type: integer } }
      - { in: query, name: source_deal_id, schema: { type: integer } }
    responses:
      '200':
        description: Active candidates and available pipelines
        content:
          application/json:
            schema:
              type: object
              properties:
                payload:
                  type: object
                  properties:
                    automatic_deal_id: { type: integer, nullable: true }
                    requires_selection: { type: boolean }
                    deals:
                      type: array
                      maxItems: 100
                      items:
                        type: object
                        properties:
                          id: { type: integer }
                          title: { type: string }
                          pipeline_id: { type: integer }
                          pipeline_name: { type: string }
                          cardinality: { type: string, enum: [request, appointment] }
                    pipelines:
                      type: array
                      items:
                        type: object
                        properties:
                          id: { type: integer }
                          name: { type: string }
                          auto_create: { type: boolean }
                          default: { type: boolean }
      '403': { description: Caller lacks CRM deal visibility }
      '404': { description: Account contact or conversation not found }
      '422': { description: Conversation and contact do not match }

/api/v1/accounts/{account_id}/crm/deals/{id}/appointments:
