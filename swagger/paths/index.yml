            schema:
              type: object
              properties:
                payload: { type: array, items: *scheduling_appointment_schema }
                meta: { type: object, properties: { timezone: { type: string } } }
      '403': { description: Caller lacks access to the deal }
      '404': { description: Deal not found }

/api/v1/accounts/{account_id}/crm/deals/{id}/appointment_plan:
  parameters: [{ $ref: '#/components/parameters/account_id' }, { in: path, name: id, required: true, schema: { type: integer } }]
  patch:
    tags: [CRM]
    operationId: update-crm-deal-appointment-plan
    summary: Set required visits and the selected target appointment
    description: Accepts only appointments already linked to this deal. Omitting a plan preserves it; an empty array clears it. An ordinary new booking after cancellation does not infer a replacement.
    security: [{ userApiKey: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [lock_version]
            properties:
              lock_version: { type: integer }
              selected_appointment_id: { type: integer, nullable: true }
              appointment_plan: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/crm_appointment_plan_item' } }
    responses:
      '200': { description: Updated deal, content: { application/json: { schema: { type: object, properties: { payload: { $ref: '#/components/schemas/crm_deal' } } } } } }
      '403': { description: Caller lacks permission to update the deal }
      '404': { description: Deal not found }
      '409': { description: Stale lock version }
      '422': { description: Invalid plan or unrelated appointment }

/api/v1/accounts/{account_id}/crm/deals/{id}/resume_appointment_automation:
