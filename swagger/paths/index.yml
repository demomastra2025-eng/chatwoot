# Accounts
/api/v1/accounts/{account_id}:
  parameters:
    - $ref: '#/components/parameters/account_id'
  get:
    $ref: ./application/accounts/show.yml
  patch:
    $ref: ./application/accounts/update.yml

# Scheduling
/api/v1/accounts/{account_id}/scheduling/calendar:
  parameters:
    - $ref: '#/components/parameters/account_id'
  get:
    tags: [Scheduling]
    operationId: get-scheduling-calendar
    summary: Get scheduling calendar payload
    description: Returns the native scheduling payload used by day, week, month, and list calendar views.
    security:
      - userApiKey: []
    parameters:
      - in: query
        name: view
        schema:
          type: string
          enum: [day, week, month, list]
          default: week
      - in: query
        name: from
        required: true
        schema: { type: string, format: date-time }
      - in: query
        name: to
        required: true
        schema: { type: string, format: date-time }
      - in: query
        name: resource_ids
        description: Comma-separated resource ids
        schema: { type: string }
      - in: query
        name: include_slots
        schema: { type: boolean, default: false }
      - in: query
        name: duration_min
        schema: { type: integer, minimum: 5 }
      - in: query
        name: custom_attribute_filters
        description: Deep-object map of managed appointment custom field keys to selected filter values or advanced operator payloads.
        style: deepObject
        explode: true
        schema:
          type: object
          additionalProperties: true
    responses:
      '200':
        description: Calendar payload
        content:
          application/json:
            schema:
              type: object
              properties:
                payload:
                  type: object
                  properties:
                    view: { type: string }
                    range:
                      type: object
                      additionalProperties: true
                    resources:
                      type: array
                      items: *scheduling_resource_schema
                    work_rules:
                      type: array
                      items: *scheduling_rule_schema
                    break_rules:
                      type: array
                      items: *scheduling_break_rule_schema
                    holidays:
                      type: array
                      items: *scheduling_holiday_schema
                    workday_overrides:
                      type: array
                      items: *scheduling_workday_override_schema
                    time_offs:
                      type: array
                      items: *scheduling_time_off_schema
                    appointments:
                      type: array
                      items: *scheduling_appointment_schema
                    payments:
                      type: array
                      items: *scheduling_payment_schema
                    expenses:
                      type: array
                      items: *scheduling_expense_schema
                    slots:
                      type: array
                      items:
                        type: object
                        additionalProperties: true
      '403':
        description: Scheduling feature is disabled for the account
        content:
          application/json:
            schema: *scheduling_error_schema
      '422':
        description: Invalid view or date-range params
        content:
          application/json:
            schema: *scheduling_error_schema

/api/v1/accounts/{account_id}/scheduling/resources:
  parameters:
    - $ref: '#/components/parameters/account_id'
  get:
    tags: [Scheduling]
    operationId: list-scheduling-resources
    summary: List scheduling resources
    security:
      - userApiKey: []
    parameters:
      - in: query
        name: include_inactive
        schema: { type: boolean, default: false }
    responses:
      '200':
        description: Resource list
        content:
          application/json:
            schema:
              type: object
              properties:
                payload:
                  type: array
                  items: *scheduling_resource_schema
                meta: *scheduling_list_meta
      '403':
        description: Scheduling feature is disabled
        content:
          application/json:
            schema: *scheduling_error_schema
  post:
    tags: [Scheduling]
    operationId: create-scheduling-resource
    summary: Create a scheduling resource
    security:
      - userApiKey: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name: { type: string }
              specialty: { type: string }
              photo_url: { type: string }
              description: { type: string }
              color: { type: string }
              timezone: { type: string }
              slot_duration_min: { type: integer }
              compensation_type: { type: string }
              compensation_value: { type: integer }
              compensation_percent: { type: integer }
              active: { type: boolean }
              user_id: { type: integer }
              custom_attributes:
                type: object
                additionalProperties: true
    responses:
      '201':
        description: Resource created
        content:
          application/json:
            schema:
              type: object
              properties:
                payload: *scheduling_resource_schema
      '403':
        description: Scheduling feature disabled or caller is not an admin
        content:
          application/json:
            schema: *scheduling_error_schema
      '422':
        description: Invalid resource payload
        content:
          application/json:
            schema: *scheduling_error_schema

