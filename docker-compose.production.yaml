#
# Production Docker stack for Onelink.
# If Evolution API runs in a separate compose project, keep both stacks on the
# same external SHARED_SERVICES_NETWORK so `evolution-api`, `chatwoot-postgres`,
# and `chatwoot-redis` resolve across compose projects.
#
x-base: &base
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      args:
        BUNDLE_WITHOUT: 'development:test'
        EXECJS_RUNTIME: 'Disabled'
        RAILS_ENV: 'production'
        RAILS_SERVE_STATIC_FILES: 'true'
    image: ${CW_IMAGE:-onelink:production}
    env_file: .env ## Change this file for customized env variables
    volumes:
      - storage_data:/app/storage

services:

  rails:
    <<: *base
    depends_on:
      - postgres
      - redis
      - telegram-personal-gateway
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - CW_AUTO_PREPARE_DB=${CW_AUTO_PREPARE_DB:-true}
      - TELEGRAM_PERSONAL_GATEWAY_URL=${TELEGRAM_PERSONAL_GATEWAY_URL:-http://telegram-personal-gateway:8000}
      - TELEGRAM_PERSONAL_GATEWAY_TOKEN=${TELEGRAM_PERSONAL_GATEWAY_TOKEN:-replace_with_strong_shared_gateway_token}
      - KASPI_PAY_ADAPTER_URL=${KASPI_PAY_ADAPTER_URL:-http://kaspi_pay_adapter:4077}
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    networks:
      default:
      shared-services:
        aliases:
          - chatwoot-app
    restart: always

  sidekiq:
    <<: *base
    depends_on:
      - postgres
      - redis
      - telegram-personal-gateway
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - CW_AUTO_PREPARE_DB=false
      - TELEGRAM_PERSONAL_GATEWAY_URL=${TELEGRAM_PERSONAL_GATEWAY_URL:-http://telegram-personal-gateway:8000}
      - TELEGRAM_PERSONAL_GATEWAY_TOKEN=${TELEGRAM_PERSONAL_GATEWAY_TOKEN:-replace_with_strong_shared_gateway_token}
      - KASPI_PAY_ADAPTER_URL=${KASPI_PAY_ADAPTER_URL:-http://kaspi_pay_adapter:4077}
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    networks:
      - default
      - shared-services
    restart: always

  telegram-inbound-worker:
    <<: *base
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - CW_AUTO_PREPARE_DB=false
      - ENABLE_SIDEKIQ_CRON=false
      - DISABLE_SIDEKIQ_ALIVE=true
      - TELEGRAM_INBOUND_SIDEKIQ_CONCURRENCY=${TELEGRAM_INBOUND_SIDEKIQ_CONCURRENCY:-2}
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq_telegram_inbound.yml']
    networks:
      - default
      - shared-services
    restart: always

  telegram-personal-inbound-worker:
    <<: *base
    depends_on:
      - postgres
      - redis
      - telegram-personal-gateway
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - CW_AUTO_PREPARE_DB=false
      - ENABLE_SIDEKIQ_CRON=false
      - DISABLE_SIDEKIQ_ALIVE=true
      - TELEGRAM_PERSONAL_GATEWAY_URL=${TELEGRAM_PERSONAL_GATEWAY_URL:-http://telegram-personal-gateway:8000}
      - TELEGRAM_PERSONAL_GATEWAY_TOKEN=${TELEGRAM_PERSONAL_GATEWAY_TOKEN:-replace_with_strong_shared_gateway_token}
      - TELEGRAM_PERSONAL_INBOUND_SIDEKIQ_CONCURRENCY=${TELEGRAM_PERSONAL_INBOUND_SIDEKIQ_CONCURRENCY:-2}
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq_telegram_personal_inbound.yml']
    networks:
      - default
      - shared-services
    restart: always

  whatsapp-calls-worker:
    <<: *base
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - CW_AUTO_PREPARE_DB=false
      - ENABLE_SIDEKIQ_CRON=false
      - DISABLE_SIDEKIQ_ALIVE=true
      - WHATSAPP_CALLS_SIDEKIQ_CONCURRENCY=${WHATSAPP_CALLS_SIDEKIQ_CONCURRENCY:-1}
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq_whatsapp_calls.yml']
    networks:
      - default
      - shared-services
    restart: always

  telegram-personal-history-worker:
    <<: *base
    depends_on:
      - postgres
      - redis
      - telegram-personal-gateway
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - CW_AUTO_PREPARE_DB=false
      - TELEGRAM_PERSONAL_GATEWAY_URL=${TELEGRAM_PERSONAL_GATEWAY_URL:-http://telegram-personal-gateway:8000}
      - TELEGRAM_PERSONAL_GATEWAY_TOKEN=${TELEGRAM_PERSONAL_GATEWAY_TOKEN:-replace_with_strong_shared_gateway_token}
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq_telegram_personal_history.yml']
    networks:
      - default
      - shared-services
    restart: always

  kaspi_pay_adapter:
    image: node:20-alpine
    working_dir: /app
    command: ['sh', '-c', 'npm ci --omit=dev && npm start']
    restart: always
    env_file: .env
    environment:
      - PORT=4077
      - TOKEN_SECRET_KEY=${KASPI_PAY_TOKEN_SECRET_KEY}
      - KASPI_PAY_INTERNAL_SECRET=${KASPI_PAY_INTERNAL_SECRET}
      - KASPI_PAY_ADAPTER_STATE_DIR=/data/kaspi-pay-adapter
    volumes:
      - ./services/kaspi-pay-adapter:/app
      - kaspi_pay_adapter_data:/data/kaspi-pay-adapter
    healthcheck:
      test: ['CMD-SHELL', 'node -e ''http=require("http"); http.get("http://127.0.0.1:4077/health", r => process.exit(r.statusCode === 200 ? 0 : 1)).on("error", () => process.exit(1))''']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - default

  telegram-personal-gateway:
    build:
      context: ../chatwoot-messenger-gateway
      dockerfile: ./Dockerfile
    image: ${TELEGRAM_PERSONAL_GATEWAY_IMAGE:-onelink-telegram-personal-gateway:production}
    env_file: .env
    environment:
      - TELEGRAM_PERSONAL_GATEWAY_TOKEN=${TELEGRAM_PERSONAL_GATEWAY_TOKEN:-replace_with_strong_shared_gateway_token}
      - TELEGRAM_PERSONAL_GATEWAY_PUBLIC_BASE_URL=${TELEGRAM_PERSONAL_GATEWAY_PUBLIC_BASE_URL:-http://127.0.0.1:8010}
      - TELEGRAM_PERSONAL_GATEWAY_HOST=0.0.0.0
      - TELEGRAM_PERSONAL_GATEWAY_PORT=8000
      - TELEGRAM_PERSONAL_MEDIA_DIR=/data/telegram-personal-gateway
    volumes:
      - telegram_personal_gateway_data:/data/telegram-personal-gateway
    ports:
      - '127.0.0.1:${TELEGRAM_PERSONAL_GATEWAY_BIND_PORT:-8010}:8000'
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=5).read()']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      default:
      shared-services:
        aliases:
          - telegram-personal-gateway
    restart: always

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DATABASE:-chatwoot_production}
      - POSTGRES_USER=${POSTGRES_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-replace_with_strong_postgres_password}
    networks:
      default:
      shared-services:
        # Reused by evolution-api/.env.example for DATABASE_CONNECTION_URI and
        # CHATWOOT_IMPORT_DATABASE_CONNECTION_URI in the shared Docker network.
        aliases:
          - chatwoot-postgres

  redis:
    image: redis:alpine
    restart: always
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\" --appendonly yes"]
    env_file: .env
    volumes:
      - redis_data:/data
    ports:
      - '127.0.0.1:6379:6379'
    networks:
      default:
      shared-services:
        # Reused by evolution-api/.env.example for CACHE_REDIS_URI in the
        # shared Docker network.
        aliases:
          - chatwoot-redis

volumes:
  storage_data:
  postgres_data:
  redis_data:
  telegram_personal_gateway_data:
  kaspi_pay_adapter_data:

networks:
  shared-services:
    # External network shared with evolution-api/docker-compose.production.yaml.
    name: ${SHARED_SERVICES_NETWORK:-dokploy-network}
    external: true
