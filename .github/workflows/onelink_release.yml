name: OneLink Build and Deploy DEV

on:
  push:
    branches: [onelink-dev]

permissions:
  contents: read
  deployments: read

env:
  IMAGE_NAME: ghcr.io/demomastra2025-eng/chatwoot

jobs:
  release-gate:
    runs-on: ubuntu-24.04
    env:
      RAILS_ENV: test
      POSTGRES_HOST: localhost
      DISABLE_BOOTSNAP: 1
    concurrency:
      group: onelink-dev-gate
      cancel-in-progress: true
    outputs:
      runtime: ${{ steps.plan.outputs.runtime }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ''
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql/data
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the last successfully deployed DEV revision
        id: deployed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while IFS=$'\t' read -r deployment_id deployed_sha; do
            state="$(gh api \
              "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
              --jq '.[0].state // ""')"
            if [[ "$state" == success && "$deployed_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "sha=$deployed_sha" >> "$GITHUB_OUTPUT"
              echo 'found=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done < <(gh api \
            "repos/${GITHUB_REPOSITORY}/deployments?environment=development&per_page=100" \
            --jq '.[] | [.id, .sha] | @tsv')
          echo 'found=false' >> "$GITHUB_OUTPUT"
      - name: Classify and validate the pushed diff
        id: plan
        env:
          BASE_SHA: ${{ steps.deployed.outputs.sha }}
          FALLBACK_SHA: ${{ github.event.before }}
          HAS_DEV_PROOF: ${{ steps.deployed.outputs.found }}
          HEAD_SHA: ${{ github.sha }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          [[ "$RELEASE_REF" == refs/heads/onelink-dev ]] || {
            echo "Only refs/heads/onelink-dev can publish a release" >&2
            exit 1
          }
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BASE_SHA}^{commit}"; then
            BASE_SHA="$FALLBACK_SHA"
          fi
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BASE_SHA}^{commit}"; then
            BASE_SHA="${HEAD_SHA}^"
          fi
          git diff --check "$BASE_SHA" "$HEAD_SHA"
          python3 -m unittest script/onelink/test_change_plan.py
          python3 -m unittest script/onelink/test_dev_release_gate.py
          python3 script/onelink/change_plan.py \
            --base "$BASE_SHA" --head "$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT" \
            --validate-migrations --validate-release-surface
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          if [[ "$HAS_DEV_PROOF" != true ]]; then
            echo 'runtime=true' >> "$GITHUB_OUTPUT"
            echo '::notice::No successful DEV deployment proof exists; forcing bootstrap deployment.'
          fi
      - if: steps.plan.outputs.backend == 'true' || steps.plan.outputs.migrations == 'true'
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          bundler-cache: true
      - if: steps.plan.outputs.frontend == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - if: steps.plan.outputs.frontend == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - if: steps.plan.outputs.frontend == 'true'
        run: pnpm install --frozen-lockfile
      - name: Run changed Ruby checks
        if: steps.plan.outputs.backend == 'true' || steps.plan.outputs.migrations == 'true'
        env:
          BASE_SHA: ${{ steps.plan.outputs.base_sha }}
          HEAD_SHA: ${{ github.sha }}
          NODE_OPTIONS: --openssl-legacy-provider
        run: |
          mapfile -t ruby_files < <(python3 script/onelink/change_plan.py --base "$BASE_SHA" --head "$HEAD_SHA" --list ruby)
          mapfile -t specs < <(python3 script/onelink/change_plan.py --base "$BASE_SHA" --head "$HEAD_SHA" --list specs)
          if ((${#ruby_files[@]})); then bundle exec rubocop --force-exclusion "${ruby_files[@]}"; fi
          bundle exec rake db:create db:schema:load
          bundle exec rails zeitwerk:check
          if ((${#specs[@]})); then
            bundle exec rspec --profile=10 "${specs[@]}"
          fi
      - name: Run changed frontend checks
        if: steps.plan.outputs.frontend == 'true'
        env:
          BASE_SHA: ${{ steps.plan.outputs.base_sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          mapfile -t files < <(python3 script/onelink/change_plan.py --base "$BASE_SHA" --head "$HEAD_SHA" --list frontend)
          if ((${#files[@]})); then
            pnpm exec eslint "${files[@]}"
            pnpm exec vitest related "${files[@]}" --run --no-coverage
          else
            pnpm run build:app
          fi

  image:
    needs: release-gate
    if: needs.release-gate.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    concurrency:
      group: onelink-dev-image
      cancel-in-progress: true
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image_ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable release image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:dev
          build-args: |
            BUNDLE_WITHOUT=development:test
            EXECJS_RUNTIME=Disabled
            RAILS_ENV=production
            RAILS_SERVE_STATIC_FILES=true
            SOURCE_SHA=${{ github.sha }}
          cache-from: type=gha,scope=onelink-production
          cache-to: type=gha,mode=max,scope=onelink-production
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign image digest with GitHub OIDC
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${DIGEST}"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy-dev:
    needs: release-gate
    if: needs.release-gate.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    concurrency:
      group: onelink-dev-deploy
      cancel-in-progress: false
    environment:
      name: development
      url: https://dev.one-link.kz
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Create GitHub deployment record
        id: deployment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'development',
              auto_merge: false,
              required_contexts: [],
              payload: { source: 'onelink-dev' }
            });
            core.setOutput('id', deployment.data.id);
      - name: Install restricted SSH credentials
        env:
          SSH_KEY: ${{ secrets.ONELINK_DEV_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ONELINK_DEV_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/onelink-dev
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/onelink-dev ~/.ssh/known_hosts
      - name: Atomically deploy exact SHA to DEV
        env:
          DEPLOY_HOST: ${{ secrets.ONELINK_DEV_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ONELINK_DEV_DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/onelink-dev \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $GITHUB_SHA"
      - name: Publish deployment result
        if: always() && steps.deployment.outputs.id
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          DEPLOY_RESULT: ${{ job.status }}
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: process.env.DEPLOY_RESULT === 'success' ? 'success' : 'failure',
              environment: 'development',
              environment_url: 'https://dev.one-link.kz',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
