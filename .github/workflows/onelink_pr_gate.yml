name: OneLink PR Gate

on:
  pull_request:
    branches: [onelink-dev]

permissions:
  contents: read

concurrency:
  group: onelink-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.plan.outputs.backend }}
      container: ${{ steps.plan.outputs.container }}
      frontend: ${{ steps.plan.outputs.frontend }}
      high_risk: ${{ steps.plan.outputs.high_risk }}
      migrations: ${{ steps.plan.outputs.migrations }}
      runtime: ${{ steps.plan.outputs.runtime }}
      sidecar: ${{ steps.plan.outputs.sidecar }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate diff and classify checks
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --check "$BASE_SHA" "$HEAD_SHA"
          python3 -m unittest script/onelink/test_change_plan.py
          python3 script/onelink/change_plan.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT" \
            --validate-migrations \
            --validate-release-surface
      - name: Mark high-risk release surface
        if: steps.plan.outputs.high_risk == 'true'
        run: echo '::notice::High-risk paths changed; merge and production gates will run the expanded checks.'

  backend:
    needs: plan
    if: needs.plan.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ''
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql/data
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          bundler-cache: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint changed Ruby files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mapfile -t files < <(python3 script/onelink/change_plan.py --base "$BASE_SHA" --head "$HEAD_SHA" --list ruby)
          if ((${#files[@]})); then bundle exec rubocop --force-exclusion "${files[@]}"; fi
      - name: Run directly related Ruby specs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          NODE_OPTIONS: --openssl-legacy-provider
        run: |
          mapfile -t specs < <(python3 script/onelink/change_plan.py --base "$BASE_SHA" --head "$HEAD_SHA" --list specs)
          bundle exec rails zeitwerk:check
          if ((${#specs[@]})); then
            bundle exec rake db:create db:schema:load
            bundle exec rspec --profile=10 "${specs[@]}"
          fi

  frontend:
    needs: plan
    if: needs.plan.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and test related frontend files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mapfile -t files < <(python3 script/onelink/change_plan.py --base "$BASE_SHA" --head "$HEAD_SHA" --list frontend)
          if ((${#files[@]})); then
            pnpm exec eslint "${files[@]}"
            pnpm exec vitest related "${files[@]}" --run --no-coverage
          else
            pnpm run build:app
          fi

  container:
    needs: plan
    if: needs.plan.outputs.container == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Prove production image still builds
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          build-args: |
            BUNDLE_WITHOUT=development:test
            EXECJS_RUNTIME=Disabled
            RAILS_ENV=production
            RAILS_SERVE_STATIC_FILES=true
            SOURCE_SHA=${{ github.event.pull_request.head.sha }}
          cache-from: type=gha,scope=onelink-production

  gate:
    name: OneLink PR Gate
    if: always()
    needs: [plan, backend, frontend, container]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every selected check
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          BACKEND_SELECTED: ${{ needs.plan.outputs.backend }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          CONTAINER_SELECTED: ${{ needs.plan.outputs.container }}
          CONTAINER_RESULT: ${{ needs.container.result }}
          FRONTEND_SELECTED: ${{ needs.plan.outputs.frontend }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          [[ "$PLAN_RESULT" == success ]]
          [[ "$BACKEND_SELECTED" != true || "$BACKEND_RESULT" == success ]]
          [[ "$CONTAINER_SELECTED" != true || "$CONTAINER_RESULT" == success ]]
          [[ "$FRONTEND_SELECTED" != true || "$FRONTEND_RESULT" == success ]]
