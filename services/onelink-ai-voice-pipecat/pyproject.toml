[project]
name = "onelink-ai-voice-pipecat"
version = "0.1.0"
description = "Pipecat runtime sidecar for OneLink AI Voice"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "aiohttp>=3.14.3,<4",
  "cryptography>=50,<51",
  "fastapi>=0.115.6,<1",
  "httpx>=0.28,<1",
  "pipecat-ai[cartesia,elevenlabs,fish,google,openai,silero,websocket]==1.5.0",
  "uvicorn>=0.32,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
